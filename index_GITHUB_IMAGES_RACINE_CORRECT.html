function showChapter(n,title) {
  let page = restoreScripts(CHAPTER_HTML);
  const openScript = '<scr' + 'ipt>';
  const injected = openScript + 'window.__CHAPTER_DATA__=' +
    JSON.stringify({n:n,title:title}) + ';' + CLOSE_SCRIPT;
  page = page.replace('</head>', injected + '</head>');
  if(Number(n) === 5){
    page = page.replace('</body>', restoreScripts(CH5_EXTENSION_HTML) + '</body>');
  }
  frame.srcdoc = page;
}

async function openChapter5Quiz(which){
  const cfg = which === 'p3'
    ? {url:CH5_Q3_URL,title:"Quiz d'entraînement — Partie 3"}
    : {url:CH5_Q12_URL,title:"Quiz d'entraînement — Parties 1 et 2"};

  let win, doc;
  try{ win=frame.contentWindow; doc=frame.contentDocument; }catch(e){}
  if(!win || !doc) return;

  // Association stricte à l'un des deux enregistrements Supabase du chapitre 5.
  try{
    if(typeof win.getChapterSessionContext === 'function'){
      const ctx = await win.getChapterSessionContext();
      const db = ctx?.db;
      if(db){
        const {data,error} = await db.from('math_quizzes')
          .select('id,title,chapter_number,active')
          .eq('chapter_number',5)
          .eq('active',true)
          .eq('title',cfg.title)
          .limit(1);
        if(!error && data?.[0]?.id) win.__activeQuizTrackingId = data[0].id;
      }
    }
  }catch(err){ console.warn('Association quiz chapitre 5 :',err); }

  const modal=doc.getElementById('embeddedQuizModal');
  const quizFrame=doc.getElementById('embeddedQuizFrame');
  const title=doc.getElementById('embeddedQuizTitle');
  if(!modal || !quizFrame){ alert('La fenêtre de quiz intégrée est indisponible.'); return; }
  if(title) title.textContent=cfg.title;
  quizFrame.removeAttribute('srcdoc');
  quizFrame.src=cfg.url;
  modal.style.removeProperty('display');
  modal.setAttribute('aria-hidden','false');
  modal.classList.add('open');
}
const __quizPopupSources = new Map();

window.addEventListener('message', (event) => {
  const data = event.data || {};

  if (data.type === 'openChapter5QuizChooserOuter') {
    const chooser = document.getElementById('chapter5QuizChooserOuter');
    if (chooser) chooser.classList.add('open');
    return;
  }

  if (data.type === 'openChapter5Quiz') {
    openChapter5Quiz(data.which);
    return;
  }

  if (data.type === 'openChapter') {
    showChapter(data.n, data.title);
    return;
  }

  if (data.type === 'goHome') {
    showHome();
    return;
  }

  if (data.type === 'chapterHomeAction') {
    window.__chapterHomeAction = data.action || '';
    showHome();
    return;
  }

  if (data.type === 'math-quiz-result') {
    const transferId = data.transfer_id || ('quiz_' + Date.now());
    data.transfer_id = transferId;

    if (event.source) __quizPopupSources.set(transferId, event.source);

    try {
      frame.contentWindow.postMessage(data, '*');
    } catch (err) {
      console.error('Relais résultat -> chapitre impossible :', err);
    }
    return;
  }

  if (data.type === 'math-quiz-result-ack') {
    const transferId = data.transfer_id || null;
    const popup = transferId ? __quizPopupSources.get(transferId) : null;

    if (popup && typeof popup.postMessage === 'function') {
      try {
        popup.postMessage(data, '*');
      } catch (err) {
        console.error('Relais confirmation -> quiz impossible :', err);
      }
    }

    if (transferId) {
      setTimeout(() => __quizPopupSources.delete(transferId), 15000);
    }
  }
});

frame.addEventListener('load',()=>{
  const action = window.__chapterHomeAction || '';
  if(!action) return;
  window.__chapterHomeAction = '';

  function openRequestedHomeSection(attempt=0){
    try{
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      if(!win || !doc) return;

      // Mes progrès a besoin que le profil élève soit déjà chargé.
      if(action==='progress'){
        const profile = win.currentMathProfile;
        if((!profile || profile.role!=='student') && attempt < 30){
          setTimeout(()=>openRequestedHomeSection(attempt+1),100);
          return;
        }
        doc.getElementById('studentProgressBtn')?.click();
        return;
      }

      if(action==='students') doc.getElementById('manageStudentsBtn')?.click();
      if(action==='chapters') doc.getElementById('manageChaptersBtn')?.click();
      if(action==='tracking') doc.getElementById('homeTeacherQuizTrackingBtn')?.click();
    }catch(err){
      console.error('Ouverture du menu depuis un chapitre :',err);
    }
  }

  setTimeout(()=>openRequestedHomeSection(0),80);
});

showHome();
</script>

<script>
/* ===== CORRECTIF EXTERNE : CLIC SUPPRIMER ÉLÈVE ===== */
(function(){
  const frame = document.getElementById('view');
  if(!frame) return;

  function installDeleteFix(){
    let win, doc;
    try{
      win = frame.contentWindow;
      doc = win?.document;
    }catch(e){ return; }
    if(!doc || doc.__deleteStudentClickFixInstalled) return;
    doc.__deleteStudentClickFixInstalled = true;

    const style = doc.createElement('style');
    style.textContent = `
      #studentAdminPanel .student-row button{
        pointer-events:auto !important;
        cursor:pointer !important;
        position:relative !important;
        z-index:9999 !important;
      }
      #studentAdminPanel .student-row{
        position:relative !important;
      }
      #studentAdminPanel .student-row > *{
        pointer-events:auto !important;
      }
    `;
    doc.head?.appendChild(style);

    doc.addEventListener('click', async (event)=>{
      const btn = event.target?.closest?.('#studentAdminPanel .student-row button');
      if(!btn) return;
      if(String(btn.textContent || '').trim().toLowerCase() !== 'supprimer') return;

      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();

      const row = btn.closest('.student-row');
      const login = row?.querySelector('.student-row-id')?.textContent?.trim() || '';

      if(!login){
        alert('Impossible d’identifier cet élève.');
        return;
      }

      const profile = win.currentMathProfile;
      if(!profile || profile.role !== 'teacher'){
        alert('Connexion professeur requise.');
        return;
      }

      const sb = win.mathSupabase;
      if(!sb){
        alert('Connexion Supabase indisponible.');
        return;
      }

      let student;
      try{
        const { data, error } = await sb
          .from('math_profiles')
          .select('id,login,first_name,last_name,role')
          .eq('login', login)
          .eq('role', 'student')
          .maybeSingle();

        if(error) throw error;
        student = data;
      }catch(err){
        alert('Impossible de retrouver l’élève dans Supabase : ' + (err?.message || err));
        return;
      }

      if(!student?.id){
        alert('Élève introuvable dans Supabase.');
        return;
      }

      const fullName = [student.first_name, student.last_name].filter(Boolean).join(' ') || login;
      if(!confirm(
        'Supprimer définitivement le compte de ' + fullName + ' ?\n\n' +
        'Ses résultats et son compte de connexion seront supprimés. Cette action est irréversible.'
      )) return;

      const previous = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Suppression…';

      try{
        const { data, error } = await sb.functions.invoke('delete-math-student', {
          body: { student_id: student.id }
        });

        if(error) throw new Error(error.message || 'Erreur Edge Function.');
        if(!data || data.ok !== true){
          throw new Error(data?.error || data?.detail || 'Suppression non confirmée par Supabase.');
        }

        alert('Élève supprimé définitivement.');
        if(typeof win.loadStudentsFromSupabase === 'function'){
          await win.loadStudentsFromSupabase();
        }else{
          location.reload();
        }
      }catch(err){
        console.error('Suppression élève :', err);
        alert(
          'Suppression impossible.\n\n' +
          (err?.message || String(err)) +
          '\n\nVérifie que la fonction Edge "delete-math-student" est bien déployée.'
        );
        btn.disabled = false;
        btn.textContent = previous;
      }
    }, true);
  }

  frame.addEventListener('load', ()=>{
    setTimeout(installDeleteFix, 0);
    setTimeout(installDeleteFix, 300);
  });

  setTimeout(installDeleteFix, 500);
})();
</script>

<script>
/* ===== JOURNAL DE CLASSE — AJOUT EXTERNE SÛR ===== */
(function(){
  const DEFAULT_URL='https://cindyjanssen31.github.io/Journal-eleve/?code=math-1b--mathematiques';
  const frame=document.getElementById('view');
  if(!frame) return;

  async function getDb(win){
    if(win?.mathSupabase) return win.mathSupabase;
    try{
      if(typeof win?.getChapterSessionContext==='function'){
        const ctx=await win.getChapterSessionContext();
        return ctx?.db||null;
      }
    }catch(e){}
    return null;
  }

  async function getJournalUrl(win){
    let url=DEFAULT_URL;
    try{
      const db=await getDb(win);
      if(db){
        const res=await db.from('math_app_settings').select('value').eq('key','journal_url').maybeSingle();
        if(!res.error && res.data?.value) url=String(res.data.value);
      }
    }catch(e){}
    return url;
  }

  async function install(){
    let doc,win;
    try{ doc=frame.contentDocument; win=frame.contentWindow; }catch(e){ return; }
    if(!doc||!win) return;

    const progress=doc.getElementById('studentProgressBtn');
    const nav=progress?.parentElement;
    if(progress && nav && !doc.getElementById('studentJournalBtn')){
      const a=doc.createElement('a');
      a.id='studentJournalBtn';
      a.className='role-nav-btn student-nav';
      a.target='_blank';
      a.rel='noopener';
      a.style.textDecoration='none';
      a.innerHTML='<span class="role-nav-icon">▤</span><span>Journal de classe</span>';
      progress.insertAdjacentElement('afterend',a);
      a.href=await getJournalUrl(win);
    } else if(doc.getElementById('studentJournalBtn')){
      doc.getElementById('studentJournalBtn').href=await getJournalUrl(win);
    }

    const manageBtn=doc.getElementById('manageChaptersBtn');
    if(manageBtn && !manageBtn.dataset.journalBound){
      manageBtn.dataset.journalBound='1';
      manageBtn.addEventListener('click',()=>setTimeout(()=>installTeacherSetting(doc,win),30));
    }
  }

  async function installTeacherSetting(doc,win){
    const panel=doc.getElementById('chapterVisibilityPanel');
    const card=panel?.querySelector('.chapter-visibility-card');
    if(!card || doc.getElementById('journalSettingBox')) return;

    const box=doc.createElement('div');
    box.id='journalSettingBox';
    box.style.cssText='margin:14px 0 18px;padding:14px;border:1px solid #dce8f4;border-radius:16px;background:#f7fbff';
    box.innerHTML=`<h3 style="margin:0 0 8px;color:#17355e">Journal de classe des élèves</h3>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input id="journalUrlInput" type="url" style="flex:1;min-width:280px;padding:10px 12px;border:1px solid #cad9e8;border-radius:10px">
        <button id="journalUrlSave" type="button" style="border:0;border-radius:10px;padding:10px 14px;background:#17355e;color:#fff;font-weight:800;cursor:pointer">Enregistrer</button>
      </div>
      <div id="journalUrlStatus" style="margin-top:7px;color:#66788d;font-size:12px">Lien utilisé par le bouton Journal de classe.</div>`;
    const head=card.querySelector('.chapter-visibility-head');
    head?.insertAdjacentElement('afterend',box);

    const input=box.querySelector('#journalUrlInput');
    input.value=await getJournalUrl(win);
    box.querySelector('#journalUrlSave')?.addEventListener('click',async()=>{
      const status=box.querySelector('#journalUrlStatus');
      const url=String(input.value||'').trim();
      if(!/^https?:\/\//i.test(url)){ status.textContent='Adresse invalide.'; return; }
      try{
        const db=await getDb(win);
        if(!db) throw new Error('Supabase indisponible');
        const user=(await db.auth.getUser()).data?.user;
        const res=await db.from('math_app_settings').upsert({key:'journal_url',value:url,updated_at:new Date().toISOString(),updated_by:user?.id||null},{onConflict:'key'});
        if(res.error) throw res.error;
        status.textContent='Lien enregistré.';
        const link=doc.getElementById('studentJournalBtn');
        if(link) link.href=url;
      }catch(e){ status.textContent='Impossible d’enregistrer : '+(e?.message||String(e)); }
    });
  }

  frame.addEventListener('load',()=>{ setTimeout(install,50); setTimeout(install,500); });
  setTimeout(install,500);
})();
</script>

      st.id='menuIconStyleV2';
      st.textContent=`
        .role-nav-icon{width:34px!important;height:34px!important;flex:0 0 34px!important;display:grid!important;place-items:center!important;border-radius:11px!important;background:#f5f8fc!important;color:#36597d!important;box-shadow:inset 0 0 0 1px rgba(72,103,136,.08)!important}
        .role-nav-icon svg{width:20px!important;height:20px!important;fill:none!important;stroke:currentColor!important;stroke-width:1.9!important;stroke-linecap:round!important;stroke-linejoin:round!important}
        .role-nav-icon.nav-home{background:#eaf4ff!important;color:#3e76aa!important}
        .role-nav-icon.nav-progress{background:#edf8ee!important;color:#4d8d5a!important}
        .role-nav-icon.nav-students{background:#fff0f5!important;color:#b85c82!important}
        .role-nav-icon.nav-chapters{background:#f4efff!important;color:#7c63b6!important}
        .role-nav-icon.nav-quiz{background:#fff6df!important;color:#b47a2f!important}
        .role-nav-icon.nav-journal{background:#eef4ff!important;color:#526f9c!important}
        .role-nav-btn.active .role-nav-icon{background:#fff!important;box-shadow:0 4px 10px rgba(40,70,105,.10),inset 0 0 0 1px rgba(72,103,136,.08)!important}
      `;
      doc.head.appendChild(st);
    }

    const map=[
      ['.common-nav','home','nav-home'],
      ['#studentProgressBtn','progress','nav-progress'],
      ['#manageStudentsBtn','students','nav-students'],
      ['#manageChaptersBtn','chapters','nav-chapters'],
      ['#homeTeacherQuizTrackingBtn','quiz','nav-quiz'],
      ['#teacherQuizTrackingBtn','quiz','nav-quiz'],
      ['#studentJournalBtn','journal','nav-journal']
    ];
    map.forEach(([sel,key,cls])=>{
      doc.querySelectorAll(sel).forEach(btn=>{
        const icon=btn.querySelector('.role-nav-icon');
        if(!icon) return;
        icon.className='role-nav-icon '+cls;
        icon.innerHTML=ICONS[key];
      });
    });
  }

  const frame=document.getElementById('view');
  frame?.addEventListener('load',()=>{
    install();
    setTimeout(install,80);
    setTimeout(install,350);
    setTimeout(install,900);
  });
  setInterval(install,1500);
  setTimeout(install,300);
})();
</script>
</body>
</html>
