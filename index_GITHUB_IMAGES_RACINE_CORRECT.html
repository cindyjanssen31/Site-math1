h.PI-d)};\\n    const dist=(p,a,c)=>{\\n      const dx=c.x-a.x,dy=c.y-a.y,L2=dx*dx+dy*dy||1;\\n      const t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2;\\n      return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));\\n    };\\n    const TOL_POINT=18;               // passage par un point : max 8 px\\n    const TOL_ANGLE=5*Math.PI/180; // parallélisme/perpendicularité : max 1,5°\\n    const baseAngle=b.line?ang(b.line.a,b.line.b):null;\\n    const isPar=(l)=>diff(baseAngle,ang(l.a,l.b))<=TOL_ANGLE;\\n    const isPerp=(l)=>Math.abs(diff(baseAngle,ang(l.a,l.b))-Math.PI/2)<=TOL_ANGLE;\\n    const through=(l,p)=>dist(p,l.a,l.b)<=TOL_POINT;\\n\\n    if(type==='parallel'){\\n      const good=straight.filter(l=>through(l,b.p)&&isPar(l));\\n      if(good.length<1) return {ok:false,msg:\\\"Pas encore : trace une droite qui passe par T et qui a la même direction que g.\\\"};\\n      return {ok:true,msg:\\\"Correct : une droite passant par T et parallèle à g a bien été tracée.\\\"};\\n    }\\n    if(type==='perp'){\\n      const good=straight.filter(l=>through(l,b.p)&&isPerp(l));\\n      if(good.length<1) return {ok:false,msg:\\\"Pas encore : trace une droite qui passe par N et qui forme un angle droit avec w.\\\"};\\n      return {ok:true,msg:\\\"Correct : une droite passant par N et perpendiculaire à w a bien été tracée.\\\"};\\n    }\\n    if(type==='mediatrix'){\\n      const s=b.seg,mid={x:(s.a.x+s.b.x)/2,y:(s.a.y+s.b.y)/2},segA=ang(s.a,s.b);\\n      const good=straight.filter(l=>dist(mid,l.a,l.b)<=TOL_POINT && Math.abs(diff(segA,ang(l.a,l.b))-Math.PI/2)<=TOL_ANGLE);\\n      if(good.length<1) return {ok:false,msg:\\\"Pas encore : la droite doit passer près du milieu de [JK] et être perpendiculaire à [JK].\\\"};\\n      return {ok:true,msg:\\\"Correct : la médiatrice de [JK] est reconnue. Les traits de construction et les arcs de compas sont acceptés.\\\"};\\n    }\\n    if(type==='combo_parallel_perp'){\\n      const gp=straight.filter(l=>through(l,b.p)&&isPar(l));\\n      const gq=straight.filter(l=>through(l,b.q)&&isPerp(l));\\n      if(gp.length<1||gq.length<1) return {ok:false,msg:\\\"Il faut une droite parallèle à d passant par P et une droite perpendiculaire à d passant par Q.\\\"};\\n      return {ok:true,msg:\\\"Correct : les deux constructions demandées sont reconnues.\\\"};\\n    }\\n    if(type==='double_perp'){\\n      const ga=straight.filter(l=>through(l,b.p)&&isPerp(l));\\n      const gb=straight.filter(l=>through(l,b.q)&&isPerp(l));\\n      if(ga.length<1||gb.length<1) return {ok:false,msg:\\\"Il faut une perpendiculaire à r passant par A et une autre passant par B.\\\"};\\n      return {ok:true,msg:\\\"Correct : les deux perpendiculaires attendues sont reconnues. Elles sont donc parallèles entre elles.\\\"};\\n    }\\n    return oldCheck ? oldCheck() : {ok:false,msg:\\\"Construction non reconnue.\\\"};\\n  };\\n})();\\n<\\\\/script>\\n\\n<script>\\n/* V14 — la touche Vérifier utilise bien le validateur souple actuel */\\ntry {\\n  checkGeo = window.checkGeo;\\n} catch(e) {}\\n<\\\\/script>\\n\\n<script>\\n/* Affichage professionnel des fractions : numérateur au-dessus du dénominateur */\\nfunction formatMathFractions(value){\\n  const s=String(value ?? '');\\n  return s.replace(/(-?)(\\\\d+)\\\\s*\\\\/\\\\s*(\\\\d+)/g,(m,sign,num,den)=>{\\n    return `<span class=\\\"frac-wrap\\\">${sign?'<span class=\\\"frac-sign\\\">−</span>':''}<span class=\\\"frac\\\"><span class=\\\"num\\\">${num}</span><span class=\\\"den\\\">${den}</span></span></span>`;\\n  });\\n}\\n<\\\\/script>\\n</body></html>\";\n\n/* ===== MOTEUR GÉNÉRIQUE DES QUIZ INTÉGRÉS ===== */\nfunction getEmbeddedQuizForChapter(chapterNo){\n  const registry = {\n    1: (typeof EMBEDDED_QUIZ_CH1_HTML === 'string' ? EMBEDDED_QUIZ_CH1_HTML : null),\n    3: (typeof EMBEDDED_QUIZ_CH3_HTML === 'string' ? EMBEDDED_QUIZ_CH3_HTML : null),\n    4: (typeof EMBEDDED_QUIZ_CH4_HTML === 'string' ? EMBEDDED_QUIZ_CH4_HTML : null)\n  };\n  return registry[Number(chapterNo)] || null;\n}\n\n/*\n  Pour les futurs quiz :\n  - si le quiz contient déjà le pont \"math-quiz-result\", on le garde tel quel ;\n  - sinon, ce moteur ajoute automatiquement la transmission du score et le bouton Fermer.\n  Cela évite de réécrire le code de chaque quiz.\n*/\nfunction prepareEmbeddedQuizHtml(rawHtml){\n  // Chaque chapitre garde sa propre page HTML complète.\n  return String(rawHtml || '').split('<\\\\/script>').join('</scr' + 'ipt>');\n}\n\nasync function openQuizWithTracking(item){\n  const chapterNo = Number(currentChapterNumber());\n  const embeddedQuiz = getEmbeddedQuizForChapter(chapterNo);\n\n  if(!item?.url && !embeddedQuiz){\n    if(typeof notify === 'function'){\n      notify((item?.name || 'Quiz') + ' — quiz non encore intégré');\n    }\n    return;\n  }\n\n  __activeQuizTrackingId = await resolveQuizTrackingId(item);\n\n  if(embeddedQuiz){\n    const modal = document.getElementById('embeddedQuizModal');\n    const frame = document.getElementById('embeddedQuizFrame');\n    const title = document.getElementById('embeddedQuizTitle');\n\n    if(title){\n      title.textContent = item?.name || \"Quiz d'entraînement\";\n    }\n\n    if(frame){\n      frame.srcdoc = prepareEmbeddedQuizHtml(embeddedQuiz);\n    }\n\n    if(modal){\n      modal.style.removeProperty('display'); modal.setAttribute('aria-hidden','false'); modal.classList.add('open');\n    }\n    return;\n  }\n\n  // Un ancien quiz avec lien externe continue de fonctionner.\n  window.open(item.url, '_blank');\n}\n\nasync function saveIncomingQuizResult(payload){\n  const ctx = await getChapterSessionContext();\n  const db = ctx.db;\n  const profile = ctx.profile;\n\n  if(!db) throw new Error('Connexion Supabase indisponible dans le chapitre.');\n  if(!profile) throw new Error('Aucun profil connecté trouvé dans le chapitre.');\n  if(profile.role !== 'student') throw new Error('Le compte connecté n’est pas un compte élève.');\n\n  let quizId = payload?.quiz_id || __activeQuizTrackingId;\n\n  if(!quizId && typeof resolveQuizTrackingId === 'function'){\n    quizId = await resolveQuizTrackingId({\n      id:'trainingQuiz',\n      name:\"Quiz d'entraînement\",\n      type:'quiz',\n      url:''\n    });\n    __activeQuizTrackingId = quizId || null;\n  }\n\n  if(!quizId){\n    throw new Error(\n      'Aucun quiz actif trouvé dans Supabase pour ce chapitre. ' +\n      'Vérifie la table math_quizzes.'\n    );\n  }\n\n  const correctCount = Number(payload?.correct_count);\n  const totalQuestions = Number(payload?.total_questions);\n\n  if(!Number.isFinite(correctCount) || !Number.isFinite(totalQuestions) || totalQuestions <= 0){\n    throw new Error('Le score reçu du quiz est invalide.');\n  }\n\n  const quizInfo = await db\n    .from('math_quizzes')\n    .select('id,title,pass_percentage')\n    .eq('id', quizId)\n    .single();\n\n  if(quizInfo.error){\n    throw new Error('Lecture du quiz refusée : ' + (quizInfo.error.message || quizInfo.error.code || 'erreur Supabase'));\n  }\n\n  const percentage = Math.round((correctCount / totalQuestions) * 10000) / 100;\n  const score20 = Math.round((correctCount / totalQuestions) * 2000) / 100;\n  const passPercentage = Number(quizInfo.data?.pass_percentage ?? 50);\n  const passed = percentage >= passPercentage;\n\n  const last = await db\n    .from('math_quiz_attempts')\n    .select('attempt_number')\n    .eq('quiz_id', quizId)\n    .eq('student_id', profile.id)\n    .order('attempt_number', {ascending:false})\n    .limit(1);\n\n  if(last.error){\n    throw new Error('Lecture des tentatives refusée : ' + (last.error.message || last.error.code || 'erreur Supabase'));\n  }\n\n  const attemptNumber = last.data?.length\n    ? Number(last.data[0].attempt_number || 0) + 1\n    : 1;\n\n  const insert = await db\n    .from('math_quiz_attempts')\n    .insert({\n      quiz_id:quizId,\n      student_id:profile.id,\n      attempt_number:attemptNumber,\n      correct_count:correctCount,\n      total_questions:totalQuestions,\n      percentage:percentage,\n      score_20:score20,\n      passed:passed,\n      answers:Array.isArray(payload?.answers) ? payload.answers : []\n    })\n    .select('id,attempt_number,score_20')\n    .single();\n\n  if(insert.error){\n    throw new Error('Enregistrement refusé : ' + (insert.error.message || insert.error.code || 'erreur Supabase'));\n  }\n\n  if(typeof notify === 'function'){\n    notify('Résultat enregistré : ' + score20.toFixed(1).replace('.0','') + '/20');\n  }\n\n  const modal = document.getElementById('quizResultsModal');\n  if(modal && getComputedStyle(modal).display !== 'none'){\n    loadQuizResultsIntoFollowup();\n  }\n\n  return {score20, attemptNumber, id:insert.data?.id || null};\n}\n\nif(!window.__quizResultBridgeInstalled){\n  window.__quizResultBridgeInstalled = true;\n  const __quizTransfers = new Map();\n\n  window.addEventListener('message', async event => {\n  const data = event?.data;\n  if(!data) return;\n\n  if(data.type === 'closeEmbeddedQuiz'){\n    if(typeof closeEmbeddedQuiz === 'function') closeEmbeddedQuiz();\n    return;\n  }\n\n  if(data.type !== 'math-quiz-result') return;\n\n  const transferId = data.transfer_id || ('quiz_' + Date.now());\n  data.transfer_id = transferId;\n\n  try{\n    const result = await saveIncomingQuizResult(data);\n\n    if(event.source && typeof event.source.postMessage === 'function'){\n      event.source.postMessage({\n        type:'math-quiz-result-ack',\n        transfer_id:transferId,\n        ok:true,\n        score_20:result?.score20 ?? null\n      }, '*');\n    }\n  }catch(err){\n    console.error('Réception/enregistrement du résultat :', err);\n\n    if(event.source && typeof event.source.postMessage === 'function'){\n      event.source.postMessage({\n        type:'math-quiz-result-ack',\n        transfer_id:transferId,\n        ok:false,\n        error:String(err?.message || err || 'Erreur inconnue')\n      }, '*');\n    }\n  }\n});\n}\n\n\nwindow.__quizBridgeSyntaxRepaired = true;\n\nwindow.openMathSpaceItem = function(item){\n\n    const chapterNoForInternalQuiz = Number(currentChapterNumber());\n    const internalQuizName = String(item?.name || '')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g,'')\n      .trim()\n      .toLowerCase();\n\n    const isTrainingQuizItem =\n      item?.id === 'trainingQuiz' ||\n      (internalQuizName.includes('quiz') && internalQuizName.includes('entrainement'));\n\n    // Chapitre 5 : deux quiz distincts. Le sélecteur est géré par la page principale.\n    if(chapterNoForInternalQuiz === 5 && isTrainingQuizItem){\n      window.parent.postMessage({type:'openChapter5QuizChooserOuter'}, '*');\n      return;\n    }\n\n    const isInternalTrainingQuiz =\n      [1,3,4].includes(chapterNoForInternalQuiz) && isTrainingQuizItem;\n\n    // Les quiz des chapitres 1, 3 et 4 sont intégrés dans l'application.\n    // Un ancien lien OneDrive enregistré ne doit jamais reprendre la priorité.\n    if(isInternalTrainingQuiz){\n      openQuizWithTracking({\n        ...item,\n        type:'quiz',\n        url:''\n      });\n      return;\n    }\n\n    if(!item) return;\n\n    const normalizedName = String(item.name || '')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g,'')\n      .trim()\n      .toLowerCase();\n\n    // Actions internes de \"Mon suivi\"\n    if(\n      item.id === 'quizResults' ||\n      normalizedName === 'mes resultats aux quiz' ||\n      normalizedName === 'mes resultats des quiz' ||\n      normalizedName.includes('resultat') && normalizedName.includes('quiz')\n    ){\n      if(typeof openQuizResultsModal === 'function'){\n        openQuizResultsModal();\n      }else if(typeof openFollowup === 'function'){\n        openFollowup('quizResults');\n      }\n      return;\n    }\n\n    if(\n      item.id === 'documents' ||\n      normalizedName === 'mes documents consultés' ||\n      normalizedName === 'mes documents consultes'\n    ){\n      if(typeof openFollowup === 'function') openFollowup('documents');\n      return;\n    }\n\n    if(\n      item.id === 'objectives' ||\n      normalizedName === 'mes objectifs'\n    ){\n      if(typeof openFollowup === 'function') openFollowup('objectives');\n      return;\n    }\n\n    if(item.type === 'page'){\n      if(item.page === 'tools' || item.id === 'tools'){\n        if(typeof openToolsPage === 'function'){\n          openToolsPage();\n          return;\n        }\n      }\n      alert('Cette page interne n’est pas encore configurée.');\n      return;\n    }\n\n    if(item.type === 'quiz'){\n      openQuizWithTracking(item);\n      return;\n    }\n\n    if(typeof openExternalResource === 'function'){\n      openExternalResource(item.url);\n    }else if(item.url){\n      window.open(item.url, '_blank', 'noopener,noreferrer');\n    }else{\n      alert('Aucun lien n’est encore renseigné pour cet élément.');\n    }\n  };\n\n  // 4) Remplace le rendu des lignes pour gérer aussi les pages internes.\n  window.buildItemRow = function(item){\n    const row = document.createElement('div');\n    row.className = 'row';\n    row.dataset.dynamicItem = '1';\n    row.dataset.itemId = item.id;\n\n    const left = document.createElement('div');\n    left.className = 'row-left';\n\n    const icon = document.createElement('span');\n    icon.style.marginRight = '8px';\n    icon.textContent =\n      item.type === 'page' ? '📂' :\n      item.type === 'quiz' ? '⭐' :\n      item.type === 'video' ? '▶' :\n      item.type === 'link' ? '🔗' : '📄';\n\n    const label = document.createElement('span');\n    label.textContent = item.name;\n\n    left.append(icon, label);\n\n    const btn = document.createElement('button');\n    btn.type = 'button';\n    btn.textContent = item.button || 'Ouvrir';\n    btn.className = 'open-btn';\n    btn.onclick = (e) => {\n      e.preventDefault();\n      e.stopPropagation();\n      openMathSpaceItem(item);\n    };\n\n    const normalizedName = String(item.name || '')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g,'')\n      .trim()\n      .toLowerCase();\n\n    const isQuizResultsItem =\n      item.id === 'quizResults' ||\n      normalizedName === 'mes resultats aux quiz' ||\n      normalizedName === 'mes resultats des quiz' ||\n      (normalizedName.includes('resultat') && normalizedName.includes('quiz'));\n\n    const isFollowupItem =\n      isQuizResultsItem ||\n      item.id === 'documents' ||\n      item.id === 'objectives' ||\n      normalizedName === 'mes documents consultes' ||\n      normalizedName === 'mes objectifs';\n\n    if(isFollowupItem){\n      row.style.cursor = 'pointer';\n      row.onclick = (e) => {\n        if(e.target === btn) return;\n        openMathSpaceItem(item);\n      };\n    }\n\n    row.append(left, btn);\n    return row;\n  };\n\n  // 5) Renforce spécifiquement la ligne Fiches outils déjà affichée.\n  function forceToolsButton(){\n    const card = document.querySelector('.grid > .card[data-rubric-id=\"learn\"]');\n    if(!card) return;\n\n    const rows = Array.from(card.querySelectorAll('.row[data-dynamic-item=\"1\"]'));\n    rows.forEach(row => {\n      const txt = (row.textContent || '').toLowerCase();\n      if(txt.includes('fiches outils')){\n        const btn = row.querySelector('button');\n        if(btn){\n          btn.onclick = (e) => {\n            e.preventDefault();\n            e.stopPropagation();\n            openToolsPage();\n          };\n        }\n      }\n    });\n  }\n\n  // 6) Dans le gestionnaire, si l'élément Fiches outils est affiché,\n  //    sélectionne \"Page interne\".\n  function refreshManager(){\n    ensurePageTypeOptions();\n\n    if(!ACTIVE_RUBRIC_ID || typeof getItems !== 'function') return;\n    const items = getItems(ACTIVE_RUBRIC_ID);\n    const rows = Array.from(document.querySelectorAll('#itemList .item-row'));\n\n    rows.forEach((row, index) => {\n      const item = items[index];\n      if(!item) return;\n\n      const selects = Array.from(row.querySelectorAll('select'));\n      const typeSel = selects[0];\n      if(typeSel && item.type === 'page'){\n        typeSel.value = 'page';\n      }\n\n      // Une page interne ne nécessite pas de lien externe.\n      const urlInput = Array.from(row.querySelectorAll('input'))\n        .find(i => i.placeholder === 'Lien');\n      if(urlInput){\n        if(item.type === 'page'){\n          urlInput.value = '';\n          urlInput.placeholder = 'Page interne : aucun lien nécessaire';\n          urlInput.disabled = true;\n        }else{\n          urlInput.disabled = false;\n          urlInput.placeholder = 'Lien';\n        }\n      }\n    });\n  }\n\n  // 7) Observe les rerendus.\n  const itemList = document.getElementById('itemList');\n  if(itemList){\n    new MutationObserver(() => setTimeout(refreshManager, 0))\n      .observe(itemList, {childList:true, subtree:true});\n  }\n\n  // Après rendu initial, force le bon comportement.\n  setTimeout(() => {\n    ensurePageTypeOptions();\n    if(typeof renderItemsForRubric === 'function') renderItemsForRubric('learn');\n    setTimeout(forceToolsButton, 0);\n  }, 0);\n\n  // À chaque retour / re-rendu, on réapplique.\n  const originalRender = window.renderItemsForRubric;\n  if(typeof originalRender === 'function'){\n    window.renderItemsForRubric = function(rubricId){\n      originalRender(rubricId);\n      if(rubricId === 'learn') setTimeout(forceToolsButton, 0);\n    };\n  }\n});\n<\\/script>\n\n\n<script>\n/* Correctif : suppression fiable des catégories Fiches outils */\ndocument.addEventListener('DOMContentLoaded', () => {\n\n  window.deleteToolZone = function(zoneId){\n    const zones = getToolZones();\n    const index = zones.findIndex(z => z.id === zoneId);\n    if(index === -1) return;\n\n    const zone = zones[index];\n    const ok = confirm('Supprimer la catégorie « ' + zone.name + ' » et toutes les fiches qu’elle contient ?');\n    if(!ok) return;\n\n    zones.splice(index, 1);\n    setToolZones(zones);\n\n    renderToolsPage();\n    renderToolsAdmin();\n  };\n\n  function reinforceDeleteButtons(){\n    const zones = getToolZones();\n    const blocks = Array.from(document.querySelectorAll('#toolsZoneAdminList .zone-admin-block'));\n\n    blocks.forEach((block, index) => {\n      const zone = zones[index];\n      if(!zone) return;\n\n      const top = block.querySelector('.zone-admin-row');\n      if(!top) return;\n\n      let del = Array.from(top.querySelectorAll('button'))\n        .find(btn => (btn.textContent || '').trim().toLowerCase() === 'supprimer');\n\n      if(!del){\n        del = document.createElement('button');\n        del.type = 'button';\n        del.textContent = 'Supprimer';\n        del.className = 'danger';\n        top.appendChild(del);\n      }\n\n      del.onclick = (e) => {\n        e.preventDefault();\n        e.stopImmediatePropagation();\n        deleteToolZone(zone.id);\n      };\n    });\n  }\n\n  const originalRenderToolsAdmin = window.renderToolsAdmin;\n  if(typeof originalRenderToolsAdmin === 'function'){\n    window.renderToolsAdmin = function(){\n      originalRenderToolsAdmin();\n      setTimeout(reinforceDeleteButtons, 0);\n    };\n  }\n\n  const manageBtn = document.getElementById('toolsManageBtn');\n  manageBtn?.addEventListener('click', () => {\n    setTimeout(reinforceDeleteButtons, 0);\n  });\n\n  const host = document.getElementById('toolsZoneAdminList');\n  if(host){\n    new MutationObserver(() => setTimeout(reinforceDeleteButtons, 0))\n      .observe(host, {childList:true, subtree:true});\n  }\n});\n<\\/script>\n\n\n<div class=\"challenge-submenu\" id=\"challengeSubmenu\">\n  <div class=\"challenge-submenu-card\">\n    <div class=\"challenge-submenu-head\">\n      <h2>Je me challenge</h2>\n      <button class=\"challenge-submenu-close\" id=\"challengeSubmenuClose\" type=\"button\">×</button>\n    </div>\n\n    <div class=\"challenge-options\">\n      <div class=\"challenge-option\">\n        <span>Défis math 1</span>\n        <button type=\"button\" id=\"challenge1Open\">Ouvrir</button>\n      </div>\n      <div class=\"challenge-option\">\n        <span>Défis math 2</span>\n        <button type=\"button\" id=\"challenge2Open\">Ouvrir</button>\n      </div>\n    </div>\n\n    <details class=\"challenge-settings\">\n      <summary>⚙ Paramétrer les liens</summary>\n      <div class=\"challenge-setting-row\">\n        <label for=\"challenge1Url\">Défis math 1</label>\n        <input id=\"challenge1Url\" type=\"text\" placeholder=\"Lien OneDrive ou autre\">\n      </div>\n      <div class=\"challenge-setting-row\">\n        <label for=\"challenge2Url\">Défis math 2</label>\n        <input id=\"challenge2Url\" type=\"text\" placeholder=\"Lien OneDrive ou autre\">\n      </div>\n    </details>\n  </div>\n</div>\n\n\n<script>\n/* --- Sous-menu Je me challenge --- */\ndocument.addEventListener('DOMContentLoaded', () => {\n\n  function challengeStorageKey(){\n    const d = window.__CHAPTER_DATA__ || {n:3};\n    return 'mathspace_challenge_links_chapter_' + String(d.n || 3);\n  }\n\n  function getChallengeLinks(){\n    try{\n      const raw = localStorage.getItem(challengeStorageKey());\n      if(raw) return JSON.parse(raw);\n    }catch(e){}\n    return {challenge1:'', challenge2:''};\n  }\n\n  function setChallengeLinks(data){\n    try{\n      localStorage.setItem(challengeStorageKey(), JSON.stringify(data));\n    }catch(e){}\n  }\n\n  function normalizeChallengeUrl(value){\n    let url=(value||'').trim();\n    if(!url) return '';\n    if(/^https?:\\/\\//i.test(url)) return url;\n    return 'https://' + url;\n  }\n\n  function openChallengeUrl(url){\n    const u = normalizeChallengeUrl(url);\n    if(!u){\n      alert('Aucun lien n’est encore renseigné pour ce défi.');\n      return;\n    }\n    window.open(u,'_blank','noopener,noreferrer');\n  }\n\n  function openChallengeSubmenu(){\n    const links = getChallengeLinks();\n    const i1 = document.getElementById('challenge1Url');\n    const i2 = document.getElementById('challenge2Url');\n    if(i1) i1.value = links.challenge1 || '';\n    if(i2) i2.value = links.challenge2 || '';\n    document.getElementById('challengeSubmenu')?.classList.add('open');\n  }\n\n  function closeChallengeSubmenu(){\n    document.getElementById('challengeSubmenu')?.classList.remove('open');\n  }\n\n  document.getElementById('challengeSubmenuClose')?.addEventListener('click',closeChallengeSubmenu);\n  document.getElementById('challengeSubmenu')?.addEventListener('click',e=>{\n    if(e.target.id==='challengeSubmenu') closeChallengeSubmenu();\n  });\n\n  document.getElementById('challenge1Open')?.addEventListener('click',()=>{\n    openChallengeUrl(getChallengeLinks().challenge1);\n  });\n  document.getElementById('challenge2Open')?.addEventListener('click',()=>{\n    openChallengeUrl(getChallengeLinks().challenge2);\n  });\n\n  document.getElementById('challenge1Url')?.addEventListener('change',e=>{\n    const data=getChallengeLinks();\n    data.challenge1=normalizeChallengeUrl(e.target.value);\n    e.target.value=data.challenge1;\n    setChallengeLinks(data);\n  });\n  document.getElementById('challenge2Url')?.addEventListener('change',e=>{\n    const data=getChallengeLinks();\n    data.challenge2=normalizeChallengeUrl(e.target.value);\n    e.target.value=data.challenge2;\n    setChallengeLinks(data);\n  });\n\n  function forceChallengeButton(){\n    const card = document.querySelector('.grid > .card[data-rubric-id=\"challenge\"]');\n    if(!card) return;\n\n    const rows = Array.from(card.querySelectorAll('.row[data-dynamic-item=\"1\"]'));\n    rows.forEach(row=>{\n      const txt=(row.textContent||'').toLowerCase();\n      if(txt.includes('défis math')){\n        const btn=row.querySelector('button');\n        if(btn){\n          btn.textContent='Ouvrir';\n          btn.onclick=(e)=>{\n            e.preventDefault();\n            e.stopPropagation();\n            openChallengeSubmenu();\n          };\n        }\n      }\n    });\n  }\n\n  const originalRender = window.renderItemsForRubric;\n  if(typeof originalRender === 'function'){\n    window.renderItemsForRubric = function(rubricId){\n      originalRender(rubricId);\n      if(rubricId==='challenge') setTimeout(forceChallengeButton,0);\n    };\n  }\n\n  setTimeout(()=>{\n    if(typeof renderItemsForRubric==='function') renderItemsForRubric('challenge');\n    setTimeout(forceChallengeButton,0);\n  },0);\n});\n<\\/script>\n\n\n<div class=\"generic-submenu\" id=\"genericSubmenu\">\n  <div class=\"generic-submenu-card\">\n    <div class=\"generic-submenu-head\">\n      <h2 id=\"genericSubmenuTitle\">Sous-menu</h2>\n      <button class=\"generic-submenu-close\" id=\"genericSubmenuClose\" type=\"button\">×</button>\n    </div>\n    <div class=\"generic-submenu-list\" id=\"genericSubmenuList\"></div>\n  </div>\n</div>\n\n\n\n\n\n<div class=\"submenu-editor\" id=\"submenuEditor\">\n  <div class=\"submenu-editor-card\">\n    <div class=\"submenu-editor-head\">\n      <h2 id=\"submenuEditorTitle\">Paramétrer le sous-menu</h2>\n      <button class=\"submenu-editor-close\" id=\"submenuEditorClose\" type=\"button\">×</button>\n    </div>\n\n    <div class=\"submenu-editor-count\">\n      <strong>Nombre de choix :</strong>\n      <input id=\"submenuEditorCount\" type=\"number\" min=\"1\" max=\"12\" value=\"2\">\n    </div>\n\n    <div class=\"submenu-editor-list\" id=\"submenuEditorList\"></div>\n  </div>\n</div>\n\n\n\n\n\n\n\n\n<script>\n/* Sous-menu stable : aucun rerendu automatique en boucle */\nlet EDITING_SUBMENU_RUBRIC = null;\nlet EDITING_SUBMENU_ITEM = null;\n\nfunction submenuStorageKey(rubricId,itemId){\n  const d=window.__CHAPTER_DATA__||{n:3};\n  return 'mathspace_submenu_clean_ch_'+String(d.n||3)+'_'+rubricId+'_'+itemId;\n}\nfunction getSubmenuConfig(rubricId,itemId,itemName){\n  try{\n    const raw=localStorage.getItem(submenuStorageKey(rubricId,itemId));\n    if(raw) return JSON.parse(raw);\n  }catch(e){}\n  return {\n    count:2,\n    entries:[\n      {name:itemName+' 1',url:''},\n      {name:itemName+' 2',url:''}\n    ]\n  };\n}\nfunction setSubmenuConfig(rubricId,itemId,data){\n  try{localStorage.setItem(submenuStorageKey(rubricId,itemId),JSON.stringify(data));}catch(e){}\n}\nfunction normalizeSubmenuUrl(v){\n  let u=(v||'').trim();\n  if(!u) return '';\n  if(/^https?:\\/\\//i.test(u)) return u;\n  return 'https://'+u;\n}\nfunction openSubmenuEditor(rubricId,item){\n  EDITING_SUBMENU_RUBRIC=rubricId;\n  EDITING_SUBMENU_ITEM=item;\n  const cfg=getSubmenuConfig(rubricId,item.id,item.name);\n  document.getElementById('submenuEditorTitle').textContent='Sous-menu — '+item.name;\n  document.getElementById('submenuEditorCount').value=cfg.entries?.length || cfg.count || 2;\n  renderSubmenuEditorRows();\n  document.getElementById('submenuEditor')?.classList.add('open');\n}\nfunction renderSubmenuEditorRows(){\n  if(!EDITING_SUBMENU_RUBRIC || !EDITING_SUBMENU_ITEM) return;\n  const cfg=getSubmenuConfig(EDITING_SUBMENU_RUBRIC,EDITING_SUBMENU_ITEM.id,EDITING_SUBMENU_ITEM.name);\n  const host=document.getElementById('submenuEditorList');\n  if(!host) return;\n  host.innerHTML='';\n\n  (cfg.entries||[]).forEach((entry,index)=>{\n    const row=document.createElement('div');\n    row.className='submenu-editor-row';\n\n    const name=document.createElement('input');\n    name.value=entry.name||'';\n    name.placeholder='Nom du choix';\n    name.addEventListener('change',()=>{\n      const data=getSubmenuConfig(EDITING_SUBMENU_RUBRIC,EDITING_SUBMENU_ITEM.id,EDITING_SUBMENU_ITEM.name);\n      data.entries[index].name=name.value.trim() || ('Choix '+(index+1));\n      setSubmenuConfig(EDITING_SUBMENU_RUBRIC,EDITING_SUBMENU_ITEM.id,data);\n    });\n\n    const url=document.createElement('input');\n    url.value=entry.url||'';\n    url.placeholder='Lien OneDrive ou autre';\n    url.addEventListener('change',()=>{\n      const data=getSubmenuConfig(EDITING_SUBMENU_RUBRIC,EDITING_SUBMENU_ITEM.id,EDITING_SUBMENU_ITEM.name);\n      data.entries[index].url=normalizeSubmenuUrl(url.value);\n      url.value=data.entries[index].url;\n      setSubmenuConfig(EDITING_SUBMENU_RUBRIC,EDITING_SUBMENU_ITEM.id,data);\n    });\n\n    const test=document.createElement('button');\n    test.type='button';\n    test.textContent='Tester';\n    test.addEventListener('click',()=>{\n      const data=getSubmenuConfig(EDITING_SUBMENU_RUBRIC,EDITING_SUBMENU_ITEM.id,EDITING_SUBMENU_ITEM.name);\n      const u=normalizeSubmenuUrl(data.entries[index]?.url||'');\n      if(!u){alert('Aucun lien renseigné.');return;}\n      window.open(u,'_blank','noopener,noreferrer');\n    });\n\n    row.append(name,url,test);\n    host.appendChild(row);\n  });\n}\nfunction renderGenericSubmenu(rubricId,item){\n  const cfg=getSubmenuConfig(rubricId,item.id,item.name);\n  const title=document.getElementById('genericSubmenuTitle');\n  const list=document.getElementById('genericSubmenuList');\n  if(title) title.textContent=item.name;\n  if(!list) return;\n  list.innerHTML='';\n\n  (cfg.entries||[]).forEach(entry=>{\n    const row=document.createElement('div');\n    row.className='generic-submenu-option';\n    const label=document.createElement('span');\n    label.textContent=entry.name;\n    const btn=document.createElement('button');\n    btn.type='button';\n    btn.textContent='Ouvrir';\n    btn.addEventListener('click',()=>{\n      const u=normalizeSubmenuUrl(entry.url);\n      if(!u){alert('Aucun lien n’est encore renseigné pour cet élément.');return;}\n      window.open(u,'_blank','noopener,noreferrer');\n    });\n    row.append(label,btn);\n    list.appendChild(row);\n  });\n\n  document.getElementById('genericSubmenu')?.classList.add('open');\n}\n\ndocument.addEventListener('DOMContentLoaded',()=>{\n\n  document.getElementById('submenuEditorClose')?.addEventListener('click',()=>{\n    document.getElementById('submenuEditor')?.classList.remove('open');\n  });\n  document.getElementById('submenuEditor')?.addEventListener('click',e=>{\n    if(e.target.id==='submenuEditor') e.currentTarget.classList.remove('open');\n  });\n  document.getElementById('genericSubmenuClose')?.addEventListener('click',()=>{\n    document.getElementById('genericSubmenu')?.classList.remove('open');\n  });\n  document.getElementById('genericSubmenu')?.addEventListener('click',e=>{\n    if(e.target.id==='genericSubmenu') e.currentTarget.classList.remove('open');\n  });\n\n  document.getElementById('submenuEditorCount')?.addEventListener('change',e=>{\n    if(!EDITING_SUBMENU_RUBRIC || !EDITING_SUBMENU_ITEM) return;\n    const n=Math.max(1,Math.min(12,Number(e.target.value)||1));\n    const cfg=getSubmenuConfig(EDITING_SUBMENU_RUBRIC,EDITING_SUBMENU_ITEM.id,EDITING_SUBMENU_ITEM.name);\n    cfg.entries=cfg.entries||[];\n    while(cfg.entries.length<n){\n      cfg.entries.push({name:EDITING_SUBMENU_ITEM.name+' '+(cfg.entries.length+1),url:''});\n    }\n    cfg.entries=cfg.entries.slice(0,n);\n    cfg.count=n;\n    setSubmenuConfig(EDITING_SUBMENU_RUBRIC,EDITING_SUBMENU_ITEM.id,cfg);\n    renderSubmenuEditorRows();\n  });\n\n  // Extend the existing item-row renderer once.\n  const oldBuild=window.buildItemRow;\n  if(typeof oldBuild==='function'){\n    window.buildItemRow=function(item){\n      const row=oldBuild(item);\n      if(item.type==='submenu'){\n        const btn=row.querySelector('button');\n        if(btn){\n          btn.textContent='Ouvrir';\n          btn.onclick=(e)=>{\n            e.preventDefault();\n            e.stopPropagation();\n            const rubricId=row.closest('.card')?.dataset.rubricId || '';\n            renderGenericSubmenu(rubricId,item);\n          };\n        }\n      }\n      return row;\n    };\n  }\n\n  // Replace renderItemManager with a stable wrapper:\n  const oldRenderManager=window.renderItemManager;\n  if(typeof oldRenderManager==='function'){\n    window.renderItemManager=function(){\n      oldRenderManager();\n\n      const newType=document.getElementById('newItemType');\n      if(newType && !Array.from(newType.options).some(o=>o.value==='submenu')){\n        const op=document.createElement('option');\n        op.value='submenu';\n        op.textContent='Sous-menu';\n        newType.appendChild(op);\n      }\n\n      if(!ACTIVE_RUBRIC_ID || typeof getItems!=='function') return;\n      const items=getItems(ACTIVE_RUBRIC_ID);\n      const rows=Array.from(document.querySelectorAll('#itemList .item-row'));\n\n      rows.forEach((row,index)=>{\n        const item=items[index];\n        if(!item) return;\n\n        const typeSel=row.querySelector('select');\n        if(!typeSel) return;\n\n        if(!Array.from(typeSel.options).some(o=>o.value==='submenu')){\n          const op=document.createElement('option');\n          op.value='submenu';\n          op.textContent='Sous-menu';\n          typeSel.appendChild(op);\n        }\n\n        typeSel.value=item.type||'document';\n\n        // Replace change behavior with a single deterministic handler.\n        typeSel.onchange=()=>{\n          const data=getItems(ACTIVE_RUBRIC_ID);\n          const target=data[index];\n          if(!target) return;\n          target.type=typeSel.value;\n          if(target.type==='submenu') target.url='';\n          setItems(ACTIVE_RUBRIC_ID,data);\n          if(typeof renderItemsForRubric==='function') renderItemsForRubric(ACTIVE_RUBRIC_ID);\n          window.renderItemManager();\n        };\n\n        // Remove any old inline submenu blocks left in DOM.\n        row.querySelectorAll('.submenu-config').forEach(x=>x.remove());\n\n        let edit=row.querySelector('.submenu-edit-btn');\n        if(item.type==='submenu'){\n          if(!edit){\n            edit=document.createElement('button');\n            edit.type='button';\n            edit.className='submenu-edit-btn';\n            edit.textContent='Paramétrer le sous-menu';\n            row.appendChild(edit);\n          }\n          edit.onclick=(e)=>{\n            e.preventDefault();\n            e.stopPropagation();\n            openSubmenuEditor(ACTIVE_RUBRIC_ID,item);\n          };\n\n          const urlInput=Array.from(row.querySelectorAll('input'))\n            .find(i=>i.placeholder==='Lien' || i.placeholder?.includes('Sous-menu') || i.placeholder?.includes('Page interne'));\n          if(urlInput){\n            urlInput.disabled=true;\n            urlInput.value='';\n            urlInput.placeholder='Sous-menu : paramétrer via le bouton';\n          }\n        }else{\n          if(edit) edit.remove();\n          const urlInput=Array.from(row.querySelectorAll('input'))\n            .find(i=>i.placeholder?.includes('Sous-menu'));\n          if(urlInput){\n            urlInput.disabled=false;\n            urlInput.placeholder='Lien';\n          }\n        }\n      });\n    };\n  }\n});\n<\\/script>\n\n\n\n</div>\n\n\n\n\n\n<button class=\"simple-prof-toggle\" id=\"simpleProfToggle\" type=\"button\">Mode professeur</button>\n<script>\ndocument.addEventListener('DOMContentLoaded', async () => {\n  const btn = document.getElementById('simpleProfToggle');\n  window.__mathTeacherAuthorized = false;\n\n  function refreshTeacherOnly(){\n    document.querySelectorAll('.submenu-edit-btn').forEach(el => el.classList.add('teacher-only'));\n    document.querySelectorAll('.manage-items-btn').forEach(el => el.classList.add('teacher-only'));\n    document.querySelectorAll('.tools-manage').forEach(el => el.classList.add('teacher-only'));\n    document.querySelectorAll('.challenge-settings').forEach(el => el.classList.add('teacher-only'));\n  }\n\n  function closeTeacherPanels(){\n    document.getElementById('teacherPanel')?.classList.remove('open');\n    document.getElementById('itemsPanel')?.classList.remove('open');\n    document.getElementById('toolsAdmin')?.classList.remove('open');\n    document.getElementById('submenuEditor')?.classList.remove('open');\n  }\n\n  function setMode(on){\n    const allowed = window.__mathTeacherAuthorized === true;\n    const enable = allowed && on === true;\n\n    document.body.classList.toggle('teacher-mode', enable);\n    if(btn){\n      btn.style.display = allowed ? '' : 'none';\n      btn.textContent = enable ? 'Mode élève' : 'Mode professeur';\n    }\n\n    if(!enable) closeTeacherPanels();\n    refreshTeacherOnly();\n  }\n\n  // Par défaut : élève verrouillé tant que Supabase n'a pas confirmé le rôle.\n  document.body.classList.remove('teacher-mode','role-teacher');\n  document.body.classList.add('role-student');\n  if(btn) btn.style.display = 'none';\n  refreshTeacherOnly();\n\n  try{\n    const ctx = await getChapterSessionContext();\n    const role = String(ctx?.profile?.role || '').toLowerCase();\n    const isTeacher = role === 'teacher';\n\n    window.__mathTeacherAuthorized = isTeacher;\n    document.body.classList.toggle('role-teacher', isTeacher);\n    document.body.classList.toggle('role-student', !isTeacher);\n\n    if(btn) btn.style.display = isTeacher ? '' : 'none';\n  }catch(err){\n    console.warn('Vérification du rôle professeur :', err);\n    window.__mathTeacherAuthorized = false;\n    document.body.classList.remove('role-teacher','teacher-mode');\n    document.body.classList.add('role-student');\n    if(btn) btn.style.display = 'none';\n  }\n\n  btn?.addEventListener('click', () => {\n    if(window.__mathTeacherAuthorized !== true) return;\n    setMode(!document.body.classList.contains('teacher-mode'));\n  });\n\n  setMode(false);\n\n  // Bloque toute ouverture d'un outil d'édition si le rôle n'est pas professeur.\n  document.addEventListener('click', (event) => {\n    if(window.__mathTeacherAuthorized === true) return;\n\n    const target = event.target.closest(\n      '#simpleProfToggle,.teacher-manage-btn,.manage-items-btn,.tools-manage,' +\n      '.submenu-edit-btn,.challenge-settings summary,#addRubricBtn,#resetRubricsBtn,' +\n      '#addItemBtn,#addToolsZoneBtn'\n    );\n\n    if(target){\n      event.preventDefault();\n      event.stopImmediatePropagation();\n    }\n  }, true);\n\n  const obs = new MutationObserver(refreshTeacherOnly);\n  obs.observe(document.body, {childList:true, subtree:true});\n});\n<\\/script>\n\n\n<div id=\"quizResultsModal\">\n  <div class=\"quiz-results-modal-card\">\n    <div class=\"quiz-results-modal-head\">\n      <h2>Mes résultats aux quiz</h2>\n      <button class=\"quiz-results-modal-close\" type=\"button\" onclick=\"closeQuizResultsModal()\">Fermer</button>\n    </div>\n    <div id=\"quizResultsModalBody\">\n      <div class=\"quiz-followup-empty\">Chargement…</div>\n    </div>\n  </div>\n</div>\n\n\n<div id=\"embeddedQuizModal\">\n  <div class=\"embedded-quiz-shell\">\n    <div class=\"embedded-quiz-head\">\n      <strong id=\"embeddedQuizTitle\">Quiz d'entraînement</strong>\n      <button class=\"embedded-quiz-close\" type=\"button\" onclick=\"closeEmbeddedQuiz(); return false;\">Fermer</button>\n    </div>\n    <iframe id=\"embeddedQuizFrame\"\n      sandbox=\"allow-scripts allow-same-origin allow-forms allow-modals\"></iframe>\n  </div>\n</div>\n\n\n\n<div class=\"teacher-quiz-tracking\" id=\"teacherQuizTracking\">\n  <div class=\"teacher-quiz-tracking-card\">\n    <div class=\"teacher-quiz-tracking-head\">\n      <h2>Suivi des quiz</h2>\n      <button class=\"teacher-quiz-close\" id=\"teacherQuizTrackingClose\" type=\"button\">Fermer</button>\n    </div>\n\n    <div class=\"teacher-quiz-view-tabs\">\n      <button class=\"teacher-quiz-view-tab active\" id=\"teacherQuizOverviewTab\" type=\"button\">Par classe / chapitre</button>\n      <button class=\"teacher-quiz-view-tab\" id=\"teacherQuizStudentTab\" type=\"button\">Par élève</button>\n    </div>\n\n    <div class=\"teacher-quiz-overview-view active\" id=\"teacherQuizOverviewView\">\n\n    <div class=\"teacher-quiz-filters\">\n      <div class=\"teacher-quiz-filter\">\n        <label for=\"teacherQuizClassFilter\">Classe</label>\n        <select id=\"teacherQuizClassFilter\">\n          <option value=\"\">Toutes les classes</option>\n        </select>\n      </div>\n      <div class=\"teacher-quiz-filter\">\n        <label for=\"teacherQuizChapterFilter\">Chapitre</label>\n        <select id=\"teacherQuizChapterFilter\"></select>\n      </div>\n    </div>\n\n    <div class=\"teacher-quiz-summary\" id=\"teacherQuizSummary\"></div>\n\n    <div class=\"teacher-quiz-table-wrap\">\n      <table class=\"teacher-quiz-table\">\n        <thead>\n          <tr>\n            <th>Élève</th>\n            <th>Classe</th>\n            <th>Dernier résultat</th>\n            <th>Meilleur résultat</th>\n            <th>Tentatives</th>\n            <th>Statut</th>\n          </tr>\n        </thead>\n        <tbody id=\"teacherQuizTableBody\">\n          <tr><td colspan=\"6\" class=\"teacher-quiz-empty\">Chargement…</td></tr>\n        </tbody>\n      </table>\n    </div>\n    </div>\n\n    <div class=\"teacher-quiz-student-view\" id=\"teacherQuizStudentView\">\n      <div class=\"teacher-quiz-student-select-wrap\">\n        <label for=\"teacherQuizStudentFilter\">Élève</label>\n        <select id=\"teacherQuizStudentFilter\">\n          <option value=\"\">Choisir un élève</option>\n        </select>\n      </div>\n      <div class=\"teacher-quiz-student-grid\" id=\"teacherQuizStudentGrid\">\n        <div class=\"teacher-quiz-empty\">Choisis un élève pour afficher tous ses quiz.</div>\n      </div>\n    </div>\n\n  </div>\n</div>\n\n<div class=\"teacher-quiz-detail\" id=\"teacherQuizDetail\">\n  <div class=\"teacher-quiz-detail-card\">\n    <div class=\"teacher-quiz-detail-head\">\n      <h3 id=\"teacherQuizDetailTitle\">Historique de l’élève</h3>\n      <button class=\"teacher-quiz-close\" id=\"teacherQuizDetailClose\" type=\"button\">Fermer</button>\n    </div>\n    <div id=\"teacherQuizDetailBody\" class=\"teacher-quiz-history\"></div>\n  </div>\n</div>\n\n<script>\n/* ===== SUIVI DES QUIZ — PROFESSEUR ===== */\n(function(){\n  const CHAPTER_NAMES_FOR_TRACKING = [\n    '',\n    'La numération',\n    'Repérage de nombres',\n    'Les figures élémentaires',\n    'Opérations dans ℕ',\n    'Les puissances',\n    'Les angles',\n    'Opérations dans ℤ',\n    'Axe et centre de symétrie',\n    'Les rationnels',\n    'Pourcentages',\n    'Les triangles',\n    'Le repérage',\n    'Les quadrilatères',\n    'Calcul algébrique',\n    'Les polygones',\n    'Les équations',\n    'Les transformations du plan',\n    'Proportionnalité',\n    'Les statistiques'\n  ];\n\n  let __teacherQuizStudents = [];\n  let __teacherQuizQuizzes = [];\n  let __teacherQuizAttempts = [];\n  let __teacherQuizRowsByStudent = new Map();\n\n  function fmtScore(value){\n    const n = Number(value);\n    if(!Number.isFinite(n)) return '—';\n    return n.toFixed(1).replace('.0','') + '/20';\n  }\n\n  function fmtDate(value){\n    if(!value) return '—';\n    const d = new Date(value);\n    return d.toLocaleString('fr-BE',{\n      day:'2-digit',\n      month:'2-digit',\n      year:'numeric',\n      hour:'2-digit',\n      minute:'2-digit'\n    });\n  }\n\n  function statusHtml(kind, label){\n    return '<span class=\"teacher-quiz-status ' + kind + '\">' + label + '</span>';\n  }\n\n  function ensureTeacher(){\n    return window.__mathTeacherAuthorized === true &&\n      document.body.classList.contains('role-teacher');\n  }\n\n  function populateChapterFilter(){\n    const select = document.getElementById('teacherQuizChapterFilter');\n    if(!select || select.options.length) return;\n\n    for(let i=1;i<=19;i++){\n      const opt = document.createElement('option');\n      opt.value = String(i);\n      opt.textContent = 'Chapitre ' + i + ' — ' + CHAPTER_NAMES_FOR_TRACKING[i];\n      select.appendChild(opt);\n    }\n\n    const current = Number(currentChapterNumber());\n    select.value = String(current >= 1 && current <= 19 ? current : 1);\n  }\n\n  function populateClassFilter(){\n    const select = document.getElementById('teacherQuizClassFilter');\n    if(!select) return;\n\n    const previous = select.value;\n    const classes = Array.from(\n      new Set(\n        __teacherQuizStudents\n          .map(s => String(s.class_name || '').trim())\n          .filter(Boolean)\n      )\n    ).sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));\n\n    select.innerHTML = '<option value=\"\">Toutes les classes</option>';\n\n    classes.forEach(cls => {\n      const opt = document.createElement('option');\n      opt.value = cls;\n      opt.textContent = cls;\n      select.appendChild(opt);\n    });\n\n    if(classes.includes(previous)){\n      select.value = previous;\n    }\n  }\n\n\n  function populateStudentFilter(){\n    const select = document.getElementById('teacherQuizStudentFilter');\n    if(!select) return;\n\n    const previous = select.value;\n    select.innerHTML = '<option value=\"\">Choisir un élève</option>';\n\n    __teacherQuizStudents\n      .slice()\n      .sort((a,b)=>{\n        const ca = String(a.class_name || '');\n        const cb = String(b.class_name || '');\n        const cc = ca.localeCompare(cb,'fr',{numeric:true});\n        if(cc !== 0) return cc;\n        const na = [a.last_name,a.first_name].filter(Boolean).join(' ');\n        const nb = [b.last_name,b.first_name].filter(Boolean).join(' ');\n        return na.localeCompare(nb,'fr');\n      })\n      .forEach(student=>{\n        const opt = document.createElement('option');\n        opt.value = student.id;\n        const fullName = [student.first_name,student.last_name].filter(Boolean).join(' ') || 'Élève';\n        opt.textContent = (student.class_name ? student.class_name + ' — ' : '') + fullName;\n        select.appendChild(opt);\n      });\n\n    if(__teacherQuizStudents.some(s => s.id === previous)){\n      select.value = previous;\n    }\n  }\n\n  function renderTeacherQuizStudentView(){\n    const select = document.getElementById('teacherQuizStudentFilter');\n    const host = document.getElementById('teacherQuizStudentGrid');\n    if(!select || !host) return;\n\n    const studentId = select.value;\n    if(!studentId){\n      host.innerHTML = '<div class=\"teacher-quiz-empty\">Choisis un élève pour afficher tous ses quiz.</div>';\n      return;\n    }\n\n    const student = __teacherQuizStudents.find(s => s.id === studentId);\n    if(!student){\n      host.innerHTML = '<div class=\"teacher-quiz-empty\">Élève introuvable.</div>';\n      return;\n    }\n\n    const quizzes = __teacherQuizQuizzes\n      .slice()\n      .sort((a,b)=>{\n        const c = Number(a.chapter_number) - Number(b.chapter_number);\n        if(c !== 0) return c;\n        return String(a.title || '').localeCompare(String(b.title || ''),'fr');\n      });\n\n    host.innerHTML = '';\n\n    if(!quizzes.length){\n      host.innerHTML = '<div class=\"teacher-quiz-empty\">Aucun quiz actif.</div>';\n      return;\n    }\n\n    quizzes.forEach(quiz=>{\n      const attempts = __teacherQuizAttempts\n        .filter(a => a.student_id === studentId && a.quiz_id === quiz.id)\n        .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));\n\n      const latest = attempts[0] || null;\n      const best = attempts.length\n        ? attempts.reduce((max,a)=>Number(a.score_20) > Number(max.score_20) ? a : max, attempts[0])\n        : null;\n\n      const card = document.createElement('div');\n      card.className = 'teacher-quiz-student-card';\n\n      const head = document.createElement('div');\n      head.className = 'teacher-quiz-student-card-head';\n\n      const title = document.createElement('div');\n      title.className = 'teacher-quiz-student-card-title';\n      title.textContent =\n        'Chapitre ' + quiz.chapter_number + ' — ' +\n        (CHAPTER_NAMES_FOR_TRACKING[Number(quiz.chapter_number)] || '') +\n        ' · ' + (quiz.title || 'Quiz');\n\n      const status = document.createElement('div');\n      if(!latest){\n        status.innerHTML = statusHtml('none','Pas encore fait');\n      }else if(latest.passed === true){\n        status.innerHTML = statusHtml('success','Réussi');\n      }else{\n        status.innerHTML = statusHtml('work','À retravailler');\n      }\n\n      head.append(title,status);\n\n      const meta = document.createElement('div');\n      meta.className = 'teacher-quiz-student-card-meta';\n      meta.innerHTML = `\n        <div class=\"teacher-quiz-student-kpi\">\n          <strong>${latest ? fmtScore(latest.score_20) : '—'}</strong>\n          <span>Dernier score</span>\n        </div>\n        <div class=\"teacher-quiz-student-kpi\">\n          <strong>${best ? fmtScore(best.score_20) : '—'}</strong>\n          <span>Meilleur score</span>\n        </div>\n        <div class=\"teacher-quiz-student-kpi\">\n          <strong>${attempts.length}</strong>\n          <span>Tentatives</span>\n        </div>\n        <div class=\"teacher-quiz-student-kpi\">\n          <strong>${latest ? fmtDate(latest.created_at).split(' ')[0] : '—'}</strong>\n          <span>Dernier essai</span>\n        </div>\n      `;\n\n      card.append(head,meta);\n\n      if(attempts.length){\n        const history = document.createElement('div');\n        history.className = 'teacher-quiz-history';\n        history.style.marginTop = '10px';\n\n        attempts.forEach(a=>{\n          const row = document.createElement('div');\n          row.className = 'teacher-quiz-history-row';\n          row.innerHTML = `\n            <div>\n              <div class=\"teacher-quiz-history-title\">Tentative ${a.attempt_number || '—'}</div>\n              <div class=\"teacher-quiz-history-meta\">${fmtDate(a.created_at)}</div>\n            </div>\n            <div class=\"teacher-quiz-score\">${fmtScore(a.score_20)}</div>\n            <div>${a.passed === true ? statusHtml('success','Réussi') : statusHtml('work','À retravailler')}</div>\n          `;\n          history.appendChild(row);\n        });\n\n        card.appendChild(history);\n      }\n\n      host.appendChild(card);\n    });\n  }\n\n  function switchTeacherQuizView(view){\n    const overviewTab = document.getElementById('teacherQuizOverviewTab');\n    const studentTab = document.getElementById('teacherQuizStudentTab');\n    const overviewView = document.getElementById('teacherQuizOverviewView');\n    const studentView = document.getElementById('teacherQuizStudentView');\n\n    const studentMode = view === 'student';\n\n    overviewTab?.classList.toggle('active', !studentMode);\n    studentTab?.classList.toggle('active', studentMode);\n    overviewView?.classList.toggle('active', !studentMode);\n    studentView?.classList.toggle('active', studentMode);\n\n    if(studentMode){\n      populateStudentFilter();\n      renderTeacherQuizStudentView();\n    }\n  }\n\n  async function loadTeacherQuizData(){\n    if(!ensureTeacher()) return;\n\n    const body = document.getElementById('teacherQuizTableBody');\n    if(body){\n      body.innerHTML =\n        '<tr><td colspan=\"6\" class=\"teacher-quiz-empty\">Chargement…</td></tr>';\n    }\n\n    const ctx = await getChapterSessionContext();\n    const db = ctx?.db;\n    const profile = ctx?.profile;\n\n    if(!db || !profile || String(profile.role).toLowerCase() !== 'teacher'){\n      throw new Error('Accès professeur non autorisé.');\n    }\n\n    const studentsRes = await db\n      .from('math_profiles')\n      .select('id,first_name,last_name,class_name,active')\n      .eq('role','student')\n      .order('class_name',{ascending:true})\n      .order('last_name',{ascending:true})\n      .order('first_name',{ascending:true});\n\n    if(studentsRes.error) throw studentsRes.error;\n\n    const quizzesRes = await db\n      .from('math_quizzes')\n      .select('id,title,chapter_number,pass_percentage,active')\n      .eq('active',true)\n      .order('chapter_number',{ascending:true})\n      .order('title',{ascending:true});\n\n    if(quizzesRes.error) throw quizzesRes.error;\n\n    __teacherQuizStudents = (studentsRes.data || []).filter(s => s.active !== false);\n    __teacherQuizQuizzes = quizzesRes.data || [];\n\n    const quizIds = __teacherQuizQuizzes.map(q => q.id);\n\n    if(quizIds.length){\n      const attemptsRes = await db\n        .from('math_quiz_attempts')\n        .select(\n          'id,quiz_id,student_id,attempt_number,correct_count,total_questions,' +\n          'percentage,score_20,passed,answers,created_at'\n        )\n        .in('quiz_id',quizIds)\n        .order('created_at',{ascending:false});\n\n      if(attemptsRes.error) throw attemptsRes.error;\n      __teacherQuizAttempts = attemptsRes.data || [];\n    }else{\n      __teacherQuizAttempts = [];\n    }\n\n    populateClassFilter();\n    populateStudentFilter();\n    renderTeacherQuizTable();\n    renderTeacherQuizStudentView();\n  }\n\n  function renderTeacherQuizSummary(rows){\n    const host = document.getElementById('teacherQuizSummary');\n    if(!host) return;\n\n    const total = rows.length;\n    const done = rows.filter(r => r.attempts.length > 0).length;\n    const success = rows.filter(r => r.status === 'success').length;\n    const work = rows.filter(r => r.status === 'work').length;\n\n    host.innerHTML = `\n      <div class=\"teacher-quiz-stat\"><strong>${total}</strong><span>élèves</span></div>\n      <div class=\"teacher-quiz-stat\"><strong>${done}</strong><span>ont fait le quiz</span></div>\n      <div class=\"teacher-quiz-stat\"><strong>${success}</strong><span>réussis</span></div>\n      <div class=\"teacher-quiz-stat\"><strong>${work}</strong><span>à retravailler</span></div>\n    `;\n  }\n\n  function renderTeacherQuizTable(){\n    const tbody = document.getElementById('teacherQuizTableBody');\n    const classFilter = document.getElementById('teacherQuizClassFilter')?.value || '';\n    const chapterNo = Number(document.getElementById('teacherQuizChapterFilter')?.value || 1);\n\n    if(!tbody) return;\n\n    const chapterQuizzes = __teacherQuizQuizzes.filter(\n      q => Number(q.chapter_number) === chapterNo\n    );\n    const chapterQuizIds = new Set(chapterQuizzes.map(q => q.id));\n\n    let students = __teacherQuizStudents;\n    if(classFilter){\n      students = students.filter(s => String(s.class_name || '') === classFilter);\n    }\n\n    __teacherQuizRowsByStudent = new Map();\n\n    if(!chapterQuizzes.length){\n      tbody.innerHTML =\n        '<tr><td colspan=\"6\" class=\"teacher-quiz-empty\">' +\n        'Aucun quiz actif pour ce chapitre.</td></tr>';\n      renderTeacherQuizSummary(\n        students.map(s => ({student:s,attempts:[],status:'none'}))\n      );\n      return;\n    }\n\n    const rows = students.map(student => {\n      const attempts = __teacherQuizAttempts\n        .filter(a => a.student_id === student.id && chapterQuizIds.has(a.quiz_id))\n        .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));\n\n      const latest = attempts[0] || null;\n      const best = attempts.length\n        ? attempts.reduce((max,a) =>\n            Number(a.score_20) > Number(max.score_20) ? a : max, attempts[0])\n        : null;\n\n      let status = 'none';\n      if(latest){\n        status = latest.passed === true ? 'success' : 'work';\n      }\n\n      const row = {student,attempts,latest,best,status,chapterQuizzes};\n      __teacherQuizRowsByStudent.set(student.id,row);\n      return row;\n    });\n\n    renderTeacherQuizSummary(rows);\n\n    if(!rows.length){\n      tbody.innerHTML =\n        '<tr><td colspan=\"6\" class=\"teacher-quiz-empty\">' +\n        'Aucun élève dans cette classe.</td></tr>';\n      return;\n    }\n\n    tbody.innerHTML = '';\n\n    rows.forEach(r => {\n      const tr = document.createElement('tr');\n      tr.dataset.studentId = r.student.id;\n\n      const fullName =\n        [r.student.first_name,r.student.last_name].filter(Boolean).join(' ') ||\n        'Élève';\n\n      const lastScore = r.latest ? fmtScore(r.latest.score_20) : '—';\n      const bestScore = r.best ? fmtScore(r.best.score_20) : '—';\n\n      let status = statusHtml('none','Pas encore fait');\n      if(r.status === 'success') status = statusHtml('success','Réussi');\n      if(r.status === 'work') status = statusHtml('work','À retravailler');\n\n      tr.innerHTML = `\n        <td class=\"teacher-quiz-student\">${fullName}</td>\n        <td>${r.student.class_name || '—'}</td>\n        <td class=\"teacher-quiz-score\">${lastScore}</td>\n        <td class=\"teacher-quiz-score\">${bestScore}</td>\n        <td>${r.attempts.length}</td>\n        <td>${status}</td>\n      `;\n\n      tr.addEventListener('click', () => openTeacherQuizStudentDetail(r.student.id));\n      tbody.appendChild(tr);\n    });\n  }\n\n  function buildWrittenAnswersDetails(attempt){\n    const answers = Array.isArray(attempt?.answers) ? attempt.answers : [];\n    const written = answers.filter(a =>\n      a && typeof a === 'object' &&\n      String(a.type || '').toLowerCase() === 'open' &&\n      String(a.response || '').trim()\n    );\n\n    if(!written.length) return null;\n\n    const details = document.createElement('details');\n    details.className = 'teacher-written-details';\n\n    const summary = document.createElement('summary');\n    summary.textContent =\n      'Voir les réponses écrites (' + written.length + ')';\n\n    const list = document.createElement('div');\n    list.className = 'teacher-written-list';\n\n    written.forEach(item=>{\n      const box = document.createElement('div');\n      box.className = 'teacher-written-item';\n\n      const q = document.createElement('div');\n      q.className = 'teacher-written-question';\n      q.textContent =\n        (item.question_index ? 'Question ' + item.question_index + ' — ' : '') +\n        String(item.question || '');\n\n      const ans = document.createElement('div');\n      ans.className = 'teacher-written-answer';\n      ans.textContent = String(item.response || '');\n\n      const expected = document.createElement('div');\n      expected.className = 'teacher-written-expected';\n      expected.textContent =\n        'Correction proposée à l’élève : ' + String(item.expected || '—');\n\n      const self = document.createElement('span');\n      const ok = item.self_validated === true;\n      self.className = 'teacher-written-self ' + (ok ? 'ok' : 'work');\n      self.textContent = ok\n        ? 'Élève : réponse validée'\n        : 'Élève : à retravailler';\n\n      box.append(q,ans,expected,self);\n      list.appendChild(box);\n    });\n\n    details.append(summary,list);\n    return details;\n  }\n\n  function openTeacherQuizStudentDetail(studentId){\n    if(!ensureTeacher()) return;\n\n    const data = __teacherQuizRowsByStudent.get(studentId);\n    if(!data) return;\n\n    const modal = document.getElementById('teacherQuizDetail');\n    const title = document.getElementById('teacherQuizDetailTitle');\n    const body = document.getElementById('teacherQuizDetailBody');\n\n    const fullName =\n      [data.student.first_name,data.student.last_name].filter(Boolean).join(' ') ||\n      'Élève';\n\n    if(title){\n      title.textContent =\n        fullName + (data.student.class_name ? ' — ' + data.student.class_name : '');\n    }\n\n    if(!body || !modal) return;\n\n    if(!data.attempts.length){\n      body.innerHTML =\n        '<div class=\"teacher-quiz-empty\">Aucune tentative pour ce chapitre.</div>';\n      modal.style.removeProperty('display'); modal.setAttribute('aria-hidden','false'); modal.classList.add('open');\n      return;\n    }\n\n    const quizMap = new Map(data.chapterQuizzes.map(q => [q.id,q]));\n\n    body.innerHTML = '';\n\n    data.attempts.forEach(a => {\n      const quiz = quizMap.get(a.quiz_id);\n      const row = document.createElement('div');\n      row.className = 'teacher-quiz-history-row';\n\n      const left = document.createElement('div');\n\n      const qTitle = document.createElement('div');\n      qTitle.className = 'teacher-quiz-history-title';\n      qTitle.textContent = quiz?.title || 'Quiz';\n\n      const meta = document.createElement('div');\n      meta.className = 'teacher-quiz-history-meta';\n      meta.textContent =\n        'Tentative ' + (a.attempt_number || '—') + ' · ' + fmtDate(a.created_at);\n\n      left.append(qTitle,meta);\n\n      const score = document.createElement('div');\n      score.className = 'teacher-quiz-score';\n      score.textContent = fmtScore(a.score_20);\n\n      const status = document.createElement('div');\n      status.innerHTML = a.passed === true\n        ? statusHtml('success','Réussi')\n        : statusHtml('work','À retravailler');\n\n      row.append(left,score,status);\n\n      const writtenDetails = buildWrittenAnswersDetails(a);\n      if(writtenDetails){\n        row.appendChild(writtenDetails);\n      }\n\n      body.appendChild(row);\n    });\n\n    modal.style.removeProperty('display'); modal.setAttribute('aria-hidden','false'); modal.classList.add('open');\n  }\n\n  function closeTeacherQuizTracking(){\n    document.getElementById('teacherQuizTracking')?.classList.remove('open');\n    document.getElementById('teacherQuizDetail')?.classList.remove('open');\n  }\n\n  async function openTeacherQuizTracking(){\n    if(!ensureTeacher()) return;\n\n    const modal = document.getElementById('teacherQuizTracking');\n    const tbody = document.getElementById('teacherQuizTableBody');\n\n    modal?.classList.add('open');\n\n    if(tbody){\n      tbody.innerHTML =\n        '<tr><td colspan=\"6\" class=\"teacher-quiz-empty\">Chargement…</td></tr>';\n    }\n\n    try{\n      await loadTeacherQuizData();\n    }catch(err){\n      console.error('Suivi des quiz professeur :',err);\n      if(tbody){\n        const detail = String(err?.message || err || 'Erreur inconnue');\n        tbody.innerHTML =\n          '<tr><td colspan=\"6\" class=\"teacher-quiz-empty\">' +\n          'Impossible de charger le suivi des quiz.<br><small>' +\n          detail.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) +\n          '</small></td></tr>';\n      }\n    }\n  }\n\n  window.openTeacherQuizTracking = openTeacherQuizTracking;\n  window.closeTeacherQuizTracking = closeTeacherQuizTracking;\n\n  document.addEventListener('DOMContentLoaded', () => {\n    populateChapterFilter();\n\n    const openBtn = document.getElementById('teacherQuizTrackingBtn');\n    const modal = document.getElementById('teacherQuizTracking');\n    const closeBtn = document.getElementById('teacherQuizTrackingClose');\n    const detail = document.getElementById('teacherQuizDetail');\n    const detailClose = document.getElementById('teacherQuizDetailClose');\n    const classFilter = document.getElementById('teacherQuizClassFilter');\n    const chapterFilter = document.getElementById('teacherQuizChapterFilter');\n    const overviewTab = document.getElementById('teacherQuizOverviewTab');\n    const studentTab = document.getElementById('teacherQuizStudentTab');\n    const studentFilter = document.getElementById('teacherQuizStudentFilter');\n\n    openBtn?.addEventListener('click', (e) => {\n      e.preventDefault();\n      openTeacherQuizTracking();\n    });\n\n    closeBtn?.addEventListener('click', closeTeacherQuizTracking);\n    detailClose?.addEventListener('click', () => detail?.classList.remove('open'));\n\n    modal?.addEventListener('click', e => {\n      if(e.target === modal) closeTeacherQuizTracking();\n    });\n\n    detail?.addEventListener('click', e => {\n      if(e.target === detail) detail.classList.remove('open');\n    });\n\n    classFilter?.addEventListener('change', renderTeacherQuizTable);\n    chapterFilter?.addEventListener('change', renderTeacherQuizTable);\n    overviewTab?.addEventListener('click', () => switchTeacherQuizView('overview'));\n    studentTab?.addEventListener('click', () => switchTeacherQuizView('student'));\n    studentFilter?.addEventListener('change', renderTeacherQuizStudentView);\n  });\n\n  window.openTeacherQuizStudentDetail = openTeacherQuizStudentDetail;\n  window.switchTeacherQuizView = switchTeacherQuizView;\n})();\n<\\/script>\n\n<script>\n/* Correctif direct : Mes résultats aux/des quiz */\ndocument.addEventListener('DOMContentLoaded', () => {\n  function normalizeQuizResultLabel(value){\n    return String(value || '')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g,'')\n      .trim()\n      .toLowerCase();\n  }\n\n  function bindQuizResultsRows(){\n    document.querySelectorAll('.row[data-dynamic-item=\"1\"]').forEach(row => {\n      const text = normalizeQuizResultLabel(row.textContent);\n      const isResultRow =\n        row.dataset.itemId === 'quizResults' ||\n        (text.includes('resultat') && text.includes('quiz'));\n\n      if(!isResultRow) return;\n\n      row.style.cursor = 'pointer';\n\n      const openResults = (event) => {\n        event?.preventDefault?.();\n        event?.stopPropagation?.();\n        if(typeof openQuizResultsModal === 'function'){\n          openQuizResultsModal();\n        }\n      };\n\n      row.onclick = openResults;\n\n      const btn = row.querySelector('button');\n      if(btn){\n        btn.onclick = openResults;\n      }\n    });\n  }\n\n  bindQuizResultsRows();\n\n  const grid = document.querySelector('.grid');\n  if(grid){\n    new MutationObserver(() => setTimeout(bindQuizResultsRows,0))\n      .observe(grid,{childList:true,subtree:true});\n  }\n});\n<\\/script>\n\n<script>\n/* Correctif prioritaire — clic Mes résultats des quiz */\n(function(){\n  function norm(v){\n    return String(v || '')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g,'')\n      .trim()\n      .toLowerCase();\n  }\n\n  function isQuizResultsTarget(target){\n    const row = target?.closest?.('.row[data-dynamic-item=\"1\"], .row[data-item-id]');\n    if(!row) return null;\n\n    const txt = norm(row.textContent);\n    const id = row.dataset.itemId || '';\n\n    if(\n      id === 'quizResults' ||\n      (txt.includes('resultat') && txt.includes('quiz'))\n    ){\n      return row;\n    }\n\n    return null;\n  }\n\n  document.addEventListener('click', function(event){\n    const row = isQuizResultsTarget(event.target);\n    if(!row) return;\n\n    event.preventDefault();\n    event.stopImmediatePropagation();\n\n    if(typeof window.openQuizResultsModal === 'function'){\n      window.openQuizResultsModal();\n      return;\n    }\n\n    const modal = document.getElementById('quizResultsModal');\n    if(modal){\n      modal.style.display = 'block';\n      if(typeof window.loadQuizResultsIntoFollowup === 'function'){\n        window.loadQuizResultsIntoFollowup();\n      }\n    }\n  }, true);\n\n  function reinforce(){\n    document.querySelectorAll('.row[data-dynamic-item=\"1\"], .row[data-item-id]').forEach(row=>{\n      const txt = norm(row.textContent);\n      if(\n        row.dataset.itemId === 'quizResults' ||\n        (txt.includes('resultat') && txt.includes('quiz'))\n      ){\n        row.dataset.itemId = 'quizResults';\n        row.style.pointerEvents = 'auto';\n        row.style.position = 'relative';\n        row.style.zIndex = '50';\n\n        const btn = row.querySelector('button');\n        if(btn){\n          btn.disabled = false;\n          btn.style.pointerEvents = 'auto';\n          btn.style.position = 'relative';\n          btn.style.zIndex = '51';\n        }\n      }\n    });\n  }\n\n  document.addEventListener('DOMContentLoaded', reinforce);\n  setTimeout(reinforce, 50);\n  setTimeout(reinforce, 250);\n  setTimeout(reinforce, 800);\n\n  const observer = new MutationObserver(() => reinforce());\n  document.addEventListener('DOMContentLoaded', () => {\n    observer.observe(document.body,{childList:true,subtree:true});\n  });\n})();\n<\\/script>\n\n<script>\nwindow.openQuizResultsModal = openQuizResultsModal;\nwindow.closeQuizResultsModal = closeQuizResultsModal;\nwindow.loadQuizResultsIntoFollowup = loadQuizResultsIntoFollowup;\n<\\/script>\n\n\n<script>\n/* Fallback direct — bouton Suivi des quiz */\ndocument.addEventListener('click', function(event){\n  const btn = event.target?.closest?.('#teacherQuizTrackingBtn');\n  if(!btn) return;\n\n  event.preventDefault();\n  event.stopPropagation();\n\n  if(typeof window.openTeacherQuizTracking === 'function'){\n    window.openTeacherQuizTracking();\n  }else{\n    const modal = document.getElementById('teacherQuizTracking');\n    if(modal) modal.style.removeProperty('display'); modal.setAttribute('aria-hidden','false'); modal.classList.add('open');\n  }\n}, true);\n<\\/script>\n\n\n<script>\n/* ===== NETTOYAGE DES ANCIENS ÉLÉMENTS FIXES / ABANDONNÉS ===== */\n(function(){\n  function cleanOldSavedItems(){\n    try{\n      const d = window.__CHAPTER_DATA__ || {n:3};\n      const chapterNo = String(d.n || 3);\n\n      const validDefaults = (typeof DEFAULT_ITEMS_BY_RUBRIC === 'object' && DEFAULT_ITEMS_BY_RUBRIC)\n        ? DEFAULT_ITEMS_BY_RUBRIC\n        : {};\n\n      const rubricIds = ['learn','prepare','train','help','challenge','follow'];\n\n      rubricIds.forEach(rubricId=>{\n        const key = 'mathspace_items_v1_chapter_' + chapterNo + '_' + rubricId;\n        const raw = localStorage.getItem(key);\n        if(!raw) return;\n\n        let items;\n        try{ items = JSON.parse(raw); }catch(e){ return; }\n        if(!Array.isArray(items)) return;\n\n        // Remove obsolete follow-up entries from earlier versions.\n        if(rubricId === 'follow'){\n          items = items.filter(item =>\n            item &&\n            item.id !== 'documents' &&\n            item.id !== 'objectives' &&\n            !String(item.name || '').toLowerCase().includes('documents consultés') &&\n            !String(item.name || '').toLowerCase().includes('mes objectifs')\n          );\n        }\n\n        // Remove exact duplicates by id, keeping the first.\n        const seen = new Set();\n        items = items.filter(item=>{\n          const id = String(item?.id || '');\n          if(!id) return true;\n          if(seen.has(id)) return false;\n          seen.add(id);\n          return true;\n        });\n\n        localStorage.setItem(key, JSON.stringify(items));\n      });\n    }catch(err){\n      console.warn('Nettoyage des anciens éléments :', err);\n    }\n  }\n\n  document.addEventListener('DOMContentLoaded',()=>{\n    cleanOldSavedItems();\n    setTimeout(()=>{\n      if(typeof renderAllRubricItems === 'function'){\n        renderAllRubricItems();\n      }\n    },0);\n  });\n})();\n<\\/script>\n\n\n<script>\n/* ===== MIGRATION : quiz intégrés prioritaires sur les anciens liens OneDrive ===== */\ndocument.addEventListener('DOMContentLoaded',()=>{\n  try{\n    const chapterNo = Number(currentChapterNumber());\n    if(![1,3,4].includes(chapterNo)) return;\n\n    const key = 'mathspace_items_v1_chapter_' + chapterNo + '_prepare';\n    const raw = localStorage.getItem(key);\n    if(!raw) return;\n\n    let items;\n    try{ items = JSON.parse(raw); }catch(e){ return; }\n    if(!Array.isArray(items)) return;\n\n    let changed = false;\n    items.forEach(item=>{\n      const name = String(item?.name || '')\n        .normalize('NFD')\n        .replace(/[\\u0300-\\u036f]/g,'')\n        .trim()\n        .toLowerCase();\n\n      if(\n        item?.id === 'trainingQuiz' ||\n        (name.includes('quiz') && name.includes('entrainement'))\n      ){\n        if(item.type !== 'quiz'){ item.type = 'quiz'; changed = true; }\n        if(item.url){ item.url = ''; changed = true; }\n        if(item.button !== 'Commencer'){ item.button = 'Commencer'; changed = true; }\n      }\n    });\n\n    if(changed){\n      localStorage.setItem(key, JSON.stringify(items));\n    }\n\n    setTimeout(()=>{\n      if(typeof renderItemsForRubric === 'function'){\n        renderItemsForRubric('prepare');\n      }\n    },0);\n  }catch(err){\n    console.warn('Migration quiz intégré :',err);\n  }\n});\n<\\/script>\n\n\n\n\n\n<script>\n/* ===== QUIZ EMBARQUÉS DIRECTEMENT — ROUTAGE INDÉPENDANT ===== */\n(function(){\n  const DIRECT_QUIZ_URLS = {\n    1: 'quiz/chapitre-1.html',\n    3: 'quiz/chapitre-3.html',\n    4: 'quiz/chapitre-4.html'\n  };\n\n  function norm(v){\n    return String(v || '')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g,'')\n      .trim()\n      .toLowerCase();\n  }\n\n  function getChapterNo(){\n    let n = Number(window.__CHAPTER_DATA__?.n || 0);\n\n    if(!n){\n      const visible = document.querySelector('.chapter-no')?.textContent || '';\n      const match = visible.match(/(\\d+)/);\n      if(match) n = Number(match[1]);\n    }\n\n    if(!n && typeof currentChapterNumber === 'function'){\n      n = Number(currentChapterNumber() || 0);\n    }\n\n    return n;\n  }\n\n  function getQuizUrl(chapterNo){\n    return DIRECT_QUIZ_URLS[chapterNo] || '';\n  }\n\n  async function openDirectQuiz(item){\n    const chapterNo = getChapterNo();\n    const quizUrl = getQuizUrl(chapterNo);\n\n    if(!quizUrl){\n      alert('Le quiz du chapitre ' + (chapterNo || '?') + ' est introuvable.');\n      return;\n    }\n\n    // L'association à Supabase ne doit jamais bloquer l'ouverture.\n    try{\n      if(typeof resolveQuizTrackingId === 'function'){\n        __activeQuizTrackingId = await resolveQuizTrackingId({\n          ...(item || {}),\n          id:item?.id || 'trainingQuiz',\n          name:item?.name || \"Quiz d'entraînement\",\n          type:'quiz',\n          url:''\n        });\n      }\n    }catch(err){\n      console.warn('Association Supabase du quiz :',err);\n    }\n\n    const modal = document.getElementById('embeddedQuizModal');\n    const frame = document.getElementById('embeddedQuizFrame');\n    const title = document.getElementById('embeddedQuizTitle');\n\n    if(!modal || !frame){\n      alert('La fenêtre de quiz intégrée est absente de cette page.');\n      return;\n    }\n\n    if(title) title.textContent = item?.name || \"Quiz d'entraînement\";\n\n    frame.removeAttribute('srcdoc');\n    frame.src = quizUrl;\n    modal.style.removeProperty('display'); modal.setAttribute('aria-hidden','false'); modal.classList.add('open');\n  }\n\n  window.openDirectQuiz = openDirectQuiz;\n\n  function findQuizItem(){\n    try{\n      const items = typeof getItems =document.getElementById('embeddedQuizFrame');\n\n    if(frame){\n      try{frame.srcdoc='';}catch(e){}\n      try{frame.removeAttribute('src');}catch(e){}\n    }\n\n    if(modal){\n      modal.classList.remove('open');\n      modal.style.setProperty('display','none','important');\n      modal.setAttribute('aria-hidden','true');\n    }\n\n    try{__activeQuizTrackingId=null;}catch(e){}\n  }\n\n  window.forceCloseQuiz=forceCloseQuiz;\n  window.closeEmbeddedQuiz=forceCloseQuiz;\n\n  document.addEventListener('DOMContentLoaded',()=>{\n    const modal=document.getElementById('embeddedQuizModal');\n    const close=document.querySelector('.embedded-quiz-close');\n\n    if(close){\n      close.onclick=(event)=>{\n        event.preventDefault();\n        event.stopPropagation();\n        forceCloseQuiz();\n        return false;\n      };\n    }\n\n    // Clic dans la zone sombre autour de la fenêtre = fermer.\n    if(modal){\n      modal.addEventListener('click',(event)=>{\n        if(event.target===modal) forceCloseQuiz();\n      });\n    }\n  });\n\n  // Les boutons internes du quiz envoient ce message au parent.\n  window.addEventListener('message',(event)=>{\n    if(event?.data?.type==='closeEmbeddedQuiz'){\n      forceCloseQuiz();\n    }\n  });\n})();\n<\\/script>\n\n\n<script>\n/* ===== GESTIONNAIRE FINAL : SUPPRIMER UN ÉLÉMENT DE RUBRIQUE ===== */\ndocument.addEventListener('click', function(event){\n  const btn = event.target.closest('#itemList .item-delete-btn');\n  if(!btn) return;\n\n  event.preventDefault();\n  event.stopPropagation();\n  event.stopImmediatePropagation();\n\n  if(window.__mathTeacherAuthorized !== true){\n    alert('Connexion professeur requise.');\n    return;\n  }\n\n  const itemId = String(btn.dataset.itemId || '').trim();\n  if(!itemId || !ACTIVE_RUBRIC_ID) return;\n\n  const data = getItems(ACTIVE_RUBRIC_ID);\n  const item = data.find(x => String(x?.id || '') === itemId);\n  if(!item) return;\n\n  if(!confirm('Supprimer « ' + (item.name || 'cet élément') + ' » ?')) return;\n\n  const next = data.filter(x => String(x?.id || '') !== itemId);\n  setItems(ACTIVE_RUBRIC_ID, next);\n\n  if(typeof renderItemsForRubric === 'function'){\n    renderItemsForRubric(ACTIVE_RUBRIC_ID);\n  }\n  if(typeof renderItemManager === 'function'){\n    renderItemManager();\n  }\n}, true);\n<\\/script>\n\n\n<script>\n/* ===== CH5 : CLIC DIRECT SUR LE BOUTON QUIZ, SANS Z-INDEX ===== */\n(function(){\n  if(window.__ch5DirectQuizClickInstalled) return;\n  window.__ch5DirectQuizClickInstalled = true;\n\n  function norm(v){\n    return String(v || '')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g,'')\n      .trim()\n      .toLowerCase();\n  }\n\n  document.addEventListener('click', function(event){\n    const chapterNo = Number(window.__CHAPTER_DATA__?.n || 0);\n    if(chapterNo !== 5) return;\n\n    const btn = event.target.closest('button');\n    if(!btn) return;\n\n    const row = btn.closest('.row');\n    if(!row) return;\n\n    const text = norm(row.textContent);\n    if(!text.includes('quiz') || !text.includes('entrainement')) return;\n\n    event.preventDefault();\n    event.stopPropagation();\n    event.stopImmediatePropagation();\n\n    window.parent.postMessage({type:'openChapter5QuizChooserOuter'}, '*');\n  }, true);\n})();\n<\\/script>\n\n</body>\n</html>\n";

ch5qc-close\" type=\"button\" onclick=\"closeChapter5QuizChooser()\">Fermer</button></div><div class=\"ch5qc-options\"><div class=\"ch5qc-option\"><span class=\"ch5qc-badge\">Test 1</span><h3>Parties 1 et 2</h3><p>Quiz d’entraînement sur les deux premières parties du chapitre.</p><button class=\"ch5qc-start\" type=\"button\" onclick=\"chooseChapter5Quiz('p12')\">Commencer</button></div><div class=\"ch5qc-option\"><span class=\"ch5qc-badge\">Test 2</span><h3>Partie 3</h3><p>Quiz d’entraînement consacré à la troisième partie du chapitre.</p><button class=\"ch5qc-start\" type=\"button\" onclick=\"chooseChapter5Quiz('p3')\">Commencer</button></div></div></div></div>\n<script>\n(function(){\n function norm(v){return String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').trim().toLowerCase()}\n function isCh5(){return Number(window.__CHAPTER_DATA__?.n||0)===5}\n window.openChapter5QuizChooser=function(){const m=document.getElementById('chapter5QuizChooser');if(m){m.classList.add('open');m.setAttribute('aria-hidden','false')}};\n window.closeChapter5QuizChooser=function(){const m=document.getElementById('chapter5QuizChooser');if(m){m.classList.remove('open');m.setAttribute('aria-hidden','true')}};\n window.chooseChapter5Quiz=function(which){closeChapter5QuizChooser();window.parent.postMessage({type:'openChapter5Quiz',which},'*')};\n function activate(){if(!isCh5())return;document.querySelectorAll('.grid .row').forEach(row=>{const tx=norm(row.textContent);if(!tx.includes('quiz')||!tx.includes('entrainement'))return;const b=row.querySelector('button');if(b){b.disabled=false;b.style.pointerEvents='auto';b.style.cursor='pointer'}})}\n document.addEventListener('click',function(e){if(!isCh5())return;const row=e.target.closest('.grid .row');if(!row)return;const tx=norm(row.textContent);if(!tx.includes('quiz')||!tx.includes('entrainement'))return;const b=e.target.closest('button');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();openChapte
