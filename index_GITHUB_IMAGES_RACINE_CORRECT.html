<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon espace maths</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7fbff}
#view{width:100%;height:100%;border:0;display:block;background:#f7fbff}

/* ===== RELooking FICHES OUTILS ===== */
.tools-page{
  background:
    radial-gradient(circle at 12% 12%, rgba(255,195,215,.30) 0 16%, transparent 17%),
    radial-gradient(circle at 88% 10%, rgba(193,233,214,.28) 0 14%, transparent 15%),
    radial-gradient(circle at 50% 100%, rgba(189,223,255,.22) 0 18%, transparent 19%),
    linear-gradient(180deg,#f7fbff 0%,#fdfbff 100%);
}

.tools-shell{
  max-width: 1240px;
  padding: 24px 28px 52px;
}

.tools-topbar{
  margin-bottom: 12px;
}

.tools-back,
.tools-manage{
  border-radius: 18px;
  padding: 11px 16px;
  box-shadow: 0 8px 18px rgba(31,64,102,.08);
  transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
}

.tools-back:hover,
.tools-manage:hover,
.tool-open:hover{
  transform: translateY(-1px);
  box-shadow: 0 10px 20px rgba(31,64,102,.12);
}

.tools-back{
  background: #eef5ff;
  border: 1px solid #dbe7f7;
}

.tools-manage{
  background: #173a61;
  color: #fff;
}

.tools-header-decoration{
  min-height: 190px;
  margin-bottom: 24px;
  border-radius: 28px;
  background:
    linear-gradient(135deg, rgba(207,231,255,.60), rgba(255,233,242,.60));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
}

.tools-title-wrap{
  padding: 18px 30px;
  border-radius: 28px;
  background: rgba(255,255,255,.92);
  border: 1px solid rgba(223,234,245,.95);
  box-shadow: 0 16px 30px rgba(35,61,91,.10);
}

.tools-title-wrap h1{
  font-size: 48px;
  line-height: 1;
  margin: 0 0 8px;
  color: #173a61;
}

.tools-title-wrap p{
  margin: 0;
  font-size: 20px;
  color: #6a7f97;
}

.tools-character{
  bottom: -6px;
  filter: drop-shadow(0 10px 16px rgba(32,57,89,.12));
}

.tools-character.blue{
  left: 34px;
  width: 138px;
}

.tools-character.green{
  right: 34px;
  width: 138px;
}

.tools-zones{
  gap: 24px;
  align-items: start;
}

.tools-zone{
  position: relative;
  padding: 20px 20px 18px;
  border-radius: 28px;
  border: 1px solid #dfe8f4;
  background: rgba(255,255,255,.88);
  box-shadow: 0 14px 32px rgba(35,61,91,.08);
  overflow: hidden;
}

.tools-zone::before{
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 14px;
  border-radius: 28px 28px 0 0;
  opacity: .95;
}

.tools-zone[data-zone-id="theory"]{
  background: linear-gradient(180deg,#f7fbff 0%, #ffffff 100%);
  border-color: #dbe7f5;
}

.tools-zone[data-zone-id="theory"]::before{
  background: linear-gradient(90deg,#a8d2ff,#cde6ff);
}

.tools-zone[data-zone-id="competence"]{
  background: linear-gradient(180deg,#fff6fa 0%, #ffffff 100%);
  border-color: #efdbe5;
}

.tools-zone[data-zone-id="competence"]::before{
  background: linear-gradient(90deg,#f7b5cf,#f9d6e5);
}

.tools-zone:not([data-zone-id="theory"]):not([data-zone-id="competence"]):nth-child(odd){
  background: linear-gradient(180deg,#f4fbf5 0%, #ffffff 100%);
  border-color: #d8ead9;
}
.tools-zone:not([data-zone-id="theory"]):not([data-zone-id="competence"]):nth-child(odd)::before{
  background: linear-gradient(90deg,#abd9b1,#d8efdb);
}
.tools-zone:not([data-zone-id="theory"]):not([data-zone-id="competence"]):nth-child(even){
  background: linear-gradient(180deg,#faf6ff 0%, #ffffff 100%);
  border-color: #e8dbf6;
}
.tools-zone:not([data-zone-id="theory"]):not([data-zone-id="competence"]):nth-child(even)::before{
  background: linear-gradient(90deg,#d2b8ff,#eadbff);
}

.tools-zone h2{
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(223,232,244,.85);
  font-size: 22px;
  color: #173a61;
}

.tools-zone h2::before{
  content: "";
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex: 0 0 14px;
  background: #b7cde6;
}

.tools-zone[data-zone-id="theory"] h2::before{
  background: #88bfff;
}
.tools-zone[data-zone-id="competence"] h2::before{
  background: #f49bc0;
}

.tools-list{
  gap: 12px;
}

.tool-sheet{
  min-height: 60px;
  border-radius: 18px;
  border: 1px solid #e2ebf5;
  background: rgba(255,255,255,.92);
  box-shadow: 0 4px 10px rgba(35,61,91,.04);
  padding: 12px 12px 12px 14px;
}

.tool-sheet-name{
  display: flex;
  align-items: center;
  gap: 10px;
  color: #25415f;
  font-weight: 800;
  font-size: 15px;
}

.tool-sheet-name::before{
  content: "•";
  color: #7ba6d9;
  font-size: 22px;
  line-height: 1;
}

.tool-open{
  min-width: 86px;
  padding: 10px 14px;
  border-radius: 14px;
  background: #eaf3ff;
  color: #1a4370;
  border: 1px solid #d6e4f3;
  box-shadow: 0 4px 10px rgba(35,61,91,.05);
}

.tools-empty{
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 220px;
  padding: 24px;
  text-align: center;
  color: #7e90a5;
  font-size: 15px;
  border: 2px dashed #d6e2ef;
  border-radius: 20px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.80), rgba(248,251,255,.92));
}

@media (max-width: 900px){
  .tools-shell{
    padding: 18px 16px 38px;
  }

  .tools-header-decoration{
    min-height: 160px;
    padding: 0 10px;
  }

  .tools-title-wrap{
    max-width: calc(100% - 120px);
    padding: 14px 18px;
  }

  .tools-title-wrap h1{
    font-size: 34px;
  }

  .tools-title-wrap p{
    font-size: 16px;
  }

  .tools-character.blue,
  .tools-character.green{
    width: 94px;
  }

  .tools-character.blue{ left: 4px; }
  .tools-character.green{ right: 4px; }
}

@media (max-width: 680px){
  .tools-zones{
    grid-template-columns: 1fr;
  }

  .tools-title-wrap{
    max-width: calc(100% - 40px);
  }
}

</style>
</head>

<script>
const HOME_HTML = "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Mon espace maths</title>\n<style>\n:root{--pink:#f25486;--navy:#17355e;--bg:#f7fbff;--line:#dfe8f2;--shadow:0 5px 15px rgba(23,53,94,.09)}\n*{box-sizing:border-box}\nhtml,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--navy)}\nbutton,input{font:inherit}\n.topbar{display:none}\n.brand{min-width:220px}\n.brand strong{font-size:22px;display:block;line-height:1}\n.brand small{font-size:12px}\n.topmenu{display:flex;gap:7px;align-items:center;flex:1}\n.topmenu button{border:0;background:transparent;padding:0;cursor:pointer}\n.topmenu img{height:46px;width:auto;display:block}\n.user img{height:46px;width:auto;display:block}\n\n.layout{display:grid;grid-template-columns:140px 1fr;min-height:100vh}\n.sidebar{\n  background:#fff;border-right:1px solid var(--line);padding:10px 6px;\n  display:flex;flex-direction:column;gap:7px\n}\n.sidebar button{border:0;background:transparent;padding:0;cursor:pointer}\n.sidebar img{width:100%;height:62px;object-fit:contain;display:block}\n.side-note{margin-top:auto;background:#fff0a4;border-radius:10px;padding:10px;text-align:center;font-weight:700;font-size:13px}\n\nmain{padding:0 12px 10px;overflow:hidden}\n.hero{\n  height:auto;margin:0 -12px 8px;\n  background:linear-gradient(90deg,#fff3f7,#eef8ff,#fff7df);\n  display:flex;align-items:center;justify-content:center;\n  overflow:hidden;border-bottom:1px solid var(--line)\n}\n.hero img{\n  width:100%;height:auto;object-fit:contain;display:block\n}\n\n.container{max-width:1580px;margin:auto}\n.heading-row{display:flex;align-items:center;gap:10px;height:34px}\n.heading-row h2{margin:0;font:700 25px \"Comic Sans MS\",cursive}\n.heading-row .line{height:3px;background:var(--pink);border-radius:99px;flex:1;max-width:520px}\n.search{margin-left:auto;width:250px;border:1.5px solid #cad9ea;border-radius:12px;padding:7px 11px;background:#fff}\n\n.chapter-grid{\n  display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;margin-top:6px\n}\n.chapter-card{\n  border:0;background:#fff;border-radius:14px;padding:0;overflow:hidden;\n  box-shadow:var(--shadow);cursor:pointer;min-width:0;transition:.15s transform\n}\n.chapter-card:hover{transform:translateY(-2px)}\n.chapter-card img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block}\n\n.quick-title{margin-top:9px}\n.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:5px}\n.quick-card{border:0;background:#fff;border-radius:14px;padding:0;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}\n.quick-card img{width:100%;height:92px;object-fit:contain;display:block}\n\n.footer{\n  margin:8px -12px -10px;padding:7px 18px;background:#fff;border-top:1px solid var(--line);\n  display:flex;justify-content:space-between;font-size:12px\n}\n\n#detail{display:none;padding-top:14px}\n.back{border:0;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;color:var(--navy);box-shadow:var(--shadow);cursor:pointer}\n#detail h1{margin:10px 0 4px;font:700 32px \"Comic Sans MS\",cursive}\n.resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}\n.resource{border-radius:16px;padding:12px;box-shadow:var(--shadow)}\n.blue{background:#dff1ff}.rose{background:#ffe1eb}.green{background:#e3f8e8}\n.yellow{background:#fff4c8}.purple{background:#eee5ff}.orange{background:#ffe7d3}\n.resource h3{margin:0 0 5px;font:700 22px \"Comic Sans MS\",cursive}\n.item{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:10px;padding:8px;margin:6px 0;gap:8px}\n.item-left{display:flex;align-items:center;gap:8px}\n.item-left img{width:34px;height:34px;object-fit:contain}\n.item button{border:0;background:#e9f2ff;color:#145bb2;border-radius:8px;padding:7px 9px;font-weight:700;cursor:pointer}\n.toast{position:fixed;right:18px;bottom:18px;background:#17355e;color:#fff;padding:11px 14px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}\n.toast.show{opacity:1}\n\n@media(max-width:1250px){\n .chapter-grid{grid-template-columns:repeat(6,1fr)}\n .hero{height:auto}\n}\n@media(max-width:850px){\n .layout{grid-template-columns:1fr} .sidebar{display:none}\n .brand{min-width:auto} .topmenu img,.user img{height:40px}\n main{padding:0 8px 8px} .hero{margin:0 -8px 8px;height:auto}\n .chapter-grid{grid-template-columns:repeat(3,1fr)}\n .quick-grid{grid-template-columns:1fr}\n .resource-grid{grid-template-columns:1fr}\n .heading-row{height:auto;flex-wrap:wrap} .search{width:100%;margin-left:0}\n}\n\n.student-side{\n  margin-top:6px;\n  padding:8px 4px 4px;\n  border-top:1px solid var(--line);\n}\n.student-side img{\n  width:100%;\n  height:78px;\n  object-fit:contain;\n  display:block;\n}\n\n\n/* --- Gestion visibilité des chapitres --- */\n.home-prof-toggle{\n  position:fixed;left:18px;bottom:18px;z-index:3000;\n  border:0;border-radius:16px;padding:10px 14px;\n  background:#eef5fb;color:#173a61;font-weight:800;cursor:pointer;\n  box-shadow:0 8px 18px rgba(22,55,93,.14)\n}\nbody.home-teacher-mode .home-prof-toggle{\n  background:#173a61;color:#fff\n}\n.manage-chapters-btn{\n  position:fixed;right:18px;bottom:18px;z-index:3000;\n  display:none;border:0;border-radius:16px;padding:10px 14px;\n  background:#173a61;color:#fff;font-weight:800;cursor:pointer;\n  box-shadow:0 8px 18px rgba(22,55,93,.14)\n}\nbody.home-teacher-mode .manage-chapters-btn{display:block}\n.chapter-card.chapter-hidden{display:none !important}\nbody.home-teacher-mode .chapter-card.chapter-hidden{\n  display:flex !important;opacity:.38;filter:grayscale(.35);position:relative\n}\nbody.home-teacher-mode .chapter-card.chapter-hidden::after{\n  content:\"Masqué\";position:absolute;top:7px;right:7px;\n  background:#173a61;color:#fff;font-size:10px;font-weight:900;\n  padding:4px 7px;border-radius:999px\n}\n.chapter-visibility-panel{\n  position:fixed;inset:0;z-index:3200;display:none;\n  align-items:center;justify-content:center;padding:20px;\n  background:rgba(20,40,70,.34)\n}\n.chapter-visibility-panel.open{display:flex}\n.chapter-visibility-card{\n  width:min(720px,95vw);max-height:88vh;overflow:auto;\n  background:#fff;border-radius:22px;padding:20px;\n  box-shadow:0 20px 50px rgba(22,55,93,.25)\n}\n.chapter-visibility-head{\n  display:flex;align-items:center;justify-content:space-between;gap:12px;\n  margin-bottom:14px\n}\n.chapter-visibility-head h2{margin:0;color:#173a61}\n.chapter-visibility-close{\n  border:0;width:38px;height:38px;border-radius:50%;\n  background:#eef5fb;font-size:22px;cursor:pointer\n}\n.chapter-visibility-list{display:flex;flex-direction:column;gap:7px}\n.chapter-vis-row{\n  display:grid;grid-template-columns:55px 1fr auto;\n  gap:10px;align-items:center;padding:10px 12px;\n  border-radius:12px;background:#f7fbff\n}\n.chapter-vis-num{font-weight:900;color:#173a61}\n.chapter-vis-name{font-weight:700;color:#40546a}\n.chapter-vis-toggle{\n  display:flex;align-items:center;gap:7px;font-weight:700;color:#40546a\n}\n\n\n/* --- Connexion / comptes élèves --- */\n.student-login-screen{\n  position:fixed;inset:0;z-index:6000;\n  background:linear-gradient(180deg,#f5fbff 0%,#fff7fb 100%);\n  display:flex;align-items:center;justify-content:center;padding:22px;\n}\n.student-login-screen.hidden{display:none}\n.login-card{\n  width:min(920px,96vw);display:grid;grid-template-columns:1.05fr .95fr;\n  background:#fff;border-radius:28px;overflow:hidden;\n  box-shadow:0 20px 60px rgba(32,64,96,.16)\n}\n.login-visual{\n  position:relative;min-height:520px;padding:34px;\n  background:linear-gradient(160deg,#dff4ff,#f3e9ff 55%,#fff0d9);\n  overflow:hidden\n}\n.login-visual h1{margin:0;color:#173a61;font-size:34px}\n.login-visual p{color:#56708c;max-width:420px;line-height:1.5}\n.login-avatar-left,.login-avatar-right{\n  position:absolute;bottom:8px;height:360px;object-fit:contain;pointer-events:none\n}\n.login-avatar-left{left:-18px}\n.login-avatar-right{right:-45px;height:330px}\n.login-form-wrap{padding:42px 38px;display:flex;flex-direction:column;justify-content:center}\n.login-form-wrap h2{margin:0 0 7px;color:#173a61;font-size:28px}\n.login-help{color:#6d7f93;font-size:14px;margin-bottom:22px}\n.login-field{margin-bottom:13px}\n.login-field label{display:block;margin-bottom:6px;font-weight:800;color:#304963}\n.login-field input,.student-admin-form input,.student-admin-form select{\n  width:100%;box-sizing:border-box;border:1px solid #d9e5f1;\n  border-radius:12px;padding:11px 12px;font:inherit;background:#fff\n}\n.login-submit{\n  border:0;border-radius:13px;padding:12px 14px;\n  background:#173a61;color:white;font-weight:900;font-size:16px;cursor:pointer\n}\n.login-error{min-height:22px;margin-top:10px;color:#b44755;font-weight:700;font-size:13px}\n.temp-teacher-access{\n  margin-top:18px;border:0;background:transparent;color:#6d7f93;\n  text-decoration:underline;cursor:pointer;font-size:12px\n}\n.student-session-badge{\n  display:flex;align-items:center;gap:8px;margin-top:10px;\n  padding:7px 9px;border-radius:12px;background:rgba(255,255,255,.7)\n}\n.student-session-badge img{\n  width:42px;height:42px;object-fit:contain;border-radius:50%;background:#fff\n}\n.student-session-name{font-weight:900;color:#173a61;font-size:13px}\n.student-logout{\n  margin-left:auto;border:0;border-radius:9px;padding:6px 8px;\n  background:#eef5fb;color:#173a61;font-weight:800;cursor:pointer;font-size:11px\n}\n\n/* Gestion locale des élèves */\n.manage-students-btn{\n  position:fixed;right:18px;bottom:68px;z-index:3000;\n  display:none;border:0;border-radius:16px;padding:10px 14px;\n  background:#6b4bb4;color:#fff;font-weight:800;cursor:pointer;\n  box-shadow:0 8px 18px rgba(70,52,120,.18)\n}\nbody.home-teacher-mode .manage-students-btn{display:block}\n.student-admin-panel{\n  position:fixed;inset:0;z-index:6100;display:none;\n  align-item \n  padding:3px;\n  border:3px solid transparent;\n  border-radius:16px;\n  background:#fff;\n  cursor:pointer;\n  transition:.15s ease;\n}\n.avatar-choice img{\n  width:100%;\n  height:100%;\n  object-fit:contain;\n  display:block;\n}\n.avatar-choice.selected{\n  border-color:#173a61;\n  box-shadow:0 0 0 3px rgba(23,58,97,.12);\n  transform:translateY(-1px);\n}\n\n\n.avatar-picker{\n  display:grid !important;\n  grid-template-columns:repeat(8, minmax(58px, 72px));\n  gap:8px !important;\n  align-items:center;\n}\n.avatar-choice{\n  width:68px !important;\n  height:68px !important;\n}\n@media (max-width: 900px){\n  .avatar-picker{grid-template-columns:repeat(4, 68px);}\n}\n\n\n.math-logout-btn{\n  margin-top:10px;\n  width:100%;\n  border:0;\n  border-radius:12px;\n  padding:9px 12px;\n  background:#173a61;\n  color:#fff;\n  font-weight:800;\n  cursor:pointer;\n  font-size:14px;\n}\n.math-logout-btn:hover{\n  filter:brightness(1.06);\n}\n\n\n\n\n\n/* Profil réellement connecté */\n.student-side{display:none !important;}\n\n.math-session-card{\n  margin:10px 7px 8px;\n  padding:9px 5px 8px;\n  border-top:1px solid #d9e6f1;\n  text-align:center;\n  color:#173a61;\n}\n.math-session-avatar{\n  width:58px;\n  height:58px;\n  object-fit:cover;\n  border-radius:50%;\n  display:block;\n  margin:0 auto 5px;\n  background:#fff;\n  border:3px solid #fff;\n  box-shadow:0 2px 8px rgba(30,60,90,.13);\n}\n.math-session-name{\n  font-size:11px;\n  line-height:1.18;\n  font-weight:900;\n  word-break:normal;\n}\n.math-session-class{\n  display:inline-block;\n  margin-top:4px;\n  padding:3px 7px;\n  border-radius:999px;\n  background:#eef5fb;\n  font-size:10px;\n  font-weight:800;\n}\n.math-session-logout{\n  width:100%;\n  margin-top:7px;\n  padding:6px 3px;\n  border:0;\n  border-radius:9px;\n  background:#f3a0b8;\n  color:#fff;\n  font-size:10px;\n  font-weight:900;\n  cursor:pointer;\n}\n.math-session-role-icon{\n  width:50px;\n  height:50px;\n  margin:0 auto 5px;\n  border-radius     <div class=\"progress-eyebrow\">MON SUIVI</div>\n      <h1>Mes progrès</h1>\n      <p>Retrouve ici tes résultats aux quiz et vois les chapitres que tu maîtrises déjà.</p>\n    </div>\n    <button class=\"progress-back-btn\" id=\"progressBackBtn\" type=\"button\">← Retour à l’accueil</button>\n  </div>\n\n  <div class=\"progress-summary\" id=\"progressSummary\">\n    <div class=\"progress-stat\">\n      <div class=\"progress-stat-value\" id=\"progressDoneCount\">0</div>\n      <div class=\"progress-stat-label\">Quiz réalisés</div>\n    </div>\n    <div class=\"progress-stat\">\n      <div class=\"progress-stat-value\" id=\"progressPassedCount\">0</div>\n      <div class=\"progress-stat-label\">Quiz réussis</div>\n    </div>\n    <div class=\"progress-stat\">\n      <div class=\"progress-stat-value\" id=\"progressBestScore\">—</div>\n      <div class=\"progress-stat-label\">Meilleur score</div>\n    </div>\n    <div class=\"progress-stat\">\n      <div class=\"progress-stat-value\" id=\"progressChaptersCount\">0</div>\n      <div class=\"progress-stat-label\">Chapitres évalués</div>\n    </div>\n  </div>\n\n  <div class=\"progress-global-card\">\n    <div class=\"progress-global-row\">\n      <div>\n        <strong>Ma progression dans les quiz</strong>\n        <span id=\"progressGlobalText\">Aucun quiz réalisé pour le moment.</span>\n      </div>\n      <div class=\"progress-global-percent\" id=\"progressGlobalPercent\">0%</div>\n    </div>\n    <div class=\"progress-bar\">\n      <div class=\"progress-bar-fill\" id=\"progressBarFill\"></div>\n    </div>\n  </div>\n\n  <div class=\"progress-section-title\">\n    <h2>Mes chapitres</h2>\n    <div class=\"line\"></div>\n  </div>\n\n  <div class=\"progress-chapters-grid\" id=\"progressChaptersGrid\">\n    <div class=\"progress-loading\">Chargement de tes progrès…</div>\n  </div>\n</section>\n\n<section id=\"detail\" class=\"container\">\n  <button class=\"back\" onclick=\"goHome()\">← Tous les chapitres</button>\n  <h1 id=\"detailTitle\">Chapitre</h1>\n  <p>Tout ce dont tu as besoin pour apprendre, t’entraîner et réussir.</p>\n\n  <div class=\"resource-grid\">\n    <div class=\"resource blue\">\n      <h3>J’apprends</h3>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"f1361bc1725d7522.png\"><span>Cours — version élève</span></div><button onclick=\"showToast('Cours')\">Ouvrir</button></div>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"018897b09cb6e017.png\"><span>Fiches outils</span></div><button onclick=\"showToast('Fiches outils')\">Ouvrir</button></div>\n    </div>\n    <div class=\"resource rose\">\n      <h3>Je prépare mon test</h3>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"ee095443ac9f787e.png\"><span>Préparation au test</span></div><button onclick=\"showToast('Préparation')\">Ouvrir</button></div>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"81efe222114f6e8e.png\"><span>Corrigé</span></div><button onclick=\"showToast('Corrigé')\">Ouvrir</button></div>\n    </div>\n    <div class=\"resource green\">\n      <h3>Je m’entraîne</h3>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"ee095443ac9f787e.png\"><span>Exercices supplémentaires</span></div><button onclick=\"showToast('Exercices')\">Ouvrir</button></div>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"14617ac79720a714.png\"><span>Corrigé</span></div><button onclick=\"showToast('Corrigé exercices')\">Ouvrir</button></div>\n    </div>\n    <div class=\"resource yellow\">\n      <h3>J’ai besoin d’aide</h3>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"0941100e7212fd8f.png\"><span>Remédiation</span></div><button onclick=\"showToast('Remédiation')\">Ouvrir</button></div>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"81efe222114f6e8e.png\"><span>Corrigé</span></div><button onclick=\"showToast('Corrigé remédiation')\">Ouvrir</button></div>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"5c0fc30c0bd92e67.png\"><span>Corrections détaillées</span></div><button onclick=\"showToast('Corrections détaillées')\">Ouvrir</button></div>\n    </div>\n    <div class=\"resource purple\">\n      <h3>Je me challenge</h3>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"34c0d39cdf577e9b.png\"><span>Défis math</span></div><button onclick=\"showToast('Défis')\">Ouvrir</button></div>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"81efe222114f6e8e.png\"><span>Corrigé des défis</span></div><button onclick=\"showToast('Corrigé défis')\">Ouvrir</button></div>\n    </div>\n    <div class=\"resource orange\">\n      <h3>Mon suivi</h3>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"3f6857e9e479a511.png\"><span>Mes résultats aux quiz</span></div><button onclick=\"showToast('Résultats')\">Voir</button></div>\n      <div class=\"item\"><div class=\"item-left\"><img src=\"f68dcd223c848876.png\"><span>Mes objectifs</span></div><button onclick=\"showToast('Objectifs')\">Voir</button></div>\n    </div>\n  </div>\n</section>\n</main>\n</div>\n\n<div id=\"toast\" class=\"toast\"></div>\n<script>\nfunction openChapter(n,name){\n  window.currentMathChapter = Number(n);\n  document.getElementById('home').style.display='none';\n  document.getElementById('detail').style.display='block';\n  document.getElementById('detailTitle').textContent='Chapitre '+n+' — '+name;\n  loadChapterSupabaseQuizzes(Number(n));\n  window.scrollTo(0,0);\n}\nfunction goHome(){\n  document.getElementById('detail').style.display='none';\n  document.getElementById('home').style.display='block';\n  window.scrollTo(0,0);\n}\n\n\n\n\n\nfunction goToQuizInChapter(quiz){\n  const chapterNumber = Number(quiz?.chapter_number || 1);\n  const chapterName = QUIZ_CHAPTER_NAMES[chapterNumber - 1] || '';\n\n\n  openChapter(chapterNumber, chapterName);\n\n  setTimeout(() => {\n    const detail = document.getElementById('detail');\n    if(!detail) return;\n\n    const prepBlock = Array.from(detail.querySelectorAll('.resource'))\n      .find(el => (el.querySelector('h3')?.textContent || '').trim() === \"Je prépare mon test\");\n\n    if(prepBlock){\n      prepBlock.scrollIntoView({behavior:'smooth', block:'start'});\n      prepBlock.style.outline = '3px solid #f2b7c9';\n      prepBlock.style.outlineOffset = '4px';\n      setTimeout(() => {\n        prepBlock.style.outline = '';\n        prepBlock.style.outlineOffset = '';\n      }, 1800);\n    }\n  }, 120);\n}\n\nfunction openLinkedMathQuiz(quiz){\n  let url = '';\n\n  // Priorité au quiz réellement paramétré dans la page du chapitre.\n  // C'est ce lien qui fonctionne déjà depuis le chapitre.\n  try{\n    const chapter = Number(quiz?.chapter_number || 1);\n    const keys = [\n      'mathspace_items_v1_chapter_' + chapter + '_prepare',\n      'mathspace_items_v1_chapter_' + chapter + '_train'\n    ];\n\n    for(const key of keys){\n      const raw = localStorage.getItem(key);\n      if(!raw) continue;\n      const items = JSON.parse(raw);\n      if(!Array.isArray(items)) continue;\n\n      const item = items.find(x =>\n        x &&\n        x.visible !== false &&\n        (\n          x.id === 'trainingQuiz' ||\n          x.type === 'quiz' ||\n          String(x.name || '').toLowerCase().includes('quiz')\n        ) &&\n        String(x.url || '').trim()\n      );\n\n      if(item){\n        url = String(item.url).trim();\n        break;\n      }\n    }\n  }catch(e){\n    console.warn('Lecture du lien du quiz du chapitre :', e);\n  }\n\n  // Secours : lien enregistré dans math_quizzes.\n  if(!url) url = String(quiz?.source_url || '').trim();\n\n  if(!url){\n    if(typeof showToast === 'function'){\n      showToast('Aucun lien n’est configuré pour ce quiz.');\n    }\n    return;\n  }\n\n  window.open(url, '_blank', 'noopener,noreferrer');\n}\nasync function saveIncomingMathQuizResult(payload){\n  // Désactivé dans la version stable simplifiée.\n  return;\n}\n\n\n\nasync function loadChapterSupabaseQuizzes(chapterNumber){\n  const detail = document.getElementById('detail');\n  if(!detail) return;\n\n  const prepBlock = Array.from(detail.querySelectorAll('.resource'))\n    .find(el => (el.querySelector('h3')?.textContent || '').trim() === \"Je prépare mon test\");\n  if(!prepBlock) return;\n\n  prepBlock.querySelectorAll('.chapter-supabase-quiz').forEach(el => el.remove());\n\n  try{\n    const db = window.mathSupabase;\n    if(!db) throw new Error('Connexion Supabase non initialisée.');\n    const { data, error } = await db\n      .from('math_quizzes')\n      .select('id, title, source_url, active')\n      .eq('chapter_number', chapterNumber)\n      .eq('active', true)\n      .order('title', { ascending:true });\n\n    if(error) throw error;\n\n    (data || []).forEach(q => {\n      const row = document.createElement('div');\n      row.className = 'item chapter-supabase-quiz';\n\n      const left = document.createElement('div');\n      left.className = 'item-left';\n\n      const label = document.createElement('span');\n      label.textContent = q.title;\n      left.appendChild(label);\n\n      const btn = document.createElement('button');\n      btn.type = 'button';\n      btn.textContent = 'Ouvrir';\n      btn.addEventListener('click', () => {\n        if(q.source_url){\n          openLinkedMathQuiz(q);\n        }else{\n          openQuizHub();\n        }\n      });\n\n      row.append(left, btn);\n      prepBlock.appendChild(row);\n    });\n  }catch(err){\n    console.error('Chargement des quiz du chapitre :', err);\n  }\n}\n\nfunction setupQuizAdmin(){\n  const addBtn = document.getElementById('quizAddBtn');\n  const modal = document.getElementById('quizAdminModal');\n  const chapter = document.getElementById('quizAdminChapter');\n  const cancel = document.getElementById('quizAdminCancel');\n  const save = document.getElementById('quizAdminSave');\n\n  if(chapter && !chapter.dataset.ready){\n    QUIZ_CHAPTER_NAMES.forEach((name, i) => {\n      const o = document.createElement('option');\n      o.value = String(i + 1);\n      o.textContent = 'Chapitre ' + (i + 1) + ' — ' + name;\n      chapter.appendChild(o);\n    });\n    chapter.dataset.ready = '1';\n  }\n\n  if(addBtn){\n    addBtn.style.display = window.currentMathProfile?.role === 'teacher' ? 'inline-block' : 'none';\n    if(!addBtn.dataset.bound){\n      addBtn.dataset.bound='1';\n      addBtn.addEventListener('click', () => {\n        const status = document.getElementById('quizAdminStatus');\n        if(status) status.textContent='';\n        if(!window.mathSupabase){\n          if(status){\n            status.style.color='#a13b54';\n            status.textContent='Connexion Supabase en cours. Réessaie dans un instant.';\n          }\n        }\n        if(window.currentMathChapter){\n          chapter.value = String(window.currentMathChapter);\n        }\n        modal.style.display='flex';\n      });\n    }\n  }\n\n  if(cancel && !cancel.dataset.bound){\n    cancel.dataset.bound='1';\n    cancel.addEventListener('click', () => modal.style.display='none');\n  }\n\n  if(save && !save.dataset.bound){\n    save.dataset.bound='1';\n    save.addEventListener('click', async () => {\n      const status = document.getElementById('quizAdminStatus');\n      const title = (document.getElementById('quizAdminTitle').value || '').trim();\n      const url = (document.getElementById('quizAdminUrl').value || '').trim();\n      const chapterNumber = Number(document.getElementById('quizAdminChapter').value);\n      const pass = Number(document.getElementById('quizAdminPass').value || 50);\n\n      if(!title || !url){\n        status.style.color='#a13b54';\n        status.textContent='Indique le nom du quiz et son lien OneDrive.';\n        return;\n      }\n\n      save.disabled=true;\n      save.textContent='Enregistrement…';\n      status.textContent='';\n\n      try{\n        const db = window.mathSupabase;\n        if(!db) throw new Error('Connexion Supabase non initialisée.');\n        const { error } = await db.from('math_quizzes').insert({\n          chapter_number: chapterNumber,\n          title,\n          description: null,\n          pass_percentage: pass,\n          active: true,\n          questions: [],\n          source_url: url,\n          created_by: window.currentMathProfile.id\n        });\n        if(error) throw error;\n\n        document.getElementById('quizAdminTitle').value='';\n        document.getElementById('quizAdminUrl').value='';\n        document.getElementById('quizAdminPass').value='50';\n\n        modal.style.display='none';\n        await loadQuizHub();\n\n        if(window.currentMathChapter === chapterNumber){\n          await loadChapterSupabaseQuizzes(chapterNumber);\n        }\n      }catch(err){\n        status.style.color='#a13b54';\n        status.textContent='Erreur : ' + (err?.message || String(err));\n      }finally{\n        save.disabled=false;\n        save.textContent='Enregistrer';\n      }\n    });\n  }\n}\n\n\nconst QUIZ_CHAPTER_NAMES = [\n  \"La numération\",\"Repérage de nombres\",\"Les figures élémentaires\",\"Opérations dans ℕ\",\n  \"Les puissances\",\"Les angles\",\"Opérations dans ℤ\",\"Axe et centre de symétrie\",\n  \"Les rationnels\",\"Pourcentages\",\"Les triangles\",\"Le repérage\",\"Les quadrilatères\",\n  \"Calcul algébrique\",\"Les polygones\",\"Les équations\",\"Les transformations du plan\",\n  \"Proportionnalité\",\"Les statistiques\"\n];\n\nlet mathQuizCache = [];\nlet mathAttemptCache = [];\n\nfunction fillQuizChapterFilter(){\n  const select = document.getElementById('quizChapterFilter');\n  if(!select || select.dataset.ready === '1') return;\n  QUIZ_CHAPTER_NAMES.forEach((name, index) => {\n    const opt = document.createElement('option');\n    opt.value = String(index + 1);\n    opt.textContent = 'Chapitre ' + (index + 1) + ' — ' + name;\n    select.appendChild(opt);\n  });\n  select.dataset.ready = '1';\n  select.addEventListener('change', renderQuizHub);\n}\n\nfunction openQuizHub(){ goHome(); }\n\nfunction closeQuizHub(){ goHome(); }\n\nasync function loadQuizHub(){ return; }\n\n\nlet currentQuizBeingEdited = null;\n\nfunction ensureQuizEditChapterOptions(){\n  const select = document.getElementById('quizEditChapter');\n  if(!select || select.dataset.ready) return;\n\n  QUIZ_CHAPTER_NAMES.forEach((name, i) => {\n    const option = document.createElement('option');\n    option.value = String(i + 1);\n    option.textContent = 'Chapitre ' + (i + 1) + ' — ' + name;\n    select.appendChild(option);\n  });\n\n  select.dataset.ready = '1';\n}\n\nfunction openQuizEdit(quiz){\n  if(window.currentMathProfile?.role !== 'teacher') return;\n\n  ensureQuizEditChapterOptions();\n  currentQuizBeingEdited = quiz;\n\n  document.getElementById('quizEditChapter').value = String(quiz.chapter_number);\n  document.getElementById('quizEditTitle').value = quiz.title || '';\n  document.getElementById('quizEditUrl').value = quiz.source_url || '';\n  document.getElementById('quizEditPass').value = Number(quiz.pass_percentage ?? 50);\n  document.getElementById('quizEditActive').checked = quiz.active !== false;\n\n  const status = document.getElementById('quizEditStatus');\n  status.textContent = '';\n\n  document.getElementById('quizEditModal').style.display = 'flex';\n}\n\nasync function saveQuizEdit(){\n  if(window.currentMathProfile?.role !== 'teacher') return;\n  if(!currentQuizBeingEdited) return;\n\n  const chapterNumber = Number(document.getElementById('quizEditChapter')?.value || 0);\n  const title = String(document.getElementById('quizEditTitle')?.value || '').trim();\n  const sourceUrl = String(document.getElementById('quizEditSourceUrl')?.value || '').trim();\n  const passPercentage = Number(document.getElementById('quizEditPassPercentage')?.value || 50);\n  const active = !!document.getElementById('quizEditActive')?.checked;\n\n  const status = document.getElementById('quizEditStatus');\n\n  if(!chapterNumber || !title){\n    if(status) status.textContent = 'Choisis un chapitre et indique un titre.';\n    return;\n  }\n\n  try{\n    const db = window.mathSupabase;\n    if(!db) throw new Error('Connexion Supabase non initialisée.');\n\n    if(status) status.textContent = 'Enregistrement…';\n\n    const oldChapterNumber = Number(currentQuizBeingEdited.chapter_number || chapterNumber);\n\n    const { error } = await db\n      .from('math_quizzes')\n      .update({\n        chapter_number: chapterNumber,\n        title,\n        source_url: sourceUrl || null,\n        pass_percentage: passPercentage,\n        active\n      })\n      .eq('id', currentQuizBeingEdited.id);\n\n    if(error) throw error;\n\n    // Synchroniser la ressource \"quiz\" du chapitre local.\n    try{\n      // 1. Retirer l'ancien quiz de l'ancien chapitre si le chapitre a changé.\n      if(oldChapterNumber !== chapterNumber){\n        const oldKey = 'mathspace_items_v1_chapter_' + oldChapterNumber + '_prepare';\n        const oldRaw = localStorage.getItem(oldKey);\n        if(oldRaw){\n          const oldItems = JSON.parse(oldRaw);\n          if(Array.isArray(oldItems)){\n            const cleanedOld = oldItems.filter(item => {\n              if(!item) return false;\n              const isSameQuiz =\n                item.id === 'trainingQuiz' ||\n                item.type === 'quiz' ||\n                String(item.name || '').trim() === String(currentQuizBeingEdited.title || '').trim();\n              return !isSameQuiz;\n            });\n            localStorage.setItem(oldKey, JSON.stringify(cleanedOld));\n          }\n        }\n      }\n\n      // 2. Ajouter ou mettre à jour le quiz dans \"Je prépare mon test\" du nouveau chapitre.\n      const newKey = 'mathspace_items_v1_chapter_' + chapterNumber + '_prepare';\n      let items = [];\n\n      const newRaw = localStorage.getItem(newKey);\n      if(newRaw){\n        try{\n          items = JSON.parse(newRaw);\n        }catch(e){\n          items = [];\n        }\n      }\n\n      if(!Array.isArray(items)) items = [];\n\n      let idx = items.findIndex(item =>\n        item && (\n          item.id === 'trainingQuiz' ||\n          item.type === 'quiz' ||\n          String(item.name || '').trim() === String(currentQuizBeingEdited.title || '').trim()\n        )\n      );\n\n      const syncedItem = {\n        id: idx >= 0 && items[idx]?.id ? items[idx].id : 'trainingQuiz',\n        name: title,\n        type: 'quiz',\n        url: sourceUrl,\n        button: 'Ouvrir',\n        visible: active\n      };\n\n      if(idx >= 0){\n        items[idx] = {...items[idx], ...syncedItem};\n      }else{\n        items.push(syncedItem);\n      }\n\n      localStorage.setItem(newKey, JSON.stringify(items));\n\n      // 3. S'assurer qu'il n'existe aucun quiz dans \"Je m'entraîne\".\n      for(const ch of [oldChapterNumber, chapterNumber]){\n        const trainKey = 'mathspace_items_v1_chapter_' + ch + '_train';\n        const trainRaw = localStorage.getItem(trainKey);\n        if(!trainRaw) continue;\n\n        try{\n          const trainItems = JSON.parse(trainRaw);\n          if(!Array.isArray(trainItems)) continue;\n\n          const cleanedTrain = trainItems.filter(item =>\n            !(item && (\n              item.id === 'trainingQuiz' ||\n              item.type === 'quiz'\n            ))\n          );\n          localStorage.setItem(trainKey, JSON.stringify(cleanedTrain));\n        }catch(e){}\n      }\n    }catch(syncErr){\n      console.warn('Synchronisation du quiz avec le chapitre :', syncErr);\n    }\n\n    document.getElementById('quizEditModal').style.display = 'none';\n    currentQuizBeingEdited = null;\n\n    await loadQuizHub();\n\n    if(window.currentMathChapter){\n      await loadChapterSupabaseQuizzes(Number(window.currentMathChapter));\n    }\n\n    if(typeof showToast === 'function'){\n      showToast('Quiz modifié et synchronisé avec le chapitre.');\n    }\n  }catch(err){\n    console.error('Modification quiz :', err);\n    if(status) status.textContent = 'Erreur : ' + (err?.message || String(err));\n  }\n}\nfunction setupQuizEditManagement(){\n  ensureQuizEditChapterOptions();\n\n  const cancel = document.getElementById('quizEditCancel');\n  const save = document.getElementById('quizEditSave');\n\n  if(cancel && !cancel.dataset.bound){\n    cancel.dataset.bound = '1';\n    cancel.addEventListener('click', () => {\n      document.getElementById('quizEditModal').style.display = 'none';\n    });\n  }\n\n  if(save && !save.dataset.bound){\n    save.dataset.bound = '1';\n    save.addEventListener('click', saveQuizEdit);\n  }\n}\n\nfunction renderQuizHub(){ return; }\n\nfunction showToast(t){\n  const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');\n  clearTimeout(window.tt);window.tt=setTimeout(()=>el.classList.remove('show'),1800);\n}\ndocument.getElementById('search').addEventListener('input',e=>{\n  const q=e.target.value.toLowerCase();\n  document.querySelectorAll('.chapter-card').forEach(c=>{\n    c.style.display=c.dataset.name.includes(q)?'block':'none';\n  });\n});\n\n\nconst linkedChapterNames = [\"La numération\", \"Repérage de nombres\", \"Les figures élémentaires\", \"Opérations dans ℕ\", \"Les puissances\", \"Les angles\", \"Opérations dans ℤ\", \"Axe et centre de symétrie\", \"Les rationnels\", \"Pourcentages\", \"Les triangles\", \"Le repérage\", \"Les quadrilatères\", \"Calcul algébrique\", \"Les polygones\", \"Les équations\", \"Les transformations du plan\", \"Proportionnalité\", \"Les statistiques\"];\ndocument.querySelectorAll('.chapter-card').forEach(card => {\n  card.addEventListener('click', () => {\n    const n = Number(card.dataset.chapter);\n    parent.postMessage({\n      type:'openChapter',\n      n:n,\n      title:linkedChapterNames[n-1] || ''\n    }, '*');\n  });\n});\n\n<\\/script>\n\n<button class=\"home-prof-toggle\" id=\"homeProfToggle\" type=\"button\">Mode professeur</button>\n<div class=\"chapter-visibility-panel\" id=\"chapterVisibilityPanel\">\n  <div class=\"chapter-visibility-card\">\n    <div class=\"chapter-visibility-head\">\n      <h2>Chapitres visibles pour les élèves</h2>\n      <button class=\"chapter-visibility-close\" id=\"chapterVisibilityClose\" type=\"button\">×</button>\n    </div>\n    <div class=\"chapter-visibility-list\" id=\"chapterVisibilityList\"></div>\n  </div>\n</div>\n\n\n<script>\ndocument.addEventListener('DOMContentLoaded', () => {\n  const VIS_KEY = 'mathspace_chapter_visibility_v1';\n  const chapterNames = [\n    \"La numération\",\"Repérage de nombres\",\"Les figures élémentaires\",\"Opérations dans ℕ\",\n    \"Les puissances\",\"Les angles\",\"Opérations dans ℤ\",\"Axe et centre de symétrie\",\n    \"Les rationnels\",\"Pourcentages\",\"Les triangles\",\"Le repérage\",\"Les quadrilatères\",\n    \"Calcul algébrique\",\"Les polygones\",\"Les équations\",\"Les transformations du plan\",\n    \"Proportionnalité\",\"Les statistiques\"\n  ];\n\n  function defaultVisibility(){\n    const obj={};\n    for(let i=1;i<=19;i++) obj[String(i)] = true;\n    return obj;\n  }\n  function getVisibility(){\n    try{\n      const raw=localStorage.getItem(VIS_KEY);\n      if(raw) return {...defaultVisibility(),...JSON.parse(raw)};\n    }catch(e){}\n    return defaultVisibility();\n  }\n  function setVisibility(data){\n    try{localStorage.setItem(VIS_KEY,JSON.stringify(data));}catch(e){}\n  }\n  function applyVisibility(){\n    const data=getVisibility();\n    document.querySelectorAll('.chapter-card').forEach(card=>{\n      const n=String(card.dataset.chapter||'');\n      card.classList.toggle('chapter-hidden', data[n] === false);\n    });\n  }\n  function setTeacherMode(on){\n    document.body.classList.toggle('home-teacher-mode',!!on);\n    const btn=document.getElementById('homeProfToggle');\n    if(btn) btn.textContent = on ? 'Mode élève' : 'Mode professeur';\n    applyVisibility();\n  }\n  function renderVisibilityManager(){\n    const host=document.getElementById('chapterVisibilityList');\n    if(!host) return;\n    const data=getVisibility();\n    host.innerHTML='';\n    chapterNames.forEach((name,index)=>{\n      const n=index+1;\n      const row=document.createElement('div');\n      row.className='chapter-vis-row';\n\n      const num=document.createElement('div');\n      num.className='chapter-vis-num';\n      num.textContent='Ch. '+n;\n\n      const label=document.createElement('div');\n      label.className='chapter-vis-name';\n      label.textContent=name;\n\n      const toggle=document.createElement('label');\n      toggle.className='chapter-vis-toggle';\n\n      const cb=document.createElement('input');\n      cb.type='checkbox';\n      cb.checked=data[String(n)] !== false;\n      cb.addEventListener('change',()=>{\n        const current=getVisibility();\n        current[String(n)] = cb.checked;\n        setVisibility(current);\n        applyVisibility();\n      });\n\n      toggle.append(cb,document.createTextNode('Visible'));\n      row.append(num,label,toggle);\n      host.appendChild(row);\n    });\n  }\n\n  document.getElementById('homeProfToggle')?.addEventListener('click',()=>{\n    setTeacherMode(!document.body.classList.contains('home-teacher-mode'));\n  });\n  document.getElementById('manageChaptersBtn')?.addEventListener('click',()=>{\n    renderVisibilityManager();\n    document.getElementById('chapterVisibilityPanel')?.classList.add('open');\n  });\n  document.getElementById('chapterVisibilityClose')?.addEventListener('click',()=>{\n    document.getElementById('chapterVisibilityPanel')?.classList.remove('open');\n  });\n  document.getElementById('chapterVisibilityPanel')?.addEventListener('click',e=>{\n    if(e.target.id==='chapterVisibilityPanel') e.currentTarget.classList.remove('open');\n  });\n\n  setTeacherMode(false);\n});\n<\\/script>\n\n\n<div class=\"student-login-screen\" id=\"studentLoginScreen\">\n  <div class=\"login-card\">\n    <div class=\"login-visual\">\n      <h1>Mon espace maths</h1>\n      <p>Connecte-toi pour retrouver tes chapitres, tes quiz et bientôt suivre tes progrès.</p>\n      <img class=\"login-avatar-left\" src=\"670dc4ca1c41c182.png\" alt=\"\">\n      <img class=\"login-avatar-right\" src=\"68c65287ad568312.png\" alt=\"\">\n    </div>\n    <div class=\"login-form-wrap\">\n      <h2>Connexion élève</h2>\n      <div class=\"login-help\">Entre ton identifiant <strong>NomPrénom</strong> et ton code.</div>\n      <div class=\"login-field\">\n        <label for=\"studentLoginId\">Identifiant</label>\n        <input id=\"studentLoginId\" autocomplete=\"username\" placeholder=\"Ex. DupontEmma\">\n      </div>\n      <div class=\"login-field\">\n        <label for=\"studentLoginCode\">Code</label>\n        <input id=\"studentLoginCode\" type=\"password\" autocomplete=\"current-password\" placeholder=\"Ton code\">\n      </div>\n      <button class=\"login-submit\" id=\"studentLoginBtn\" type=\"button\">Me connecter</button>\n      <div class=\"login-error\" id=\"studentLoginError\"></div>\n<div style=\"margin-top:18px;padding-top:15px;border-top:1px solid #e7edf5;\">\n  <button class=\"temp-teacher-access\" id=\"showTeacherLogin\" type=\"button\">Connexion professeur</button>\n  <div id=\"teacherLoginBox\" style=\"display:none;margin-top:12px;\">\n    <div class=\"login-field\">\n      <label for=\"teacherEmail\">E-mail professeur</label>\n      <input id=\"teacherEmail\" type=\"email\" autocomplete=\"username\" placeholder=\"Ton adresse e-mail\">\n    </div>\n    <div class=\"login-field\">\n      <label for=\"teacherPassword\">Mot de passe</label>\n      <input id=\"teacherPassword\" type=\"password\" autocomplete=\"current-password\" placeholder=\"Ton mot de passe Supabase\">\n    </div>\n    <button class=\"login-submit\" id=\"teacherLoginBtn\" type=\"button\">Connexion professeur</button>\n    <div class=\"login-error\" id=\"teacherLoginError\"></div>\n  </div>\n</div>\n\n      \n    </div>\n  </div>\n</div>\n\n\n\n\n\n\n<div class=\"student-admin-panel\" id=\"studentAdminPanel\">\n  <div class=\"student-admin-card\">\n    <div class=\"student-admin-head\">\n      <h2>Gérer les comptes élèves</h2>\n      <button class=\"student-admin-close\" id=\"studentAdminClose\" type=\"button\">×</button>\n    </div>\n\n    <div class=\"student-admin-form\">\n      <input id=\"newStudentLast\" placeholder=\"Nom\">\n      <input id=\"newStudentFirst\" placeholder=\"Prénom\">\n      <input id=\"newStudentClass\" placeholder=\"Classe\">\n      <select id=\"newStudentGender\">\n        <option value=\"girl\">Fille</option>\n        <option value=\"boy\">Garçon</option>\n      </select>\n      <button class=\"student-admin-add\" id=\"addStudentBtn\" type=\"button\">+ Créer</button>\n    </div>\n\n    \n<div class=\"avatar-picker-wrap\">\n  <div class=\"avatar-picker-title\">Choisir l’avatar</div>\n  <div class=\"avatar-picker\" id=\"studentAvatarPicker\"></div>\n  <input type=\"hidden\" id=\"newStudentAvatarKey\">\n</div>\n\n<div id=\"studentCreateStatus\" style=\"margin:10px 0;font-weight:800;color:#173a61;\"></div>\n    <div class=\"students-list\" id=\"studentsList\"></div>\n  </div>\n</div>\n\n\n<script>\nwindow.FLASH_AVATARS = {\"girl_01\": \"c3567490d55d1d53.png\", \"girl_02\": \"d55f1f92ee9dff56.png\", \"girl_03\": \"d244de663405fe5a.png\", \"girl_04\": \"cd649548551743da.png\", \"girl_05\": \"9c9e09378c0725e8.png\", \"girl_06\": \"284158b7aa5df71d.png\", \"girl_07\": \"8eca35f5a2406cc9.png\", \"girl_08\": \"feb7b2b6a743caa7.png\", \"boy_01\": \"8ae982b9c4d59b5b.png\", \"boy_02\": \"ee65d8b0b1f33c25.png\", \"boy_03\": \"6c5c7cbb96f330b5.png\", \"boy_04\": \"394695b1255bef7e.png\"};\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  const STUDENTS_KEY='mathspace_students_v1';\n  const SESSION_KEY='mathspace_student_session_v1';\n  const INITIAL_CODE='Waimes1';\n\n  const BOY_AVATARS=['boy_blue','boy_green','boy_red','boy_orange'];\n  const GIRL_AVATARS=['girl_purple','girl_yellow'];\n\n  function getStudents(){\n    try{\n      const raw=localStorage.getItem(STUDENTS_KEY);\n      if(raw){\n        const data=JSON.parse(raw);\n        if(Array.isArray(data)) return data;\n      }\n    }catch(e){}\n    return [];\n  }\n  function setStudents(data){\n    try{localStorage.setItem(STUDENTS_KEY,JSON.stringify(data));}catch(e){}\n  }\n  function normalizePart(value){\n    return (value||'')\n      .normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')\n      .replace(/[^a-zA-Z0-9]/g,'');\n  }\n  function makeLogin(last,first){\n    const l=normalizePart(last);\n    const f=normalizePart(first);\n    return l.charAt(0).toUpperCase()+l.slice(1)+f.charAt(0).toUpperCase()+f.slice(1);\n  }\n  function pickAvatar(gender){\n    const pool=gender==='boy'?BOY_AVATARS:GIRL_AVATARS;\n    return pool[Math.floor(Math.random()*pool.length)];\n  }\n  function getSession(){\n    try{\n      const raw=sessionStorage.getItem(SESSION_KEY);\n      return raw?JSON.parse(raw):null;\n    }catch(e){return null;}\n  }\n  function setSession(student){\n    try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(student));}catch(e){}\n  }\n  function clearSession(){\n    try{sessionStorage.removeItem(SESSION_KEY);}catch(e){}\n  }\n\n  function findStudentBlock(){\n    return document.querySelector('.student-box,.student-card,.profile-card,.sidebar-student');\n  }\n\n  function renderLoggedStudent(student){\n    const block=findStudentBlock();\n    if(!block) return;\n\n    let badge=block.querySelector('.student-session-badge');\n    if(!badge){\n      badge=document.createElement('div');\n      badge.className='student-session-badge';\n      block.appendChild(badge);\n    }\n    badge.innerHTML='';\n\n    const img=document.createElement('img');\n    img.src=FLASH_AVATARS[student.avatar]||'';\n\n    const text=document.createElement('div');\n    const name=document.createElement('div');\n    name.className='student-session-name';\n    name.textContent=student.first+' '+student.last;\n    const cls=document.createElement('div');\n    cls.className='student-row-small';\n    cls.textContent=student.className||'';\n    text.append(name,cls);\n\n    const logout=document.createElement('button');\n    logout.className='student-logout';\n    logout.type='button';\n    logout.textContent='Déconnexion';\n    logout.onclick=()=>{\n      clearSession();\n      document.getElementById('studentLoginScreen')?.classList.remove('hidden');\n      badge.remove();\n    };\n\n    badge.append(img,text,logout);\n  }\n\n  function showAppForStudent(student){\n    setSession(student);\n    document.getElementById('studentLoginScreen')?.classList.add('hidden');\n    renderLoggedStudent(student);\n  }\n\n  function login(){\n    const id=(document.getElementById('studentLoginId')?.value||'').trim();\n    const code=(document.getElementById('studentLoginCode')?.value||'').trim();\n    const error=document.getElementById('studentLoginError');\n\n    const student=getStudents().find(s=>s.login.toLowerCase()===id.toLowerCase() && s.active!==false);\n    if(!student || student.code!==code){\n      if(error) error.textContent='Identifiant ou code incorrect.';\n      return;\n    }\n    if(error) error.textContent='';\n    showAppForStudent(student);\n  }\n\n  document.getElementById('studentLoginBtn')?.addEventListener('click',login);\n  document.getElementById('studentLoginCode')?.addEventListener('keydown',e=>{\n    if(e.key==='Enter') login();\n  });\n\n  // Temporary teacher access until Supabase Auth is connected\n  document.getElementById('tempTeacherAccess')?.addEventListener('click',()=>{\n    document.getElementById('studentLoginScreen')?.classList.add('hidden');\n    document.body.classList.add('home-teacher-mode');\n    const b=document.getElementById('homeProfToggle');\n    if(b) b.textContent='Mode élève';\n  });\n\n  function renderStudents(){\n    const host=document.getElementById('studentsList');\n    if(!host) return;\n    const students=getStudents();\n    host.innerHTML='';\n\n    if(!students.length){\n      const empty=document.createElement('div');\n      empty.className='student-row-small';\n      empty.textContent='Aucun compte élève créé.';\n      host.appendChild(empty);\n      return;\n    }\n\n    students.forEach((s,index)=>{\n      const row=document.createElement('div');\n      row.className='student-row';\n\n      const img=document.createElement('img');\n      img.src=FLASH_AVATARS[s.avatar]||'';\n\n      const ident=document.createElement('div');\n      ident.innerHTML='<div class=\"student-row-id\"></div><div class=\"student-row-small\"></div>';\n      ident.querySelector('.student-row-id').textContent=s.login;\n      ident.querySelector('.student-row-small').textContent=s.first+' '+s.last;\n\n      const cls=document.createElement('div');\n      cls.textContent=s.className||'—';\n\n      const code=document.createElement('div');\n      code.innerHTML='<div class=\"student-row-small\">Code initial</div><strong>'+INITIAL_CODE+'</strong>';\n\n      const gender=document.createElement('div');\n      gender.className='student-row-small';\n      gender.textContent=s.gender==='boy'?'Garçon':'Fille';\n\n      const del=document.createElement('button');\n      del.type='button';\n      del.textContent='Supprimer';\n      del.onclick=()=>{\n        if(!confirm('Supprimer le compte de '+s.first+' '+s.last+' ?')) return;\n        const data=getStudents();\n        data.splice(index,1);\n        setStudents(data);\n        renderStudents();\n      };\n\n      row.append(img,ident,cls,code,gender,del);\n      host.appendChild(row);\n    });\n  }\n\n  document.getElementById('manageStudentsBtn')?.addEventListener('click',()=>{\n    renderStudents();\n    document.getElementById('studentAdminPanel')?.classList.add('open');\n  });\n  document.getElementById('studentAdminClose')?.addEventListener('click',()=>{\n    document.getElementById('studentAdminPanel')?.classList.remove('open');\n  });\n  document.getElementById('studentAdminPanel')?.addEventListener('click',e=>{\n    if(e.target.id==='studentAdminPanel') e.currentTarget.classList.remove('open');\n  });\n\n  document.getElementById('addStudentBtn')?.addEventListener('click',()=>{\n    const last=(document.getElementById('newStudentLast')?.value||'').trim();\n    const first=(document.getElementById('newStudentFirst')?.value||'').trim();\n    const className=(document.getElementById('newStudentClass')?.value||'').trim();\n    const gender=document.getElementById('newStudentGender')?.value||'girl';\n\n    if(!last || !first){\n      alert('Indique le nom et le prénom.');\n      return;\n    }\n\n    const login=makeLogin(last,first);\n    const data=getStudents();\n\n    if(data.some(s=>s.login.toLowerCase()===login.toLowerCase())){\n      alert('Cet identifiant existe déjà : '+login);\n      return;\n    }\n\n    data.push({\n      id:'student_'+Date.now(),\n      last,first,className,gender,\n      login,\n      code:INITIAL_CODE,\n      avatar:pickAvatar(gender),\n      active:true\n    });\n    setStudents(data);\n\n    document.getElementById('newStudentLast').value='';\n    document.getElementById('newStudentFirst').value='';\n    document.getElementById('newStudentClass').value='';\n    renderStudents();\n  });\n\n  const session=getSession();\n  if(session){\n    const stillExists=getStudents().find(s=>s.id===session.id && s.active!==false);\n    if(stillExists) showAppForStudent(stillExists);\n  }\n});\n<\\/script>\n\n\n<script type=\"module\">\nimport { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';\n\nconst supabase = createClient(\"https://fhsqypzaavllffggxhby.supabase.co\", \"sb_publishable_9hNuHKNf94hOm0lHKOaUag_CE1HLcDv\");\nwindow.mathSupabase = supabase;\n\nconst LOGIN_SCREEN = document.getElementById('studentLoginScreen');\nconst STUDENT_ERROR = document.getElementById('studentLoginError');\nconst TEACHER_ERROR = document.getElementById('teacherLoginError');\n\nfunction cleanLoginPart(value) {\n  return (value || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();\n}\nfunction studentAuthEmail(login) { return cleanLoginPart(login) + '@eleve.ecole.local'; }\n\nasync function getMyProfile(userId) {\n  const { data, error } = await supabase.from('math_profiles').select('*').eq('id', userId).single();\n  if (error) throw error;\n  return data;\n}\n\nfunction findStudentBlock() {\n  return document.querySelector('.student-box,.student-card,.profile-card,.sidebar-student');\n}\n\nfunction renderSessionProfile(profile) {\n  const card = document.getElementById('mathSessionCard');\n  if (!card) return;\n\n  const isTeacherRole = profile?.role === 'teacher';\n  document.body.classList.toggle('role-home-teacher', isTeacherRole);\n  document.body.classList.toggle('role-home-student', !isTeacherRole);\n\n  card.innerHTML = '';\n\n  if (profile.role === 'student' && profile.avatar_key) {\n    const img = document.createElement('img');\n    img.className = 'math-session-avatar';\n    img.alt = 'Avatar de ' + (profile.first_name || '');\n    img.src = (window.FLASH_AVATARS && window.FLASH_AVATARS[profile.avatar_key]) || '';\n    card.appendChild(img);\n  } else {\n    const roleIcon = document.createElement('div');\n    roleIcon.className = 'math-session-role-icon';\n    roleIcon.textContent = '👩‍🏫';\n    card.appendChild(roleIcon);\n  }\n\n  const name = document.createElement('div');\n  name.className = 'math-session-name';\n  name.textContent = [profile.first_name, profile.last_name].filter(Boolean).join(' ');\n  card.appendChild(name);\n\n  const info = document.createElement('div');\n  info.className = 'math-session-class';\n  info.textContent = profile.role === 'teacher'\n    ? 'Professeur'\n    : (profile.class_name ? 'Classe ' + profile.class_name : 'Élève');\n  card.appendChild(info);\n\n  const quizTrackingBtn = document.getElementById('homeTeacherQuizTrackingBtn');\n  if(quizTrackingBtn){\n    quizTrackingBtn.style.display = profile.role === 'teacher' ? '' : 'none';\n  }\n\n  const logout = document.createElement('button');\n  logout.className = 'math-session-logout';\n  logout.type = 'button';\n  logout.textContent = 'Déconnexion';\n  logout.setAttribute('aria-label', 'Déconnexion');\n  logout.addEventListener('click', async () => {\n    logout.disabled = true;\n    logout.textContent = '...';\n    try { await supabase.auth.signOut(); } catch (e) { console.error(e); }\n    window.currentMathProfile = null;\n    document.body.classList.remove('role-home-teacher','role-home-student');\n    window.location.reload();\n  });\n  card.appendChild(logout);\n}\n\nasync function loadChapterVisibility(profile) {\n  const { data, error } = await supabase.from('math_chapter_visibility').select('chapter_number,visible').order('chapter_number');\n  if (error) { console.error(error); return; }\n  const visibility = {};\n  (data || []).forEach(r => visibility[String(r.chapter_number)] = r.visible);\n  try { localStorage.setItem('mathspace_chapter_visibility_v1', JSON.stringify(visibility)); } catch(e) {}\n  document.querySelectorAll('.chapter-card').forEach(card => {\n    const n = String(card.dataset.chapter || '');\n    card.classList.toggle('chapter-hidden', visibility[n] === false);\n  });\n  const isTeacher = profile.role === 'teacher';\n  document.body.classList.toggle('home-teacher-mode', isTeacher);\n  ['homeProfToggle'].forEach(id => { const el=document.getElementById(id); if(el) el.style.display='none'; });\n  const manageChapters = document.getElementById('manageChaptersBtn');\n  if (manageChapters) manageChapters.style.display = isTeacher ? '' : 'none';\n  const manageStudents = document.getElementById('manageStudentsBtn');\n  if (manageStudents) manageStudents.style.display = isTeacher ? '' : 'none';\n}\n\n\nfunction applyTeacherUi(profile) {\n  const manageStudents = document.getElementById('manageStudentsBtn');\n  const manageChapters = document.getElementById('manageChaptersBtn');\n  const localMode = document.getElementById('homeProfToggle');\n\n  const isTeacher = !!profile && profile.role === 'teacher' && profile.active !== false;\n\n  document.body.classList.toggle('role-home-teacher', isTeacher);\n  document.body.classList.toggle('role-home-student', !isTeacher);\n\n  if (manageStudents) manageStudents.style.display = isTeacher ? '' : 'none';\n  if (manageChapters) manageChapters.style.display = isTeacher ? '' : 'none';\n  if (localMode) localMode.style.display = 'none';\n\n  document.body.classList.toggle('home-teacher-mode', isTeacher);\n}\n\nasync function applySession(session) {\n  if (!session?.user) { LOGIN_SCREEN?.classList.remove('hidden'); return; }\n  try {\n    const profile = await getMyProfile(session.user.id);\n    if (!profile.active) throw new Error('inactive');\n    window.currentMathProfile = profile;\n    applyTeacherUi(profile);\n    if (profile.role === 'teacher') {\n      const msBtn = document.getElementById('manageStudentsBtn');\n      if (msBtn) msBtn.style.display = '';\n    }\n    LOGIN_SCREEN?.classList.add('hidden');\n    renderSessionProfile(profile);\n    await loadChapterVisibility(profile);\n  } catch (err) {\n    console.error(err);\n    await supabase.auth.signOut();\n    LOGIN_SCREEN?.classList.remove('hidden');\n    if (STUDENT_ERROR) STUDENT_ERROR.textContent = 'Profil introuvable ou désactivé.';\n  }\n}\n\nasync function studentLoginReal() {\n  const login=(document.getElementById('studentLoginId')?.value||'').trim();\n  const password=(document.getElementById('studentLoginCode')?.value||'').trim();\n  if (!login || !password) { if(STUDENT_ERROR) STUDENT_ERROR.textContent='Entre ton identifiant et ton code.'; return; }\n  if (STUDENT_ERROR) STUDENT_ERROR.textContent='';\n  const { data, error } = await supabase.auth.signInWithPassword({ email: studentAuthEmail(login), password });\n  if (error) { if(STUDENT_ERROR) STUDENT_ERROR.textContent='Identifiant ou code incorrect.'; return; }\n  try {\n    const profile = await getMyProfile(data.user.id);\n    if (profile.role !== 'student') throw new Error('not-student');\n    await applySession(data.session);\n  } catch(e) {\n    await supabase.auth.signOut();\n    if(STUDENT_ERROR) STUDENT_ERROR.textContent='Ce compte n’est pas un compte élève.';\n  }\n}\n\nasync function teacherLoginReal() {\n  const email=(document.getElementById('teacherEmail')?.value||'').trim();\n  const password=(document.getElementById('teacherPassword')?.value||'').trim();\n  if (!email || !password) { if(TEACHER_ERROR) TEACHER_ERROR.textContent='Entre ton e-mail et ton mot de passe.'; return; }\n  if (TEACHER_ERROR) TEACHER_ERROR.textContent='';\n  const { data, error } = await supabase.auth.signInWithPassword({ email, password });\n  if (error) { console.error('Erreur Supabase connexion professeur :', error); if(TEACHER_ERROR) TEACHER_ERROR.textContent='Erreur Supabase : ' + (error.message || 'Connexion impossible'); return; }\n  try {\n    const profile = await getMyProfile(data.user.id);\n    if (profile.role !== 'teacher') throw new Error('not-teacher');\n    await applySession(data.session);\n  } catch(e) {\n    await supabase.auth.signOut();\n    if(TEACHER_ERROR) TEACHER_ERROR.textContent='Ce compte n’a pas le rôle professeur.';\n  }\n}\n\n// Real auth overrides the old local handlers.\ndocument.getElementById('studentLoginBtn')?.addEventListener('click', e => { e.preventDefault(); e.stopImmediatePropagation(); studentLoginReal(); }, true);\ndocument.getElementById('studentLoginCode')?.addEventListener('keydown', e => { if(e.key==='Enter') { e.preventDefault(); e.stopImmediatePropagation(); studentLoginReal(); } }, true);\ndocument.getElementById('showTeacherLogin')?.addEventListener('click', () => { const b=document.getElementById('teacherLoginBox'); if(b) b.style.display = b.style.display==='none' ? 'block' : 'none'; });\ndocument.getElementById('teacherLoginBtn')?.addEventListener('click', teacherLoginReal);\n\n// Save chapter visibility to Supabase when teacher changes it.\ndocument.getElementById('chapterVisibilityList')?.addEventListener('change', async e => {\n  const profile=window.currentMathProfile;\n  if (!profile || profile.role!=='teacher') return;\n  if (!(e.target instanceof HTMLInputElement) || e.target.type!=='checkbox') return;\n  const row=e.target.closest('.chapter-vis-row');\n  const txt=row?.querySelector('.chapter-vis-num')?.textContent || '';\n  const mm=txt.match(/(\\d+)/); if(!mm) return;\n  const chapterNumber=Number(mm[1]);\n  const { error } = await supabase.from('math_chapter_visibility').update({visible:e.target.checked,updated_at:new Date().toISOString()}).eq('chapter_number',chapterNumber);\n  if(error) { console.error(error); alert('La visibilité n’a pas pu être enregistrée dans Supabase.'); }\n}, true);\n\nconst localModeBtn=document.getElementById('homeProfToggle'); if(localModeBtn) localModeBtn.style.display='none';\nconst localStudentsBtn=document.getElementById('manageStudentsBtn'); if(localStudentsBtn) localStudentsBtn.style.display='none';\n\n\n// ------------------------------------------------------------\n// Gestion réelle des élèves via Supabase Edge Function\n// ------------------------------------------------------------\nasync function loadStudentsFromSupabase() {\n  const host = document.getElementById('studentsList');\n  if (!host) return;\n\n  host.innerHTML = '<div class=\"student-row-small\">Chargement…</div>';\n\n  const { data, error } = await supabase\n    .from('math_profiles')\n    .select('id, login, first_name, last_name, class_name, gender, avatar_key, active')\n    .eq('role', 'student')\n    .order('class_name', { ascending: true })\n    .order('last_name', { ascending: true })\n    .order('first_name', { ascending: true });\n\n  if (error) {\n    console.error('Chargement élèves :', error);\n    host.innerHTML = '<div class=\"student-row-small\">Impossible de charger les élèves.</div>';\n    return;\n  }\n\n  host.innerHTML = '';\n\n  if (!data || data.length === 0) {\n    const empty = document.createElement('div');\n    empty.className = 'student-row-small';\n    empty.textContent = 'Aucun compte élève créé.';\n    host.appendChild(empty);\n    return;\n  }\n\n  for (const student of data) {\n    const row = document.createElement('div');\n    row.className = 'student-row';\n\n    const img = document.createElement('img');\n    if (window.FLASH_AVATARS && student.avatar_key) {\n      img.src = window.FLASH_AVATARS[student.avatar_key] || '';\n    }\n\n    const ident = document.createElement('div');\n\n    const login = document.createElement('div');\n    login.className = 'student-row-id';\n    login.textContent = student.login || '';\n\n    const full = document.createElement('div');\n    full.className = 'student-row-small';\n    full.textContent = `${student.first_name || ''} ${student.last_name || ''}`.trim();\n\n    ident.append(login, full);\n\n    const cls = document.createElement('div');\n    cls.textContent = student.class_name || '—';\n\n    const code = document.createElement('div');\n    code.innerHTML = '<div class=\"student-row-small\">Code initial</div><strong>Waimes1</strong>';\n\n    const gender = document.createElement('div');\n    gender.className = 'student-row-small';\n    gender.textContent = student.gender === 'boy' ? 'Garçon' : 'Fille';\n\n    const actions = document.createElement('div');\n    actions.style.display = 'flex';\n    actions.style.gap = '7px';\n    actions.style.flexWrap = 'wrap';\n    actions.style.justifyContent = 'flex-end';\n\n    const status = document.createElement('button');\n    status.type = 'button';\n    status.textContent = student.active === false ? 'Réactiver' : 'Désactiver';\n    status.style.background = '#edf5ff';\n    status.style.color = '#24527f';\n\n    status.onclick = async () => {\n      const next = student.active === false;\n\n      const { error: updateError } = await supabase\n        .from('math_profiles')\n        .update({ active: next })\n        .eq('id', student.id);\n\n      if (updateError) {\n        alert('Impossible de modifier le compte : ' + updateError.message);\n        return;\n      }\n\n      await loadStudentsFromSupabase();\n    };\n\n    const del = document.createElement('button');\n    del.type = 'button';\n    del.textContent = 'Supprimer';\n    del.style.background = '#ffe5ea';\n    del.style.color = '#a42f43';\n\n    del.onclick = async () => {\n      const fullName = [student.first_name, student.last_name]\n        .filter(Boolean).join(' ') || student.login || 'cet élève';\n\n      const confirmed = confirm(\n        'Supprimer définitivement le compte de ' + fullName + '?\\n\\n' +\n        'Ses résultats et son compte de connexion seront supprimés. Cette action est irréversible.'\n      );\n      if (!confirmed) return;\n\n      const profile = window.currentMathProfile;\n      if (!profile || profile.role !== 'teacher') {\n        alert('Connexion professeur requise.');\n        return;\n      }\n\n      status.disabled = true;\n      del.disabled = true;\n      del.textContent = 'Suppression…';\n\n      try {\n        const { data, error } = await supabase.functions.invoke('delete-math-student', {\n          body: { student_id: student.id }\n        });\n\n        if (error) {\n          let detail = error.message || 'Erreur Edge Function.';\n          const statusCode = error.context?.status || error.context?.statusCode || null;\n          if (statusCode) detail += ' (HTTP ' + statusCode + ')';\n          throw new Error(detail);\n        }\n\n        if (!data || data.ok !== true) {\n          throw new Error(\n            data?.error || data?.detail ||\n            'La fonction delete-math-student n’a pas confirmé la suppression.'\n          );\n        }\n\n        alert('Élève supprimé définitivement.');\n        await loadStudentsFromSupabase();\n      } catch (err) {\n        console.error('Suppression élève :', err);\n        const msg = err?.message || String(err);\n        alert(\n          'Suppression impossible.\\n\\n' + msg +\n          '\\n\\nVérifie que l’Edge Function \"delete-math-student\" est bien déployée dans CE projet Supabase.'\n        );\n        status.disabled = false;\n        del.disabled = false;\n        del.textContent = 'Supprimer';\n      }\n    };\n\n    actions.append(status, del);\n    row.append(img, ident, cls, code, gender, actions);\n    host.appendChild(row);\n  }\n}\n\n// Ouvre la gestion Supabase des élèves uniquement pour le professeur.\ndocument.getElementById('manageStudentsBtn')?.addEventListener('click', async (e) => {\n  e.preventDefault();\n  e.stopImmediatePropagation();\n\n  const profile = window.currentMathProfile;\n  if (!profile || profile.role !== 'teacher') return;\n\n  await loadStudentsFromSupabase();\n  document.getElementById('studentAdminPanel')?.classList.add('open');\n}, true);\n\n// Création sécurisée via Edge Function.\ndocument.getElementById('addStudentBtn')?.addEventListener('click', async (e) => {\n  e.preventDefault();\n  e.stopImmediatePropagation();\n\n  const profile = window.currentMathProfile;\n  if (!profile || profile.role !== 'teacher') {\n    alert('Connexion professeur requise.');\n    return;\n  }\n\n  const lastName = (document.getElementById('newStudentLast')?.value || '').trim();\n  const firstName = (document.getElementById('newStudentFirst')?.value || '').trim();\n  const className = (document.getElementById('newStudentClass')?.value || '').trim();\n  const gender = document.getElementById('newStudentGender')?.value || 'girl';\n    const avatarKey = document.getElementById('newStudentAvatarKey')?.value || '';\n\n  if (!lastName || !firstName) {\n    alert('Indique le nom et le prénom.');\n    return;\n  }\n\n  const addBtn = document.getElementById('addStudentBtn');\n  if (addBtn) {\n    addBtn.disabled = true;\n    addBtn.textContent = 'Création…';\n  }\n\n  try {\n    const { data, error } = await supabase.functions.invoke('create-math-student', {\n      body: {\n        last_name: lastName,\n        first_name: firstName,\n        class_name: className,\n        gender: gender\n      }\n    });\n\n    if (error) {\n      throw new Error(error.message || 'Erreur de la fonction Supabase.');\n    }\n\n    if (!data?.ok) {\n      throw new Error(data?.error || 'Création impossible.');\n    }\n\n    document.getElementById('newStudentLast').value = '';\n    document.getElementById('newStudentFirst').value = '';\n    document.getElementById('newStudentClass').value = '';\n\n    await loadStudentsFromSupabase();\n\n    alert(\n      'Compte créé !\\n\\n' +\n      'Identifiant : ' + data.student.login + '\\n' +\n      'Code initial : ' + data.student.initial_code\n    );\n  } catch (err) {\n    console.error('Création élève :', err);\n    alert('Impossible de créer le compte élève : ' + (err?.message || String(err)));\n  } finally {\n    if (addBtn) {\n      addBtn.disabled = false;\n      addBtn.textContent = '+ Créer';\n    }\n  }\n}, true);\n\n\n\n// Bouton + Créer : branchement explicite et visible\nconst createStudentButton = document.getElementById('addStudentBtn');\n\nif (createStudentButton) {\n  createStudentButton.onclick = null;\n\n  createStudentButton.addEventListener('click', async (event) => {\n    event.preventDefault();\n    event.stopImmediatePropagation();\n\n    const status = document.getElementById('studentCreateStatus');\n    const profile = window.currentMathProfile;\n\n    if (!profile || profile.role !== 'teacher') {\n      if (status) {\n        status.style.color = '#b44755';\n        status.textContent = 'Connexion professeur requise.';\n      }\n      return;\n    }\n\n    const lastName = (document.getElementById('newStudentLast')?.value || '').trim();\n    const firstName = (document.getElementById('newStudentFirst')?.value || '').trim();\n    const className = (document.getElementById('newStudentClass')?.value || '').trim();\n    const gender = document.getElementById('newStudentGender')?.value || 'girl';\n\n    if (!lastName || !firstName) {\n      if (status) {\n        status.style.color = '#b44755';\n        status.textContent = 'Indique le nom et le prénom.';\n      }\n      return;\n    }\n\n    createStudentButton.disabled = true;\n    createStudentButton.textContent = 'Création…';\n\n    if (status) {\n      status.style.color = '#173a61';\n      status.textContent = 'Création du compte dans Supabase…';\n    }\n\n    try {\n      const result = await supabase.functions.invoke('create-math-student', {\n        body: {\n          last_name: lastName,\n          first_name: firstName,\n          class_name: className,\n          gender: gender\n        }\n      });\n\n      if (result.error) {\n        throw new Error(result.error.message || 'Erreur Edge Function.');\n      }\n\n      if (!result.data || result.data.ok !== true) {\n        throw new Error(result.data?.error || 'La fonction n’a pas confirmé la création.');\n      }\n\n      const student = result.data.student;\n\n      document.getElementById('newStudentLast').value = '';\n      document.getElementById('newStudentFirst').value = '';\n      document.getElementById('newStudentClass').value = '';\n\n      if (typeof loadStudentsFromSupabase === 'function') {\n        await loadStudentsFromSupabase();\n      }\n\n      if (status) {\n        status.style.color = '#176b46';\n        status.textContent =\n          'Compte créé : ' + student.login + ' — code initial : ' + student.initial_code;\n      }\n    } catch (error) {\n      console.error('Erreur création élève :', error);\n      if (status) {\n        status.style.color = '#b44755';\n        status.textContent = 'Erreur : ' + (error?.message || String(error));\n      }\n    } finally {\n      createStudentButton.disabled = false;\n      createStudentButton.textContent = '+ Créer';\n    }\n  }, true);\n}\n\n\n\n// Choix visuel de l'avatar\nconst STUDENT_AVATAR_POOLS = {\n  girl: [\"girl_01\", \"girl_02\", \"girl_03\", \"girl_04\", \"girl_05\", \"girl_06\", \"girl_07\", \"girl_08\"],\n  boy: [\"boy_01\", \"boy_02\", \"boy_03\", \"boy_04\"]\n};\n\nfunction renderStudentAvatarPicker(){\n  const picker = document.getElementById('studentAvatarPicker');\n  const genderSelect = document.getElementById('newStudentGender');\n  const hidden = document.getElementById('newStudentAvatarKey');\n  if(!picker || !genderSelect || !hidden) return;\n\n  const gender = genderSelect.value || 'girl';\n  const pool = STUDENT_AVATAR_POOLS[gender] || [];\n  picker.innerHTML = '';\n\n  if(!pool.includes(hidden.value)){\n    hidden.value = pool[0] || '';\n  }\n\n  pool.forEach(key => {\n    const btn = document.createElement('button');\n    btn.type = 'button';\n    btn.className = 'avatar-choice' + (hidden.value === key ? ' selected' : '');\n    btn.dataset.avatarKey = key;\n\n    const img = document.createElement('img');\n    img.src = window.FLASH_AVATARS?.[key] || '';\n    img.alt = 'Avatar';\n\n    btn.appendChild(img);\n    btn.addEventListener('click', () => {\n      hidden.value = key;\n      picker.querySelectorAll('.avatar-choice').forEach(x => x.classList.remove('selected'));\n      btn.classList.add('selected');\n    });\n\n    picker.appendChild(btn);\n  });\n}\n\ndocument.getElementById('newStudentGender')?.addEventListener('change', renderStudentAvatarPicker);\nsetTimeout(renderStudentAvatarPicker, 0);\n\n\n// Diagnostic détaillé création élève par fetch direct\nconst directCreateBtn = document.getElementById('addStudentBtn');\nif (directCreateBtn) {\n  directCreateBtn.addEventListener('click', async (event) => {\n    event.preventDefault();\n    event.stopImmediatePropagation();\n\n    const status = document.getElementById('studentCreateStatus');\n    const profile = window.currentMathProfile;\n\n    if (!profile || profile.role !== 'teacher') {\n      if (status) {\n        status.style.color = '#b44755';\n        status.textContent = 'Connexion professeur
