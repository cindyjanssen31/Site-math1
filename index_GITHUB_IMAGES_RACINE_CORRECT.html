   ('HTTP ' + response.status);\n\n        throw new Error(\n          'HTTP ' + response.status + ' — ' + detail +\n          (payload?.detail && payload?.error ? ' — ' + payload.detail : '')\n        );\n      }\n\n      if (!payload?.ok) {\n        throw new Error(payload?.error || 'La fonction n’a pas confirmé la création.');\n      }\n\n      document.getElementById('newStudentLast').value = '';\n      document.getElementById('newStudentFirst').value = '';\n      document.getElementById('newStudentClass').value = '';\n\n      if (typeof loadStudentsFromSupabase === 'function') {\n        await loadStudentsFromSupabase();\n      }\n\n      if (status) {\n        status.style.color = '#176b46';\n        status.textContent =\n          'Compte créé : ' + payload.student.login +\n          ' — code initial : ' + payload.student.initial_code;\n      }\n    } catch (error) {\n      console.error('Diagnostic création élève :', error);\n      if (status) {\n        status.style.color = '#b44755';\n        status.textContent = 'Erreur : ' + (error?.message || String(error));\n      }\n    } finally {\n      directCreateBtn.disabled = false;\n      directCreateBtn.textContent = '+ Créer';\n    }\n  }, true);\n}\n\n\n\n\nconst { data: sessionData } = await supabase.auth.getSession();\nawait applySession(sessionData.session);\nsupabase.auth.onAuthStateChange(async (_event, session) => { await applySession(session); });\n<\\/script>\n\n\n<div class=\"home-quiz-track-modal\" id=\"homeQuizTrackModal\">\n  <div class=\"home-quiz-track-card\">\n    <div class=\"home-quiz-track-head\">\n      <h2>Suivi des quiz</h2>\n      <button class=\"home-quiz-track-close\" id=\"homeQuizTrackClose\" type=\"button\">Fermer</button>\n    </div>\n\n    <div class=\"home-quiz-tabs\">\n      <button class=\"home-quiz-tab active\" id=\"homeQuizOverviewTab\" type=\"button\">Par classe / chapitre</button>\n      <button class=\"home-quiz-tab\" id=\"homeQuizStudentTab\" type=\"button\">Par élève</button>\n    </div>\n\n    <div class=\"home-quiz-view active\" id=\"homeQuizOverviewView\">\n      <div class=\"home-quiz-filters\">\n        <div class=\"home-quiz-filter\">\n          <label for=\"homeQuizClassFilter\">Classe</label>\n          <select id=\"homeQuizClassFilter\"><option value=\"\">Toutes les classes</option></select>\n        </div>\n        <div class=\"home-quiz-filter\">\n          <label for=\"homeQuizChapterFilter\">Chapitre</label>\n          <select id=\"homeQuizChapterFilter\"></select>\n        </div>\n      </div>\n\n      <div class=\"home-quiz-summary\" id=\"homeQuizSummary\"></div>\n\n      <div class=\"home-quiz-table-wrap\">\n        <table class=\"home-quiz-table\">\n          <thead>\n            <tr>\n              <th>Élève</th>\n              <th>Classe</th>\n              <th>Dernier résultat</th>\n              <th>Meilleur résultat</th>\n              <th>Tentatives</th>\n              <th>Statut</th>\n            </tr>\n          </thead>\n          <tbody id=\"homeQuizTableBody\">\n            <tr><td colspan=\"6\" class=\"home-quiz-empty\">Chargement…</td></tr>\n          </tbody>\n        </table>\n      </div>\n    </div>\n\n    <div class=\"home-quiz-view\" id=\"homeQuizStudentView\">\n      <div class=\"home-quiz-student-select\">\n        <label for=\"homeQuizStudentFilter\">Élève</label>\n        <select id=\"homeQuizStudentFilter\">\n          <option value=\"\">Choisir un élève</option>\n        </select>\n      </div>\n      <div class=\"home-quiz-student-grid\" id=\"homeQuizStudentGrid\">\n        <div class=\"home-quiz-empty\">Choisis un élève pour afficher tous ses quiz.</div>\n      </div>\n    </div>\n  </div>\n</div>\n\n\n<script>\n/* ===== SUIVI DES QUIZ PROFESSEUR — LOGIQUE ACCUEIL ===== */\n(function(){\n  const chapterNames = [\n    '',\n    'La numération','Repérage de nombres','Les figures élémentaires','Opérations dans ℕ',\n    'Les puissances','Les angles','Opérations dans ℤ','Axe et centre de symétrie',\n    'Les rationnels','Pourcentages','Les triangles','Le repérage','Les quadrilatères',\n    'Calcul algébrique','Les polygones','Les équations','Les transformations du plan',\n    'Proportionnalité','Les statistiques'\n  ];\n\n  let students = [];\n  let quizzes = [];\n  let attempts = [];\n\n  const $ = id => document.getElementById(id);\n\n  function isTeacher(){\n    return String(window.currentMathProfile?.role || '').toLowerCase() === 'teacher';\n  }\n\n  function score(v){\n    const n = Number(v);\n    return Number.isFinite(n) ? n.toFixed(1).replace('.0','') + '/20' : '—';\n  }\n\n  function date(v){\n    if(!v) return '—';\n    return new Date(v).toLocaleString('fr-BE',{\n      day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'\n    });\n  }\n\n  function status(kind,label){\n    return '<span class=\"home-quiz-status '+kind+'\">'+label+'</span>';\n  }\n\n  function fillChapterFilter(){\n    const sel = $('homeQuizChapterFilter');\n    if(!sel || sel.options.length) return;\n    for(let i=1;i<=19;i++){\n      const opt = document.createElement('option');\n      opt.value = String(i);\n      opt.textContent = 'Chapitre ' + i + ' — ' + chapterNames[i];\n      sel.appendChild(opt);\n    }\n    sel.value='1';\n  }\n\n  function fillClassFilter(){\n    const sel = $('homeQuizClassFilter');\n    if(!sel) return;\n    const prev=sel.value;\n    const classes=[...new Set(students.map(s=>String(s.class_name||'').trim()).filter(Boolean))]\n      .sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));\n    sel.innerHTML='<option value=\"\">Toutes les classes</option>';\n    classes.forEach(c=>{\n      const o=document.createElement('option');\n      o.value=c;o.textContent=c;sel.appendChild(o);\n    });\n    if(classes.includes(prev)) sel.value=prev;\n  }\n\n  function fillStudentFilter(){\n    const sel=$('homeQuizStudentFilter');\n    if(!sel) return;\n    const prev=sel.value;\n    sel.innerHTML='<option value=\"\">Choisir un élève</option>';\n    students.slice().sort((a,b)=>{\n      const cc=String(a.class_name||'').localeCompare(String(b.class_name||''),'fr',{numeric:true});\n      if(cc!==0) return cc;\n      return [a.last_name,a.first_name].join(' ').localeCompare([b.last_name,b.first_name].join(' '),'fr');\n    }).forEach(s=>{\n      const o=document.createElement('option');\n      o.value=s.id;\n      const name=[s.first_name,s.last_name].filter(Boolean).join(' ')||'Élève';\n      o.textContent=(s.class_name?s.class_name+' — ':'')+name;\n      sel.appendChild(o);\n    });\n    if(students.some(s=>s.id===prev)) sel.value=prev;\n  }\n\n  async function loadData(){\n    if(!isTeacher()) throw new Error('Accès réservé au professeur.');\n    const db=window.mathSupabase;\n    if(!db) throw new Error('Connexion Supabase non disponible.');\n\n    const sRes=await db.from('math_profiles')\n      .select('id,first_name,last_name,class_name,active')\n      .eq('role','student')\n      .order('class_name',{ascending:true})\n      .order('last_name',{ascending:true})\n      .order('first_name',{ascending:true});\n    if(sRes.error) throw sRes.error;\n\n    const qRes=await db.from('math_quizzes')\n      .select('id,title,chapter_number,pass_percentage,active')\n      .eq('active',true)\n      .order('chapter_number',{ascending:true})\n      .order('title',{ascending:true});\n    if(qRes.error) throw qRes.error;\n\n    students=(sRes.data||[]).filter(s=>s.active!==false);\n    quizzes=qRes.data||[];\n\n    if(quizzes.length){\n      const aRes=await db.from('math_quiz_attempts')\n        .select('id,quiz_id,student_id,attempt_number,score_20,percentage,passed,created_at')\n        .in('quiz_id',quizzes.map(q=>q.id))\n        .order('created_at',{ascending:false});\n      if(aRes.error) throw aRes.error;\n      attempts=aRes.data||[];\n    }else{\n      attempts=[];\n    }\n\n    fillClassFilter();\n    fillStudentFilter();\n    renderOverview();\n    renderStudent();\n  }\n\n  function renderOverview(){\n    const tbody=$('homeQuizTableBody');\n    if(!tbody) return;\n\n    const className=$('homeQuizClassFilter')?.value||'';\n    const chapterNo=Number($('homeQuizChapterFilter')?.value||1);\n    const qs=quizzes.filter(q=>Number(q.chapter_number)===chapterNo);\n    const qids=new Set(qs.map(q=>q.id));\n    let ss=students;\n    if(className) ss=ss.filter(s=>String(s.class_name||'')===className);\n\n    const rows=ss.map(s=>{\n      const arr=attempts.filter(a=>a.student_id===s.id&&qids.has(a.quiz_id))\n        .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));\n      const latest=arr[0]||null;\n      const best=arr.length?arr.reduce((m,a)=>Number(a.score_20)>Number(m.score_20)?a:m,arr[0]):null;\n      return {s,arr,latest,best};\n    });\n\n    const sum=$('homeQuizSummary');\n    if(sum){\n      const done=rows.filter(r=>r.arr.length).length;\n      const success=rows.filter(r=>r.latest?.passed===true).length;\n      const work=rows.filter(r=>r.latest&&r.latest.passed!==true).length;\n      sum.innerHTML=`\n        <div class=\"home-quiz-stat\"><strong>${rows.length}</strong><span>élèves</span></div>\n        <div class=\"home-quiz-stat\"><strong>${done}</strong><span>ont fait le quiz</span></div>\n        <div class=\"home-quiz-stat\"><strong>${success}</strong><span>réussis</span></div>\n        <div class=\"home-quiz-stat\"><strong>${work}</strong><span>à retravailler</span></div>`;\n    }\n\n    if(!qs.length){\n      tbody.innerHTML='<tr><td colspan=\"6\" class=\"home-quiz-empty\">Aucun quiz actif pour ce chapitre.</td></tr>';\n      return;\n    }\n    if(!rows.length){\n      tbody.innerHTML='<tr><td colspan=\"6\" class=\"home-quiz-empty\">Aucun élève dans cette classe.</td></tr>';\n      return;\n    }\n\n    tbody.innerHTML='';\n    rows.forEach(r=>{\n      const tr=document.createElement('tr');\n      const name=[r.s.first_name,r.s.last_name].filter(Boolean).join(' ')||'Élève';\n      const st=!r.latest?status('none','Pas encore fait')\n        :r.latest.passed===true?status('success','Réussi')\n        :status('work','À retravailler');\n\n      tr.innerHTML=`\n        <td class=\"home-quiz-student-name\">${name}</td>\n        <td>${r.s.class_name||'—'}</td>\n        <td class=\"home-quiz-score\">${r.latest?score(r.latest.score_20):'—'}</td>\n        <td class=\"home-quiz-score\">${r.best?score(r.best.score_20):'—'}</td>\n        <td>${r.arr.length}</td>\n        <td>${st}</td>`;\n      tbody.appendChild(tr);\n    });\n  }\n\n  function renderStudent(){\n    const host=$('homeQuizStudentGrid');\n    const id=$('homeQuizStudentFilter')?.value||'';\n    if(!host) return;\n    if(!id){\n      host.innerHTML='<div class=\"home-quiz-empty\">Choisis un élève pour afficher tous ses quiz.</div>';\n      return;\n    }\n\n    const student=students.find(s=>s.id===id);\n    if(!student){\n      host.innerHTML='<div class=\"home-quiz-empty\">Élève introuvable.</div>';\n      return;\n    }\n\n    host.innerHTML='';\n    quizzes.slice().sort((a,b)=>Number(a.chapter_number)-Number(b.chapter_number)).forEach(q=>{\n      const arr=attempts.filter(a=>a.student_id===id&&a.quiz_id===q.id)\n        .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));\n      const latest=arr[0]||null;\n      const best=arr.length?arr.reduce((m,a)=>Number(a.score_20)>Number(m.score_20)?a:m,arr[0]):null;\n\n      const card=document.createElement('div');\n      card.className='home-quiz-student-card';\n\n      const st=!latest?status('none','Pas encore fait')\n        :latest.passed===true?status('success','Réussi')\n        :status('work','À retravailler');\n\n      card.innerHTML=`\n        <div class=\"home-quiz-student-card-head\">\n          <div class=\"home-quiz-student-card-title\">\n            Chapitre ${q.chapter_number} — ${chapterNames[Number(q.chapter_number)]||''} · ${q.title||'Quiz'}\n          </div>\n          <div>${st}</div>\n        </div>\n        <div class=\"home-quiz-kpis\">\n          <div class=\"home-quiz-kpi\"><strong>${latest?score(latest.score_20):'—'}</strong><span>Dernier score</span></div>\n          <div class=\"home-quiz-kpi\"><strong>${best?score(best.score_20):'—'}</strong><span>Meilleur score</span></div>\n          <div class=\"home-quiz-kpi\"><strong>${arr.length}</strong><span>Tentatives</span></div>\n          <div class=\"home-quiz-kpi\"><strong>${latest?date(latest.created_at).split(' ')[0]:'—'}</strong><span>Dernier essai</span></div>\n        </div>`;\n\n      if(arr.length){\n        const h=document.createElement('div');\n        h.className='home-quiz-history';\n        arr.forEach(a=>{\n          const r=document.createElement('div');\n          r.className='home-quiz-history-row';\n          r.innerHTML=`\n            <div><div class=\"home-quiz-history-title\">Tentative ${a.attempt_number||'—'}</div>\n            <div class=\"home-quiz-history-meta\">${date(a.created_at)}</div></div>\n            <div class=\"home-quiz-score\">${score(a.score_20)}</div>\n            <div>${a.passed===true?status('success','Réussi'):status('work','À retravailler')}</div>`;\n          h.appendChild(r);\n        });\n        card.appendChild(h);\n      }\n      host.appendChild(card);\n    });\n  }\n\n  function switchView(which){\n    const studentMode=which==='student';\n    $('homeQuizOverviewTab')?.classList.toggle('active',!studentMode);\n    $('homeQuizStudentTab')?.classList.toggle('active',studentMode);\n    $('homeQuizOverviewView')?.classList.toggle('active',!studentMode);\n    $('homeQuizStudentView')?.classList.toggle('active',studentMode);\n    if(studentMode) renderStudent();\n  }\n\n  async function openTracking(){\n    if(!isTeacher()) return;\n    const modal=$('homeQuizTrackModal');\n    modal?.classList.add('open');\n    fillChapterFilter();\n    const tbody=$('homeQuizTableBody');\n    if(tbody) tbody.innerHTML='<tr><td colspan=\"6\" class=\"home-quiz-empty\">Chargement…</td></tr>';\n    try{\n      await loadData();\n    }catch(err){\n      console.error('Suivi quiz accueil :',err);\n      if(tbody){\n        tbody.innerHTML='<tr><td colspan=\"6\" class=\"home-quiz-empty\">Impossible de charger le suivi des quiz.<br><small>'+\n          String(err?.message||err||'Erreur inconnue').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+\n          '</small></td></tr>';\n      }\n    }\n  }\n\n  document.addEventListener('DOMContentLoaded',()=>{\n    fillChapterFilter();\n\n    $('homeTeacherQuizTrackingBtn')?.addEventListener('click',openTracking);\n    $('homeQuizTrackClose')?.addEventListener('click',()=>$('homeQuizTrackModal')?.classList.remove('open'));\n    $('homeQuizOverviewTab')?.addEventListener('click',()=>switchView('overview'));\n    $('homeQuizStudentTab')?.addEventListener('click',()=>switchView('student'));\n    $('homeQuizClassFilter')?.addEventListener('change',renderOverview);\n    $('homeQuizChapterFilter')?.addEventListener('change',renderOverview);\n    $('homeQuizStudentFilter')?.addEventListener('change',renderStudent);\n\n    $('homeQuizTrackModal')?.addEventListener('click',e=>{\n      if(e.target===$('homeQuizTrackModal')) $('homeQuizTrackModal').classList.remove('open');\n    });\n\n    // The session profile may already be available if this script runs after login restoration.\n    const btn=$('homeTeacherQuizTrackingBtn');\n    if(btn){\n      btn.style.display=isTeacher()?'flex':'none';\n    }\n  });\n\n  // Also expose an explicit opener for future use.\n  window.openHomeTeacherQuizTracking=openTracking;\n})();\n<\\/script>\n\n\n<script>\ndocument.addEventListener('DOMContentLoaded',()=>{\n  if(!window.currentMathProfile){\n    document.body.classList.remove('role-home-teacher');\n    document.body.classList.add('role-home-student');\n  }\n});\n<\\/script>\n\n\\n<script>\ndocument.addEventListener('DOMContentLoaded',()=>{\n  const names=[\"La numération\",\"Repérage de nombres\",\"Les figures élémentaires\",\"Opérations dans ℕ\",\"Les puissances\",\"Les angles\",\"Opérations dans ℤ\",\"Axe et centre de symétrie\",\"Les rationnels\",\"Pourcentages\",\"Les triangles\",\"Le repérage\",\"Les quadrilatères\",\"Calcul algébrique\",\"Les polygones\",\"Les équations\",\"Les transformations du plan\",\"Proportionnalité\",\"Les statistiques\"];\n  document.querySelectorAll('.chapter-card').forEach(card=>{\n    const n=Number(card.dataset.chapter||0);\n    if(!n || card.querySelector('.hm-chapter-title')) return;\n    const badge=document.createElement('span'); badge.className='hm-chapter-no'; badge.textContent='Chapitre '+n;\n    const title=document.createElement('span'); title.className='hm-chapter-title'; title.textContent=names[n-1]||'';\n    card.append(badge,title);\n  });\n});\n<\\/script>\n\n\n<script>\n/* ===== MES PROGRÈS — DONNÉES RÉELLES QUIZ ===== */\n(function(){\n  const chapterNames = [\n    '',\n    'La numération','Repérage de nombres','Les figures élémentaires','Opérations dans ℕ',\n    'Les puissances','Les angles','Opérations dans ℤ','Axe et centre de symétrie',\n    'Les rationnels','Pourcentages','Les triangles','Le repérage','Les quadrilatères',\n    'Calcul algébrique','Les polygones','Les équations','Les transformations du plan',\n    'Proportionnalité','Les statistiques'\n  ];\n\n  const $ = id => document.getElementById(id);\n\n  function fmtScore(v){\n    const n = Number(v);\n    return Number.isFinite(n) ? n.toFixed(1).replace('.0','') + '/20' : '—';\n  }\n\n  function hideHomeSections(){\n    $('home')?.style.setProperty('display','none','important');\n    $('detail')?.style.setProperty('display','none','important');\n  }\n\n  function showProgressPage(){\n    const profile = window.currentMathProfile;\n    if(!profile || profile.role !== 'student') return;\n    hideHomeSections();\n    $('progressPage')?.classList.add('open');\n    document.querySelectorAll('.role-nav-btn').forEach(btn=>btn.classList.remove('active'));\n    $('studentProgressBtn')?.classList.add('active');\n    loadProgressData();\n  }\n\n  function backToHomeFromProgress(){\n    $('progressPage')?.classList.remove('open');\n    $('home')?.style.removeProperty('display');\n    document.querySelectorAll('.role-nav-btn').forEach(btn=>btn.classList.remove('active'));\n    document.querySelector('.common-nav')?.classList.add('active');\n  }\n\n  async function loadProgressData(){\n    const profile = window.currentMathProfile;\n    const db = window.mathSupabase;\n    const host = $('progressChaptersGrid');\n\n    if(!profile || profile.role !== 'student' || !db || !host) return;\n\n    host.innerHTML = '<div class=\"progress-loading\">Chargement de tes progrès…</div>';\n\n    try{\n      const qRes = await db\n        .from('math_quizzes')\n        .select('id,title,chapter_number,active')\n        .eq('active',true)\n        .order('chapter_number',{ascending:true});\n\n      if(qRes.error) throw qRes.error;\n\n      const quizzes = qRes.data || [];\n      const quizIds = quizzes.map(q=>q.id);\n\n      let attempts = [];\n      if(quizIds.length){\n        const aRes = await db\n          .from('math_quiz_attempts')\n          .select('id,quiz_id,student_id,attempt_number,score_20,percentage,passed,created_at')\n          .eq('student_id',profile.id)\n          .in('quiz_id',quizIds)\n          .order('created_at',{ascending:false});\n\n        if(aRes.error) throw aRes.error;\n        attempts = aRes.data || [];\n      }\n\n      const attemptsByQuiz = new Map();\n      attempts.forEach(a=>{\n        if(!attemptsByQuiz.has(a.quiz_id)) attemptsByQuiz.set(a.quiz_id,[]);\n        attemptsByQuiz.get(a.quiz_id).push(a);\n      });\n\n      const chaptersWithQuiz = new Set(quizzes.map(q=>Number(q.chapter_number)));\n      const chaptersWithAttempts = new Set();\n      let doneCount = 0;\n      let passedCount = 0;\n      let bestOverall = null;\n\n      const chapterData = [];\n\n      for(let chapterNo=1; chapterNo<=19; chapterNo++){\n        const chapterQuizzes = quizzes.filter(q=>Number(q.chapter_number)===chapterNo);\n        const chapterAttempts = [];\n\n        chapterQuizzes.forEach(q=>{\n          const arr = attemptsByQuiz.get(q.id) || [];\n          arr.forEach(a=>chapterAttempts.push(a));\n        });\n\n        chapterAttempts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));\n\n        const latest = chapterAttempts[0] || null;\n        const best = chapterAttempts.length\n          ? chapterAttempts.reduce((m,a)=>Number(a.score_20)>Number(m.score_20)?a:m,chapterAttempts[0])\n          : null;\n\n        if(chapterAttempts.length){\n          chaptersWithAttempts.add(chapterNo);\n          doneCount += chapterQuizzes.filter(q=>(attemptsByQuiz.get(q.id)||[]).length>0).length;\n          passedCount += chapterQuizzes.filter(q=>{\n            const arr = attemptsByQuiz.get(q.id) || [];\n            return arr.length && arr[0].passed === true;\n          }).length;\n\n          chapterAttempts.forEach(a=>{\n            const n = Number(a.score_20);\n            if(Number.isFinite(n) && (bestOverall===null || n>bestOverall)) bestOverall=n;\n          });\n        }\n\n        chapterData.push({\n          chapterNo,\n          chapterQuizzes,\n          chapterAttempts,\n          latest,\n          best\n        });\n      }\n\n      const uniqueDoneQuizIds = new Set(attempts.map(a=>a.quiz_id));\n      doneCount = uniqueDoneQuizIds.size;\n\n      const latestByQuiz = new Map();\n      attempts.forEach(a=>{\n        if(!latestByQuiz.has(a.quiz_id)) latestByQuiz.set(a.quiz_id,a);\n      });\n      passedCount = [...latestByQuiz.values()].filter(a=>a.passed===true).length;\n\n      $('progressDoneCount').textContent = String(doneCount);\n      $('progressPassedCount').textContent = String(passedCount);\n      $('progressBestScore').textContent = bestOverall===null ? '—' : fmtScore(bestOverall);\n      $('progressChaptersCount').textContent = String(chaptersWithAttempts.size);\n\n      const totalActiveQuizzes = quizzes.length;\n      const progressPct = totalActiveQuizzes\n        ? Math.round((passedCount / totalActiveQuizzes) * 100)\n        : 0;\n\n      $('progressGlobalPercent').textContent = progressPct + '%';\n      $('progressBarFill').style.width = progressPct + '%';\n      $('progressGlobalText').textContent = totalActiveQuizzes\n        ? `${passedCount} quiz réussi${passedCount>1?'s':''} sur ${totalActiveQuizzes} disponible${totalActiveQuizzes>1?'s':''}.`\n        : 'Aucun quiz disponible pour le moment.';\n\n      host.innerHTML = '';\n\n      chapterData.forEach(info=>{\n        const card = document.createElement('div');\n        card.className = 'progress-chapter-card';\n\n        let statusClass = 'noquiz';\n        let statusText = 'Pas encore de quiz';\n\n        if(info.chapterQuizzes.length){\n          if(!info.latest){\n            statusClass = 'none';\n            statusText = 'Pas encore fait';\n          }else if(info.latest.passed === true){\n            statusClass = 'success';\n            statusText = 'Réussi';\n          }else{\n            statusClass = 'work';\n            statusText = 'À retravailler';\n          }\n        }\n\n        card.innerHTML = `\n          <div class=\"progress-chapter-head\">\n            <div class=\"progress-chapter-number\">${info.chapterNo}</div>\n            <div class=\"progress-chapter-name\">${chapterNames[info.chapterNo]}</div>\n          </div>\n          <div class=\"progress-status ${statusClass}\">${statusText}</div>\n          <div class=\"progress-chapter-metrics\">\n            <div class=\"progress-metric\">\n              <strong>${info.latest ? fmtScore(info.latest.score_20) : '—'}</strong>\n              <span>Dernier</span>\n            </div>\n            <div class=\"progress-metric\">\n              <strong>${info.best ? fmtScore(info.best.score_20) : '—'}</strong>\n              <span>Meilleur</span>\n            </div>\n            <div class=\"progress-metric\">\n              <strong>${info.chapterAttempts.length}</strong>\n              <span>Tentatives</span>\n            </div>\n          </div>\n        `;\n\n        card.addEventListener('click',()=>{\n          parent.postMessage({\n            type:'openChapter',\n            n:info.chapterNo,\n            title:chapterNames[info.chapterNo] || ''\n          }, '*');\n        });\n\n        host.appendChild(card);\n      });\n\n    }catch(err){\n      console.error('Mes progrès :',err);\n      host.innerHTML =\n        '<div class=\"progress-loading\">Impossible de charger tes progrès pour le moment.</div>';\n    }\n  }\n\n  document.addEventListener('DOMContentLoaded',()=>{\n    $('studentProgressBtn')?.addEventListener('click',showProgressPage);\n    $('progressBackBtn')?.addEventListener('click',backToHomeFromProgress);\n\n    const homeBtn = document.querySelector('.common-nav');\n    homeBtn?.addEventListener('click',()=>{\n      $('progressPage')?.classList.remove('open');\n    });\n  });\n\n  window.openStudentProgressPage = showProgressPage;\n})();\n<\\/script>\n\n\\n<script>\\n/* ===== CORRECTIF POSITION DE LA PAGE MES PROGRÈS ===== */\\ndocument.addEventListener('DOMContentLoaded',()=>{\\n  const page=document.getElementById('progressPage');\\n  const main=document.querySelector('.layout > main');\\n\\n  if(page && main && page.parentElement!==main){\\n    main.appendChild(page);\\n  }\\n});\\n<\\\\/script>\\n</body>\n</html>\n";
